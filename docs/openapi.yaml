openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 4.4.0
  description: |
    Local REST API used by the Mini-Orca Compose Desktop client. The daemon is the
    LLM boundary. A user opens one Go file and declaration, starts a file-scoped
    conversation, then reviews an editable declaration draft before explicitly
    applying it. Source and diff views are read-only; no route creates multi-file
    changes, writes automatically, or exposes a browser IDE.
    Project import, semantic analysis, Analyze-all, and chat messages can send
    prompt content; a non-loopback provider requires explicit confirmation for
    each of those requests. Verified scans, validation, checks, Apply, and Undo
    do not send prompts and never run automatically.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Chat
  - name: Drafts
paths:
  /health:
    get:
      tags: [Daemon]
      summary: Health check
      responses:
        '200':
          description: Daemon is healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /status:
    get:
      tags: [Daemon]
      summary: Daemon workflow status
      responses:
        '200':
          description: Daemon status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /api/projects/current/chat/sessions:
    post:
      tags: [Chat]
      summary: Open a conversation pinned to one file, declaration, and optional reviewed task
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChatSessionRequest'}}}
      responses:
        '201': {description: Active file-scoped session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/chat/sessions/{sessionID}/messages:
    post:
      tags: [Chat]
      summary: Request a declaration proposal in an existing session
      description: The message body cannot change the session's project, file, mode, or declaration target. A repair is explicit and limited to the latest failed task draft.
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessageRequest'}}}
      responses:
        '200': {description: New editable declaration draft proposal, content: {application/json: {schema: {$ref: '#/components/schemas/ChatDraftProposal'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/models/current:
    get:
      tags: [Daemon]
      summary: Effective scoped model catalog
      responses:
        '200':
          description: Non-secret analyze, bug, and function model scopes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
  /api/projects/import:
    post:
      tags: [Projects]
      summary: Import and analyze a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectImportRequest'}
      responses:
        '200':
          description: Imported project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/restore:
    post:
      tags: [Projects]
      summary: Restore a previously imported project without model access
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRestoreRequest'}
      responses:
        '200':
          description: Restored project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/overview:
    get:
      tags: [Projects]
      summary: Source-free project workspace overview
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Deterministic metrics, optional structured analysis, coverage, and source-separated finding counts, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectOverview'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings:
    get:
      tags: [Projects]
      summary: List source-free verified findings and AI suggestions
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: source
          in: query
          schema: {type: string, enum: [ai, parser, vet, test]}
        - name: confidence
          in: query
          schema: {type: string, enum: [suggested, tool_reported]}
        - name: severity
          in: query
          schema: {type: string, enum: [low, medium, high]}
        - name: status
          in: query
          schema: {type: string, enum: [open, dismissed, fixed, retired]}
        - name: freshness
          in: query
          schema: {type: string, enum: [fresh, stale]}
      responses:
        '200': {description: Sanitized findings with their provenance and lifecycle, content: {application/json: {schema: {$ref: '#/components/schemas/FindingsResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/{findingID}:
    patch:
      tags: [Projects]
      summary: Update a finding's user triage status
      parameters:
        - name: findingID
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FindingTriageRequest'}}}
      responses:
        '204': {description: Triage status recorded.}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/scan:
    get:
      tags: [Projects]
      summary: Read explicit isolated Go scan progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free parser, vet, and test progress, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '204': {description: No verified scan exists for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start an isolated Go verified scan
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoScanRequest'}}}
      responses:
        '202': {description: Scan started, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Cancel the active isolated Go scan
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cancellation requested; completed phases remain available, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/symbols:
    get:
      tags: [Projects]
      summary: Atomic targets in one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Symbol facts for one project-relative eligible text file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SymbolsResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/impact:
    get:
      tags: [Projects]
      summary: Advisory index-based impact preview for one selected file or symbol
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - name: symbol
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Source-free advisory references that do not alter model context
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/git:
    get:
      tags: [Projects]
      summary: Read-only Git status for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Repository availability, branch, and target-file status
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job:
    get:
      tags: [Projects]
      summary: Sequential semantic-analysis job progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free project-scoped progress, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '204': {description: No Analyze-all job has been started for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start bounded sequential analysis
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Job accepted; one file is analyzed at a time, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/pause:
    post:
      tags: [Projects]
      summary: Pause after the current one-file analysis
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Paused job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/resume:
    post:
      tags: [Projects]
      summary: Resume a persisted paused job
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Resumed job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/cancel:
    post:
      tags: [Projects]
      summary: Cancel the active sequential analysis job
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Canceled job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance:
    get:
      tags: [Performance]
      summary: Read cached source-based performance review coverage and findings
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Queue-derived source-based review report, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceReport'}}}}
        '204': {description: No performance review has been started for this project revision.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance/context:
    get:
      tags: [Performance]
      summary: Preview a policy-filtered bounded performance queue without provider work
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: max_files, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: run_budget_seconds, in: query, schema: {type: integer, minimum: 1, maximum: 3600}}
      responses:
        '200': {description: Source-free queue and configured Analysis-model manifest, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceQueuePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job:
    get:
      tags: [Performance]
      summary: Read persisted bounded performance-review progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free progress, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '204': {description: No performance job has been started for this project revision.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Performance]
      summary: Explicitly start a bounded sequential source-based performance review
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJobRequest'}}}
      responses:
        '202': {description: Job accepted; only one file is reviewed at a time, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/pause:
    post:
      tags: [Performance]
      summary: Pause a performance review after its active file finishes
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: expected_job_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Paused job, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/resume:
    post:
      tags: [Performance]
      summary: Resume a compatible paused performance job with fresh provider confirmation
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJobRequest'}}}
      responses:
        '202': {description: Resumed job, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/cancel:
    post:
      tags: [Performance]
      summary: Cancel active or pending performance review work
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: expected_job_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Canceled job; completed cached reports remain available, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}:
    patch:
      tags: [Drafts]
      summary: Create the next draft revision from a declaration/import edit
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftUpdateRequest'}}}
      responses:
        '200': {description: Updated draft revision with prior validation and check evidence cleared, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}/validate:
    post:
      tags: [Drafts]
      summary: Compose and validate one exact declaration draft revision
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftValidationRequest'}}}
      responses:
        '200': {description: Valid or invalid draft with read-only composition evidence, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}/checks:
    post:
      tags: [Drafts]
      summary: Run focused checks for one validated declaration revision
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftCheckRequest'}}}
      responses:
        '200': {description: Isolated check report for the displayed revision and hash, content: {application/json: {schema: {$ref: '#/components/schemas/DraftCheckReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/apply:
    post:
      tags: [Drafts]
      summary: Explicitly apply one validated and checked declaration draft
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApplyRequest'}}}
      responses:
        '200': {description: Atomic one-file apply result with Undo metadata}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/undo:
    post:
      tags: [Drafts]
      summary: Undo the immediately preceding unchanged apply
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UndoRequest'}}}
      responses:
        '200': {description: Atomic one-file undo result}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: {type: string}
    DraftID:
      name: draftID
      in: path
      required: true
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: single_coder_preview}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: [analyze, bug, function]}
        profile: {type: string, enum: [analyze, bug, function]}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured Chat Completions reasoning effort.}
        provider_origin: {type: string, description: Sanitized scheme, host, and optional port only.}
        remote_provider: {type: boolean}
        temperature: {type: number}
        max_tokens: {type: integer}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
    ModelCatalog:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: object
          required: [analyze, bug, function]
          properties:
            analyze: {$ref: '#/components/schemas/ScopedModel'}
            bug: {$ref: '#/components/schemas/ScopedModel'}
            function: {$ref: '#/components/schemas/ScopedModel'}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    ProjectRestoreRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path of a previously imported local project.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        summary: {type: string}
        ai_status: {type: string}
        report: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analyzed_at: {type: string, format: date-time}
    ProjectOverview:
      type: object
      required: [project_id, project_revision, metrics, analysis, analysis_coverage, finding_counts]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        metrics: {$ref: '#/components/schemas/ProjectMetrics'}
        analysis: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analysis_coverage: {$ref: '#/components/schemas/AnalysisCoverage'}
        finding_counts: {$ref: '#/components/schemas/FindingCounts'}
    ProjectMetrics:
      type: object
      required: [type, file_count, source_file_count, total_lines, languages]
      properties:
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
    ProjectAnalysisReport:
      type: object
      required: [schema_version, project_id, project_revision, components, entry_points, flows, risks, next_steps, status, model, profile, prompt_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        purpose: {type: string}
        architecture: {type: string}
        components: {type: array, items: {type: string}}
        entry_points: {type: array, items: {type: string}}
