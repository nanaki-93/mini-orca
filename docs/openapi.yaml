    get:
      tags: [Projects]
      summary: List source-free verified findings and AI suggestions
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: source
          in: query
          schema: {type: string, enum: [ai, parser, vet, test]}
        - name: confidence
          in: query
          schema: {type: string, enum: [suggested, tool_reported]}
        - name: severity
          in: query
          schema: {type: string, enum: [low, medium, high]}
        - name: status
          in: query
          schema: {type: string, enum: [open, dismissed, fixed, retired]}
        - name: freshness
          in: query
          schema: {type: string, enum: [fresh, stale]}
      responses:
        '200': {description: Sanitized findings with their provenance and lifecycle, content: {application/json: {schema: {$ref: '#/components/schemas/FindingsResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/{findingID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    patch:
      tags: [Projects]
      summary: Update a finding's user triage status
      parameters:
        - name: findingID
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FindingTriageRequest'}}}
      responses:
        '204': {description: Triage status recorded.}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/scan:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read explicit Go scan progress from a temporary copied workspace
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free workspace preparation, parser, vet, and test progress; bounded workspace failures include sanitized evidence, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '204': {description: No verified scan exists for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start a Go verified scan in a temporary copied workspace
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoScanRequest'}}}
      responses:
        '202': {description: Scan started, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Cancel the active temporary-workspace Go scan
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cancellation requested; completed phases remain available, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/events:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Stream Server-Sent Events (SSE) for project analysis, scan, and workflow progress
      responses:
        '200':
          description: Server-Sent Events stream of ready and update notifications.
          content:
            text/event-stream:
              schema:
                type: string
  /api/projects/current/execution-trust:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the current project's trusted local execution scope
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: task_test_name
          in: query
          required: false
          schema: {type: string}
          description: Exact generated Go test name for a task-test trust preview.
      responses:
        '200': {description: Remembered project trust bound to current sources and the exact command scope, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Save or revoke local execution trust for the current project path
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrustRequest'}}}
      responses:
        '200': {description: Project trust decision saved in private user settings, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/symbols:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Atomic targets in one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Symbol facts for one project-relative eligible text file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SymbolsResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/impact:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Advisory index-based impact preview for one selected file or symbol
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - name: symbol
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Source-free advisory references that do not alter model context
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/git:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read-only Git status for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Repository availability, branch, and target-file status
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/security-scan:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Scan exactly one eligible Go file with deterministic source-only security rules
      description: Applies the current Go ruleset without provider access or subprocess execution. A rule match requires syntactic review and is not proof of exploitability.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityScanRequest'}}}
      responses:
        '200': {description: Source-free deterministic Security report; partial reports retain the first five source-order matches and state that coverage limit, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/explanation:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Explain one exact indexed Go declaration without creating workflow state
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanationRequest'}}}
      responses:
        '200': {description: Transient bounded explanation with source anchors and Function-context provenance, content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/security-review:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Perform one explicit passive AI security review of one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityReviewRequest'}}}
      responses:
        '200': {description: Source-free advisory report; completed_empty does not mean the file is secure, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    AgentProjectID:
      in: query
      name: project_id
      required: true
      schema: {type: string}
    AgentRunID:
      in: path
      name: runID
      required: true
      schema: {type: string}
    WorktreePath:
      in: query
      name: worktree_path
      required: false
      description: Optional absolute path of another registered worktree in the active repository. Requests use that checkout's project identity, jobs, trust and proposal guards without changing the active project. Membership is rechecked on every request.
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    AgentRemote:
      type: object
      required: [config, configuration, state]
      properties:
        config:
          type: object
          required: [id, card_url, endpoint, skills, timeout_seconds]
          properties:
            id: {type: string}
            card_url: {type: string, format: uri}
            endpoint: {type: string, format: uri}
            bearer_token_env: {type: string, description: Credential reference only; never the resolved secret.}
            skills: {type: array, minItems: 1, maxItems: 4, items: {type: string}}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
        configuration: {type: string}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        inventory:
          type: object
          required: [fingerprint, name, description, version, streaming, skills]
          properties:
            fingerprint: {type: string}
            name: {type: string}
            description: {type: string}
            version: {type: string}
            streaming: {type: boolean}
            skills:
              type: array
              maxItems: 4
              items:
                type: object
                required: [id, name, description]
                properties:
                  id: {type: string}
                  name: {type: string}
                  description: {type: string}
    ExternalSource:
      type: object
      additionalProperties: false
      required: [path, hash]
      properties:
        path: {type: string}
        hash: {type: string, description: Current captured source hash.}
    DelegationRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, remote, kind, skill, question, confirm_delegate]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        remote: {$ref: '#/components/schemas/IntegrationUse'}
        kind: {type: string, enum: [analysis, review]}
        skill: {type: string, description: Allowlisted advertised skill ID.}
        question: {type: string, minLength: 1, maxLength: 2048, description: Limit is UTF-8 bytes; newline/tab permitted, other controls rejected.}
        sources: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/ExternalSource'}}
        stream: {type: boolean, default: false, description: Explicit SSE request; requires advertised support.}
        confirm_delegate: {type: boolean, enum: [true]}
    DelegationControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, version, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [input, refresh, reconnect, cancel, reconcile]}
        remote: {$ref: '#/components/schemas/IntegrationUse'}
        reply: {type: string, maxLength: 2048, description: Input only; UTF-8 byte limit. Requires remote.confirm_source_sharing.}
        observation: {type: string, maxLength: 2048, description: Reconciliation only; user-reported external outcome, never remote verification.}
        stream: {type: boolean, default: false, description: Input only. Reconnect always subscribes using SSE.}
        confirm: {type: boolean, enum: [true]}
    RemoteProgress:
      type: object
      required: [state, artifacts, usage]
      properties:
        task_id: {type: string}
        context_id: {type: string}
        state: {type: string, enum: [submitted, working, input_required, auth_required, completed, failed, rejected, canceled, unknown, not_sent]}
        text: {type: string, description: Untrusted plain text; combined text/artifacts limited to 64 KiB.}
        artifacts:
          type: array
          nullable: true
          maxItems: 4
          items:
            type: object
            required: [id, name, text, complete]
            properties:
              id: {type: string}
              name: {type: string}
              text: {type: string}
              complete: {type: boolean}
        usage:
          type: object
          required: [input_tokens, output_tokens, source]
          properties:
            input_tokens: {type: integer, format: int64, minimum: 0}
            output_tokens: {type: integer, format: int64, minimum: 0}
            source: {type: string, enum: [unknown, remote_reported], description: Unknown counts are zero placeholders. Remote model/search call counts are never inferred.}
    AgentDelegation:
      type: object
      required: [id, version, project_id, project_revision, remote_id, endpoint_hash, card_fingerprint, skill, kind, question, policy, sources, input_hash, message_id, operation, attempt_id, state, progress, created_at, updated_at, lease_until, stale, active, advisory]
      properties:
        id: {type: string}
        version: {type: integer, format: int64}
        project_id: {type: string}
        project_revision: {type: string}
        remote_id: {type: string}
        endpoint_hash: {type: string}
        card_fingerprint: {type: string}
        skill: {type: string}
        kind: {type: string, enum: [analysis, review]}
        question: {type: string, description: Empty on list responses.}
        policy: {type: string}
        sources: {type: array, nullable: true, maxItems: 8, items: {$ref: '#/components/schemas/MemorySource'}}
        input_hash: {type: string}
        message_id: {type: string}
        operation: {type: string, enum: [start, input, refresh, reconnect, cancel, reconcile]}
        attempt_id: {type: string}
        state: {type: string, enum: [pending, submitted, working, input_required, auth_required, completed, failed, rejected, canceled, unknown, not_sent, reconciled]}
        progress: {$ref: '#/components/schemas/RemoteProgress'}
        observation: {type: string, description: User-reported reconciliation; omitted on list responses.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        lease_until: {type: string, format: date-time, description: Zero timestamp when no pending lease remains.}
        stale: {type: boolean, description: Detail rechecks actual sources; list checks revision only.}
        active: {type: boolean, description: An operation currently owned by this daemon.}
        advisory: {type: boolean, enum: [true]}
    AgentAPI:
      type: object
      required: [config, configuration, state]
      properties:
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        config:
          type: object
          required: [id, spec_path, endpoint, operations, timeout_seconds]
          properties:
            id: {type: string}
            spec_path: {type: string, description: Indexed project-relative OpenAPI 3.0 JSON specification.}
            endpoint: {type: string, format: uri}
            bearer_token_env: {type: string, description: Credential environment reference only.}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
            operations:
              type: array
              minItems: 1
              maxItems: 4
              items:
                type: object
                required: [name, effect]
                properties:
                  name: {type: string}
                  effect: {type: string, enum: [read_external, mutate_external]}
        inventory:
          type: object
          required: [fingerprint, operations]
          properties:
            fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
            operations: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/APIOperation'}}
    APIOperation:
      type: object
      required: [id, method, path, effect, description, parameters, input_schema, responses]
      properties:
        id: {type: string}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        path: {type: string}
        effect: {type: string, enum: [read_external, mutate_external]}
        description: {type: string, maxLength: 512}
        input_schema: {type: object, additionalProperties: true}
        responses: {type: object, additionalProperties: {type: object, nullable: true, additionalProperties: true}, description: Exact successful HTTP status keys; null denotes empty 204.}
        parameters:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, in, required, schema]
            properties:
              name: {type: string}
              in: {type: string, enum: [path, query]}
              required: {type: boolean}
              schema: {type: object, additionalProperties: true}
              style: {type: string, enum: [simple, form]}
              explode: {type: boolean}
              description: {type: string}
    APIActionControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, version, request_hash, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [approve, reconcile]}
        version: {type: integer, format: int64, minimum: 1}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm: {type: boolean, enum: [true]}
        reported_outcome: {type: string, enum: [applied, not_applied, other], description: Required only for reconciliation.}
        observation: {type: string, description: Required nonempty user account up to 2048 bytes for reconciliation; forbidden for approval.}
    AgentAPIAction:
      type: object
      required: [id, version, project_id, project_revision, integration_id, inventory, scope, operation_key, request, arguments, request_hash, state, created_at, updated_at, expires_at, can_approve, can_reconcile, stale]
      properties:
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        project_id: {type: string}
        project_revision: {type: string}
        integration_id: {type: string}
        inventory: {type: string}
        scope: {type: string}
        operation_key: {type: string}
        request_hash: {type: string}
        arguments: {type: object, additionalProperties: true}
        request:
          type: object
          required: [operation_id, operation_key, method, url]
          properties:
            operation_id: {type: string}
            operation_key: {type: string}
            method: {type: string}
            url: {type: string, format: uri}
            body: {type: object, additionalProperties: true}
        state: {type: string, enum: [candidate, pending, completed, not_sent, unknown, reconciled]}
        http_status: {type: integer}
        response: {type: object, additionalProperties: true}
        response_hash: {type: string}
        reported_outcome: {type: string, enum: [applied, not_applied, other]}
        observation: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        pending_until: {type: string, format: date-time}
        can_approve: {type: boolean}
        can_reconcile: {type: boolean}
        stale: {type: boolean}
    ResearchRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, question, confirm_search, confirm_source_sharing]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        question: {type: string, description: Nonempty question up to 2048 UTF-8 bytes.}
        sources:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [path, hash]
            properties:
              path: {type: string}
              hash: {type: string}
        confirm_search: {type: boolean, enum: [true]}
        confirm_source_sharing: {type: boolean, enum: [true]}
        confirm_remote_provider: {type: boolean, default: false}
    ResearchReport:
      type: object
      required: [id, project_id, project_revision, title, state, model, created_at, stale]
      properties:
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        title: {type: string}
        state: {type: string, enum: [grounded, uncited, ungrounded]}
        model: {type: string}
        created_at: {type: string, format: date-time}
        stale: {type: boolean, description: Revision comparison in list metadata; report rendering additionally checks admitted sources and policy.}
    ResearchOverview:
      type: object
      required: [state, model, reports]
      properties:
        state: {type: string, enum: [available, disabled, unsupported_profile]}
        model: {type: string}
        reports: {type: array, items: {$ref: '#/components/schemas/ResearchReport'}}
    IntegrationUse:
      type: object
      additionalProperties: false
      required: [id, grant, schema_fingerprint, confirm_source_sharing]
      properties:
        id: {type: string, maxLength: 24}
        grant: {type: string, description: Current in-memory discovery grant; invalidated by revoke, reindex, replacement or restart.}
        schema_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm_source_sharing: {type: boolean, enum: [true], description: Approve this investigation's admitted prompt, source, skill and memory context reaching this server.}
    IntegrationControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, configuration]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [discover, revoke]}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        grant: {type: string, description: Required to revoke an existing inventory.}
        confirm_connect: {type: boolean, default: false, description: Required true for discovery; explicitly approves endpoint access or launching the configured installed process.}
    AgentIntegration:
      type: object
      required: [config, configuration, state]
      properties:
        config:
          type: object
          required: [id, transport, tools, timeout_seconds]
          properties:
            id: {type: string}
            transport: {type: string, enum: [stdio, streamable_http]}
            endpoint: {type: string}
            bearer_token_env: {type: string, description: Environment variable reference only; never its value.}
            command: {type: string, description: Absolute installed executable.}
            args: {type: array, maxItems: 16, items: {type: string}}
            environment: {type: object, additionalProperties: {type: string}, description: Child variable to explicit credential variable reference.}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
            tools:
              type: array
              maxItems: 4
              items:
                type: object
                properties:
                  name: {type: string}
                  effect: {type: string, enum: [read_external]}
        configuration: {type: string}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        inventory:
          type: object
          required: [fingerprint, tools]
          properties:
            fingerprint: {type: string}
            tools:
              type: array
              maxItems: 4
              items:
                type: object
                required: [remote_name, name, description, input_schema, output_schema]
                properties:
                  remote_name: {type: string}
                  name: {type: string, description: Stable local alias used by the investigation.}
                  description: {type: string, maxLength: 1024}
                  input_schema: {type: object, additionalProperties: true}
                  output_schema: {type: object, additionalProperties: true}
    MemorySource:
      type: object
      additionalProperties: false
      required: [path, hash]
      properties:
        path: {type: string, description: Bounded relative source path; no traversal or excluded files.}
        hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        start_line: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        end_line: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      description: Both lines zero means whole file; otherwise an inclusive valid span. Hash must match current source.
    MemoryDraft:
      type: object
      additionalProperties: false
      required: [kind, title, sources]
      properties:
        kind: {type: string, enum: [decision, lesson, verified_outcome]}
        title: {type: string, description: Nonempty title up to 120 UTF-8 bytes without control characters.}
        text: {type: string, description: Nonempty manual advice up to 2048 UTF-8 bytes; must be empty when deriving a proposal receipt or retained harness lesson.}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MemorySource'}}
        retention_days: {type: integer, minimum: 1, maximum: 365, default: 30}
        session_id: {type: string}
        identity: {$ref: '#/components/schemas/ChangeIdentity'}
        lesson_index: {type: integer, minimum: 0}
      description: Verified outcomes require session_id and exact identity with live passing check receipts. Retained harness lessons also select lesson_index. Manual decisions/lessons omit these fields. Editing always resets acceptance.
    MemoryMutation:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, version]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [create, edit, accept, forget]}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        draft: {$ref: '#/components/schemas/MemoryDraft'}
      description: Create uses the collection route and version zero. Other actions use the detail route and current positive version. Create/edit require draft; accept/forget reject it.
    AgentMemory:
      type: object
      required: [id, version, project_id, project_revision, policy, kind, state, title, text, sources, provenance, created_at, updated_at, expires_at, stale, expired, source_status]
      properties:
        id: {type: string}
        version: {type: integer, format: int64}
        project_id: {type: string}
        project_revision: {type: string}
        policy: {type: string}
        kind: {type: string, enum: [decision, lesson, verified_outcome]}
        state: {type: string, enum: [candidate, accepted]}
        title: {type: string}
        text: {type: string, description: Empty on list; private advisory text on detail and mutation responses.}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MemorySource'}}
        provenance:
          type: object
          required: [origin]
          properties:
            origin: {type: string, enum: [user, proposal_checks, harness_lesson]}
            session_id: {type: string}
            workflow_id: {type: string}
            proposal_hash: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        stale: {type: boolean, description: Revision differs; detail also includes changed source/policy. Revision-only stale advice may remain eligible.}
        expired: {type: boolean}
        source_status: {type: string, enum: [unchecked, current, changed], description: List does not read source; detail checks source and policy. Acceptance alone does not guarantee retrieval eligibility.}
    AgentUsage:
      type: object
      description: Shared budget totals across descendants; do not add child totals together.
      properties:
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        unknown_usage_calls: {type: integer}
        reserved_input_tokens: {type: integer, format: int64}
        reserved_output_tokens: {type: integer, format: int64}
        active_calls: {type: integer}
        elapsed_millis: {type: integer, format: int64}
    AgentLimits:
      type: object
      properties:
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        elapsed_seconds: {type: integer}
        concurrent_calls: {type: integer}
    AgentCheckpoint:
      type: object
      properties:
        request_id: {type: string}
        node_id: {type: string, enum: [human_review]}
        invocation_id: {type: string}
        expires_at: {type: string, format: date-time}
        decision: {type: string, enum: [approve, reject, cancel, expire]}
        received_at: {type: string, format: date-time}
    AgentRun:
      type: object
      required: [id, root_id, project_id, project_revision, kind, status, active, stale, can_cancel, usage, limits, started_at, updated_at]
      properties:
        change_session_id: {type: string}
        workflow_id: {type: string}
        id: {type: string}
        root_id: {type: string}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        status: {type: string, enum: [running, canceling, waiting_input, completed, failed, canceled, expired, interrupted, changes_requested]}
        active: {type: boolean}
        stale: {type: boolean}
        can_cancel: {type: boolean}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        input: {$ref: '#/components/schemas/AgentCheckpoint'}
    AgentRunList:
      type: object
      required: [project_id, project_revision, runs]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        runs: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentRun'}}
        next_cursor: {type: string}
    AgentArtifactReference:
      type: object
      required: [session, name, version]
      properties:
        session:
          type: object
          required: [app, user, id]
          properties:
            app: {type: string}
            user: {type: string}
            id: {type: string}
        name: {type: string, enum: [completion.json]}
        version: {type: integer, format: int64, minimum: 1}
    AgentRunEvent:
      type: object
      required: [sequence, run_id, invocation_id, project_id, project_revision, kind, state, time, usage]
      properties:
        sequence: {type: integer, minimum: 1}
        run_id: {type: string, description: Root invocation identity.}
        invocation_id: {type: string, description: Native child or root invocation identity.}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        node_id: {type: string}
        request_id: {type: string}
        kind: {type: string, enum: [started, finished, node, input_requested, input_received, input_finished]}
        state: {type: string}
        time: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        evidence: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentArtifactReference'}}
    AgentEventBatch:
      type: object
      required: [project_id, project_revision, epoch, cursor, reset, has_more, events]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        epoch: {type: string}
        cursor: {type: string}
        reset: {type: boolean, description: Replace local state with the current snapshot at this cursor.}
        has_more: {type: boolean}
        events: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        snapshot: {$ref: '#/components/schemas/AgentRunList'}
    AgentRunDetail:
      type: object
      required: [run, invocations, has_more, events, events_truncated]
      properties:
        run: {$ref: '#/components/schemas/AgentRun'}
        invocations: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRun'}}
        has_more: {type: boolean}
        events: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        events_truncated: {type: boolean}
        input: {$ref: '#/components/schemas/ChangeInput'}
        text:
          type: object
          description: Present only with explicit include_text. Private model text is bounded to 64 KiB UTF-8; transient partial buffers cover at most 64 invocations. Tool disclosures contain at most 16 records from the selected invocation's last 128 events. Grounded research returns research_report_required without text so citations and Search suggestions remain together in its report.
          required: [available, state, truncated]
          properties:
            available: {type: boolean}
            state: {type: string, enum: [unavailable, partial_model_output, final_model_output]}
            text: {type: string}
            truncated: {type: boolean}
            artifact: {$ref: '#/components/schemas/AgentArtifactReference'}
            tools_truncated: {type: boolean}
            tool_records:
              type: array
              maxItems: 16
              items:
                type: object
                required: [event_id, name, kind, value, truncated]
                properties:
                  event_id: {type: string}
                  call_id: {type: string, maxLength: 128}
                  name: {type: string, maxLength: 128}
                  kind: {type: string, enum: [arguments, result]}
                  value: {type: string, description: JSON text bounded to 2048 UTF-8 bytes; credential-bearing keys are redacted and nested values are limited to 24 levels. Truncated text need not be valid JSON.}
                  truncated: {type: boolean}
    AgentRunControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [cancel]}
    Error:
      type: object
      required: [type, message, user_message]
      properties:
        type: {type: string}
        message: {type: string}
        user_message: {type: string}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: shared_proposals}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: ["", analyze, bug, function], description: Empty for unassigned catalog choices.}
        profile: {$ref: '#/components/schemas/ModelSelection'}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured reasoning effort supported by the selected provider.}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean, description: CLI providers always require confirmation because their downstream destination is not independently verified.}
        temperature: {type: number, nullable: true, description: Null for CLI providers without sampling controls.}
        max_tokens: {type: integer, nullable: true, description: Null for CLI providers without output-token controls.}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
    ModelCapabilities:
      type: object
      description: Implemented adapter protocols, not model entitlements. Older metadata may omit this object; missing capabilities are unavailable.
      required: [completion, json_schema, tools, streaming, attachments, grounding, live_sessions]
      properties:
        completion: {type: boolean}
        json_schema: {type: boolean}
        tools: {type: boolean}
        streaming: {type: boolean}
        attachments: {type: boolean}
        grounding: {type: boolean}
        live_sessions: {type: boolean}
    ModelSelection:
      type: string
      minLength: 1
      maxLength: 644
      pattern: '^(analyze|bug|function|configured:[0-9a-fA-F]{64}|pi:[^/]+/.+|agy:[a-zA-Z0-9][a-zA-Z0-9._-]{0,511})$'
      description: Opaque ID returned by the available model catalog. Legacy analyze, bug and function profile names remain supported. Catalog membership is rechecked before admission; endpoints, executable paths and credentials cannot be supplied.
    AvailableModels:
      type: object
      required: [models, defaults, pi, agy]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelChoice'}
        defaults:
          type: object
          required: [analyze, bug, function]
          properties:
            analyze: {$ref: '#/components/schemas/ModelSelection'}
            bug: {$ref: '#/components/schemas/ModelSelection'}
            function: {$ref: '#/components/schemas/ModelSelection'}
        pi:
          $ref: '#/components/schemas/ModelDiscovery'
        agy:
          $ref: '#/components/schemas/ModelDiscovery'
    ModelDiscovery:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        message: {type: string, description: Sanitized discovery failure and recovery guidance.}
    ModelChoice:
      type: object
      required: [id, name, provider, source, location, model]
      properties:
        id: {$ref: '#/components/schemas/ModelSelection'}
        name: {type: string}
        provider: {type: string, description: Transport provider for configured or Agy models; Pi provider ID for Pi models.}
        source: {type: string, enum: [configured, pi, agy]}
        location: {type: string, enum: [local, remote, unknown], description: Pi location is inferred from catalog baseUrl metadata; Agy location is unknown because its catalog omits endpoints. It does not waive CLI prompt consent or verify availability of the endpoint.}
        model: {$ref: '#/components/schemas/ScopedModel'}
    ModelCatalog:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: object
          required: [analyze, bug, function]
          properties:
            analyze: {$ref: '#/components/schemas/ScopedModel'}
            bug: {$ref: '#/components/schemas/ScopedModel'}
            function: {$ref: '#/components/schemas/ScopedModel'}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    ProjectRestoreRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path of a previously imported local project.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        summary: {type: string}
        ai_status: {type: string}
        report: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analyzed_at: {type: string, format: date-time}
    ProjectOverview:
      type: object
      required: [project_id, project_revision, metrics, analysis, analysis_coverage, finding_counts]
      properties:
        analysis_run: {$ref: '#/components/schemas/AnalysisRun'}
        project_id: {type: string}
        project_revision: {type: string}
        metrics: {$ref: '#/components/schemas/ProjectMetrics'}
        analysis: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        docs: {$ref: '#/components/schemas/ProjectDocsReport'}
        analysis_coverage: {$ref: '#/components/schemas/AnalysisCoverage'}
        finding_counts: {$ref: '#/components/schemas/FindingCounts'}
    ProjectDocsReport:
      type: object
      description: "Derived handbook composition. Version 2 anchors component paths and imports to inventory and labels model interpretations as advisory; missing scenario steps or guarantees are not synthesized. Legacy derived handbooks are rebuilt passively from retained reports and indexes."
      required: [schema_version, project_id, project_revision, status, context, components, scenarios, decisions, runbook, glossary]
      properties:
        schema_version: {type: string, enum: ['2']}
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string}
        context:
          type: object
          required: [purpose, topology, stack]
          properties:
            purpose: {type: string}
            topology: {type: string}
            stack: {type: array, items: {type: string}}
            architecture_diagram: {type: string}
        components: {type: array, items: {type: object}}
        scenarios: {type: array, items: {type: object}}
        decisions: {type: array, items: {type: object}}
        runbook: {type: array, items: {type: object}}
        glossary: {type: array, items: {type: object}}
        updated_at: {type: string}
    ProjectMetrics:
      type: object
      required: [type, file_count, source_file_count, total_lines, languages]
      properties:
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
    ProjectAnalysisReport:
      type: object
      required: [schema_version, project_id, project_revision, components, entry_points, flows, risks, next_steps, status, model, profile, prompt_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        purpose: {type: string}
        architecture: {type: string, description: "Advisory Mermaid flowchart for new reports; older reports may contain prose."}
        components: {type: array, items: {type: string}}
        entry_points: {type: array, items: {type: string}}
        flows: {type: array, description: "Advisory Mermaid flowcharts or sequence diagrams for new reports; older items may contain prose.", items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        next_steps: {type: array, items: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, stale, failed, unavailable]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalysisCoverage:
      type: object
      required: [total, fresh, stale, missing, failed, running, partial, unavailable]
      properties:
        total: {type: integer}
        fresh: {type: integer}
        stale: {type: integer}
        missing: {type: integer}
        failed: {type: integer}
        running: {type: integer}
        partial: {type: integer}
        unavailable: {type: integer}
    FindingCounts:
      type: object
      required: [verified, ai_suggestions]
      properties:
        verified: {type: integer, description: Count with non-AI source and tool_reported confidence.}
        ai_suggestions: {type: integer, description: Count with AI source and suggested confidence.}
    FindingsResponse:
      type: object
      required: [project_id, project_revision, findings]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/UnifiedFinding'}}
        completed: {type: array, description: "Merged finding targets for this project, independent of finding filters and evidence freshness.", items: {$ref: '#/components/schemas/FindingCompletion'}}
    FindingTarget:
      type: object
      additionalProperties: false
      required: [project_id, kind, id, path]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 1024, description: "Original finding project identity, retained when preparing in a worktree."}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string, minLength: 1, maxLength: 1024}
        path: {type: string, minLength: 1, maxLength: 1024, description: Project-relative finding path within the captured change paths.}
        source: {type: string, enum: [ai, deterministic], description: Required only for security findings; omitted for other producers.}
    FindingCompletion:
      type: object
      required: [project_id, kind, id, path, commit_oid]
      properties:
        project_id: {type: string}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string}
        path: {type: string}
        source: {type: string, enum: [ai, deterministic]}
        commit_oid: {type: string, description: Committed fix verified as an ancestor of the reviewed merged head.}
    UnifiedFinding:
      type: object
      required: [id, source, confidence, severity, title, message, project_id, project_revision, location, status, freshness, detected_at]
      properties:
        id: {type: string}
        category: {$ref: '#/components/schemas/FindingCategory'}
        source: {type: string, enum: [ai, parser, vet, test]}
        confidence: {type: string, enum: [suggested, tool_reported]}
        severity: {type: string, enum: [low, medium, high]}
        title: {type: string}
        message: {type: string}
        rule: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        file_hash: {type: string}
        location: {$ref: '#/components/schemas/FindingLocation'}
        evidence: {type: string, description: Sanitized and bounded tool or model evidence.}
        status: {type: string, enum: [open, dismissed, fixed, retired]}
        freshness: {type: string, enum: [fresh, stale]}
        detected_at: {type: string, format: date-time}
        originating_analysis: {type: string, enum: [project, file]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    EngineeringInsight:
      type: object
      required: [mechanism, why_it_matters_here]
      description: Optional AI interpretation attached to its parent result; it carries no navigation or mutation authority.
      properties:
        mechanism: {type: string, maxLength: 1000}
        why_it_matters_here: {type: string, maxLength: 1000}
        tradeoff_or_failure_mode: {type: string, maxLength: 1000}
        transferable_lesson: {type: string, maxLength: 1000}
    FindingLocation:
      type: object
      properties:
        path: {type: string, description: Project-relative path.}
        start_line: {type: integer}
        end_line: {type: integer}
        symbol: {type: string}
    FindingTriageRequest:
      type: object
      required: [project_revision, status]
      properties:
        project_revision: {type: string}
        status: {type: string, enum: [open, dismissed, fixed]}
    GoScanRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
    GoScanReport:
      type: object
      required: [project_id, project_revision, status, started_at, updated_at, phases]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, enum: [running, completed, canceled, failed]}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
