      required: [session_id, draft, assistant_message, context_manifest]
      properties:
        session_id: {type: string}
        draft: {$ref: '#/components/schemas/Draft'}
        assistant_message: {$ref: '#/components/schemas/ChatSessionMessage'}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
    Draft:
      type: object
      required: [id, project_id, project_revision, base_file_hash, target_path, mode, target_symbol, declaration, revision, hash, state]
      properties:
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        target_path: {type: string}
        mode: {type: string, enum: [replace_symbol, create_symbol]}
        target_symbol: {type: string}
        declaration: {type: string, description: The editable declaration only.}
        imports: {type: array, items: {type: string}}
        revision: {type: integer, format: int64}
        hash: {type: string}
        candidate_hash: {type: string}
        parent_draft_id: {type: string}
        previous_hash: {type: string}
