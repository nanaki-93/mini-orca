      properties:
        id: {type: string}
        rule: {type: string}
        category: {type: string}
        title: {type: string}
        source_anchor: {$ref: '#/components/schemas/SecuritySourceAnchor'}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        confidence: {type: string, enum: [high, medium, low]}
        evidence_kind: {type: string, enum: [rule_match, model_suspicion]}
        observed_condition: {type: string}
        preconditions_or_unknowns: {type: string}
        remediation: {type: string}
        verification_idea: {type: string, description: Safe verification idea only; no exploit execution occurs.}
        cwe: {type: string}
        reference: {type: string, format: uri}
        triage: {type: string, enum: [open, dismissed, accepted]}
        verification_state: {type: string, enum: [unverified, verified, not_reproducible]}
