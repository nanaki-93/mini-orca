      type: object
      required: [draft_id, draft_revision, draft_hash, project_id, project_revision, base_file_hash, confirm]
      properties:
        draft_id: {type: string}
        draft_revision: {type: integer, format: int64}
        draft_hash: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        confirm: {type: boolean, description: Must be true after the user reviews the file and declaration named by the draft.}
