        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        title: {type: string}
        acceptance_criteria: {type: array, items: {type: string}}
        finding_targets: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/FindingTarget'}}
        revision: {type: integer}
        hash: {type: string}
        state: {type: string, enum: [draft, applied, undone, prepared, undoing, recovery_required]}
        freshness: {type: string, enum: [current, stale]}
        plan: {$ref: '#/components/schemas/ChangePlan'}
        scope_suggestions: {type: array, items: {type: string}, description: Failed-check suggestions requiring a newly reviewed plan; never implicit scope changes for planned sessions.}
        reviewed_files: {type: array, uniqueItems: true, items: {type: string}}
        file_review_hash: {type: string}
        last_reviewed_hash: {type: string}
        last_reviewed_changes: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}}
        review_diff: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}, description: Differences from the last completely reviewed proposal to the current proposal.}
        targets: {type: array, items: {$ref: '#/components/schemas/ChangeTarget'}}
        changes: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}}
        messages:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              content: {type: string}
              created_at: {type: string, format: date-time}
        checks: {type: array, items: {$ref: '#/components/schemas/ChangeCheckResult'}}
        check_options: {type: object, properties: {run_tests: {type: boolean}, run_lint: {type: boolean}}}
        reviewed_hash: {type: string}
        repair_attempts: {type: integer, maximum: 3}
        workflow: {$ref: '#/components/schemas/ChangeWorkflow'}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
        instructions: {type: object, additionalProperties: {type: string}}
        policy_fingerprint: {type: string}
        workspace_hash: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChangeMutationResult:
      type: object
      properties:
        commit: {$ref: '#/components/schemas/ChangeCommit'}
        session_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        state: {type: string}
        hash: {type: string}
        undo_available: {type: boolean}
        index: {$ref: '#/components/schemas/ProjectIndex'}
        warnings: {type: array, items: {type: string}}
        verification: {$ref: '#/components/schemas/ChangeVerification'}
    ChangeHistoryEntry:
      type: object
      description: Local conversation summary; use a guarded selected read or resume for contents.
      required: [id, project_id, project_revision, kind, title, revision, hash, state, freshness, updated_at]
      properties:
        commit: {$ref: '#/components/schemas/ChangeCommit'}
        finding_targets: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/FindingTarget'}}
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        title: {type: string}
        revision: {type: integer}
        hash: {type: string}
        state: {type: string}
        freshness: {type: string}
        workflow_status: {type: string}
        updated_at: {type: string, format: date-time}
    ChangeVerification:
      type: object
      required: [schema_version, session_id, project_id, project_revision, proposal_hash, workspace_hash, status, checks, updated_at]
      properties:
        schema_version: {type: integer, enum: [1]}
        session_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        proposal_hash: {type: string}
        workspace_hash: {type: string}
        status: {type: string, enum: [verified, failed, unavailable, canceled, stale]}
        reason: {type: string}
        checks: {type: array, items: {type: object}}
        updated_at: {type: string, format: date-time}
    InstructionPreview:
      type: object
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        exists: {type: boolean}
        existing_content: {type: string}
        effective:
          type: object
          properties:
            text: {type: string}
            fingerprint: {type: string}
            excluded: {type: array, items: {type: object}}
            files:
              type: array
              items: {type: object, properties: {path: {type: string}, scope: {type: string}, content: {type: string}, hash: {type: string}}}
        presets:
          type: array
          description: Independently selectable guidelines grouped by common AGENTS.md sections, matched locally to eligible indexed source files, build manifests and imports in the target directory. Common project rules are also included. No provider request is made.
          items:
            type: object
            required: [id, label, category, content]
            properties:
              id: {type: string}
              label: {type: string}
              category:
                type: string
                enum: [Project overview and architecture, Build and development, Code style and conventions, Testing and validation, Security and data, UI and accessibility, Documentation, Review and handoff]
              content: {type: string}
              reason: {type: string, description: Why the guideline matches this scope.}
              evidence:
                type: array
                maxItems: 3
                description: Sorted example project-relative paths from the current index; absent for general guidelines.
                items: {type: string}
    FeatureRequest:
      type: object
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        expected_hash: {type: string}
        goals: {type: string, maxLength: 4096}
        confirm_remote_provider: {type: boolean}
      required: [project_id, project_revision, expected_hash]
    FeatureGenerateRequest:
      allOf:
        - {$ref: '#/components/schemas/FeatureRequest'}
        - type: object
          properties:
            profile: {$ref: '#/components/schemas/ModelSelection'}
            analysis_selection_id: {type: string}
    FeatureStatusRequest:
      allOf:
        - {$ref: '#/components/schemas/FeatureRequest'}
        - type: object
          required: [status]
          properties:
            status: {type: string, enum: [open, saved, dismissed]}
    FeatureReport:
      type: object
      description: Additive advisory feature history. Report-level revision, workspace, manifest and freshness describe only the most recent generation; each idea carries its own derived freshness. Saved history is bounded at 64 KiB; version 1 history is returned with a legacy generation until its next successful write.
      properties:
        schema_version: {type: integer, enum: [1, 2], description: Version of the stored history; 1 is unconverted legacy history still on disk.}
        project_id: {type: string}
        project_revision: {type: string}
        hash: {type: string}
        goals: {type: string}
        status: {type: string, enum: [not_generated, ready, failed]}
        freshness: {type: string, enum: [current, stale], description: Freshness of the most recent generation context only; it never revalidates older ideas.}
        failure: {type: string}
        workspace_hash: {type: string}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
        updated_at: {type: string, format: date-time}
        generations:
          type: array
          description: Provenance of successful generations still referenced by an idea or by last_generation.
          items: {$ref: '#/components/schemas/FeatureGeneration'}
        last_generation: {$ref: '#/components/schemas/FeatureGenerationOutcome'}
        suggestions:
          type: array
          description: Accumulated ideas in admission order, bounded by the 64 KiB history rather than an item count.
          items:
            type: object
            required: [id, title, benefit, evidence, paths, effort, acceptance_criteria, status, generation_id, freshness]
            properties:
              id: {type: string}
              title: {type: string}
              benefit: {type: string}
              evidence: {type: string}
              paths: {type: array, items: {type: string}}
              effort: {type: string, enum: [small, medium, large]}
              acceptance_criteria: {type: array, items: {type: string}}
              status: {type: string, enum: [open, saved, dismissed]}
              generation_id: {type: string, description: Generation that admitted this idea; legacy for version 1 ideas.}
              freshness: {type: string, enum: [current, stale], description: Derived on read; current only when this idea's generation matches the current revision, workspace fingerprint and goals.}
    FeatureGeneration:
      type: object
      required: [id, generated_at, project_revision, workspace_hash, goals_hash, model]
      properties:
        id: {type: string}
        generated_at: {type: string, format: date-time}
        project_revision: {type: string}
        workspace_hash: {type: string}
        goals_hash: {type: string, description: Empty when the goals behind legacy ideas are unknown; such ideas are stale.}
        model:
          type: object
          nullable: true
          description: Model that produced the generation, without endpoints or credentials; null when unknown.
          required: [profile, model, provider_origin, remote_provider]
          properties:
            profile: {type: string}
            model: {type: string}
            provider_origin: {type: string}
            remote_provider: {type: boolean}
    FeatureGenerationOutcome:
      type: object
      required: [generation_id, added_count, duplicate_count]
      description: Result of the most recent successful generation. added_count zero means no new suggestions were found.
      properties:
        generation_id: {type: string}
        added_count: {type: integer, minimum: 0, maximum: 5}
        duplicate_count: {type: integer, minimum: 0, maximum: 5}
    GitIdentity:
      type: object
      required: [head, branch]
      properties:
        head: {type: string}
        branch: {type: string}
    ChangeCommit:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [state, message]
          properties:
            state: {type: string, enum: [pending, failed, committed]}
            message: {type: string}
            oid: {type: string}
            error: {type: string}
    GitRepository:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [project_id, project_revision, available, root, at_root, dirty, conflicts]
          properties:
            project_id: {type: string}
            project_revision: {type: string}
            available: {type: boolean}
            root: {type: string}
            at_root: {type: boolean}
            dirty: {type: boolean}
            merge_head: {type: string}
            operation: {type: string}
            conflicts: {type: array, items: {type: string}}
    GitMutationRequest:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [project_id, project_revision]
          properties:
            project_id: {type: string}
            project_revision: {type: string}
            confirm: {type: boolean, description: Required true for mutations}
            confirm_execution: {type: boolean, description: Required true for mutations in addition to current project execution trust}
            target_branch: {type: string, description: New branch for worktrees; existing local branch for switch}
            path: {type: string, description: Absolute new path directly inside the project .worktrees directory or selected source path for merge or discard or cleanup-merged}
            source_head: {type: string, description: Reviewed source worktree HEAD for merge or preview or discard or cleanup-merged}
            source_branch: {type: string, description: Required source branch identity for discard or cleanup-merged}
            merge_head: {type: string, description: Identified MERGE_HEAD for abort}
    GitMutationResult:
      type: object
      required: [state, warnings]
      properties:
        state: {type: string, enum: [created, switched, merged, discarded, conflicts, aborted, failed]}
        path: {type: string}
        removed_worktree: {type: string, description: Absolute source worktree path returned only when removal after merge or discard or cleanup-merged completed}
        removed_branch: {type: string, description: Reviewed source branch returned only after guarded deletion following successful merge or cleanup-merged}
        completed: {type: array, description: "Finding completions persisted by this merge or cleanup, independent of later cleanup success", items: {$ref: '#/components/schemas/FindingCompletion'}}
        repository: {$ref: '#/components/schemas/GitRepository'}
        index: {$ref: '#/components/schemas/ProjectIndex'}
        error: {type: string}
        warnings: {type: array, items: {type: string}}
    GitMergePreview:
      type: object
      required: [target, source, path, diff, commits]
      properties:
        target: {$ref: '#/components/schemas/GitIdentity'}
        source: {$ref: '#/components/schemas/GitIdentity'}
        path: {type: string}
        diff: {type: string}
        commits: {type: string}
    GitWorkspace:
      allOf:
        - {$ref: '#/components/schemas/GitRepository'}
        - type: object
          required: [branches, worktrees]
          properties:
            branches:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  head: {type: string}
                  worktree_path: {type: string}
            worktrees:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/GitIdentity'}
                  - type: object
                    properties:
                      path: {type: string}
                      current: {type: boolean}
                      locked: {type: boolean}
                      prunable: {type: boolean}
                      dirty: {type: boolean, description: Omitted when status cannot be read}
                      mergeable: {type: boolean, description: Clean local branches with shared history and incoming commits; excludes current or locked or prunable worktrees and in-progress Git operations. Does not predict conflicts.}
                      integration: {type: string, enum: [current, merged, up_to_date, behind, unrelated], description: Passive ancestry comparison against the selected destination; merged includes equal HEADs and does not imply task verification or cleanup eligibility. Omitted if unavailable.}
                      overlap_paths: {type: array, items: {type: string}, description: Committed paths changed on both branches since their merge base; advisory overlap rather than predicted conflicts.}
                      completed: {type: array, items: {$ref: '#/components/schemas/ChangeHistoryEntry'}}
                      error: {type: string}
