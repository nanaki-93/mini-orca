      type: object
      required: [draft_id, draft_revision, draft_hash, available, trusted, benchmarks]
      properties:
        draft_id: {type: string}
        draft_revision: {type: integer, format: int64}
        draft_hash: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        target_path: {type: string}
        available: {type: boolean}
        trusted: {type: boolean, description: Current project-revision execution consent. False still returns command previews.}
        reason: {type: string}
        benchmarks: {type: array, items: {$ref: '#/components/schemas/GoBenchmarkChoice'}, description: Existing valid benchmark choices in the affected package.}
    GoBenchmarkChoice:
      type: object
      required: [name, command, scope]
      properties:
        name: {type: string}
        command: {type: array, items: {type: string}, description: Exact daemon-built argv preview.}
        scope: {type: string, description: Opaque selected-scope guard bound to the reviewed workspace fixture and required to run this displayed argv.}
    GoBenchmarkSample:
      type: object
      required: [iterations, ns_per_op, bytes_per_op, allocs_per_op]
      properties:
        iterations: {type: integer, format: int64, minimum: 1}
        ns_per_op: {type: number, format: double, minimum: 0, exclusiveMinimum: true}
        bytes_per_op: {type: integer, format: int64, minimum: 0}
        allocs_per_op: {type: integer, format: int64, minimum: 0}
    GoBenchmarkMeasurement:
      type: object
      required: [samples]
      properties:
        samples: {type: array, minItems: 5, maxItems: 5, items: {$ref: '#/components/schemas/GoBenchmarkSample'}}
    GoBenchmarkComparison:
      type: object
      required: [draft_id, draft_revision, draft_hash, status]
      properties:
        draft_id: {type: string}
        draft_revision: {type: integer, format: int64}
        draft_hash: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        target_path: {type: string}
        benchmark: {type: string}
        scope: {type: string}
        status: {type: string, enum: [completed, unavailable, failed, canceled]}
        reason: {type: string}
        command: {type: array, items: {type: string}, description: Fixed daemon-built argv preview.}
        base: {$ref: '#/components/schemas/GoBenchmarkMeasurement'}
        candidate: {$ref: '#/components/schemas/GoBenchmarkMeasurement'}
      allOf:
        - oneOf:
            - properties:
                status: {type: string, enum: [completed]}
              required: [status, base, candidate]
            - properties:
                status: {type: string, enum: [unavailable, canceled]}
              required: [status]
              not:
                anyOf:
                  - required: [base]
                  - required: [candidate]
            - properties:
                status: {type: string, enum: [failed]}
              required: [status]
              not:
                anyOf:
                  - required: [base]
                  - required: [candidate]
