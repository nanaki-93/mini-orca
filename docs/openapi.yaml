              stages:
                type: array
                description: Read-only current analysis status per stage. Empty for ineligible files. Does not dispatch analysis.
                items:
                  type: object
                  required: [stage, status, reason]
                  properties:
                    stage: {$ref: '#/components/schemas/AnalysisStage'}
