openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 4.1.0
  description: |
    Local REST API used by the Mini-Orca Compose Desktop client. The daemon is the
    LLM boundary and produces one-file, one-symbol previews; it does not expose a
    browser IDE or an autonomous multi-agent workflow. Generated code is preview-only.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Generation
paths:
  /health:
    get:
      tags: [Daemon]
      summary: Health check
      responses:
        '200':
          description: Daemon is healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /status:
    get:
      tags: [Daemon]
      summary: Daemon workflow status
      responses:
        '200':
          description: Daemon status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /api/system/info:
    get:
      tags: [Daemon]
      summary: Local daemon system information
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemInfo'}
  /api/models/current:
    get:
      tags: [Daemon]
      summary: Effective generation profile
      responses:
        '200':
          description: Active coder profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveModel'}
  /api/projects/import:
    post:
      tags: [Projects]
      summary: Import and analyze a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectImportRequest'}
      responses:
        '200':
          description: Imported project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current:
    get:
      tags: [Projects]
      summary: Active project analysis
      responses:
        '200':
          description: Active project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/symbols:
    get:
      tags: [Projects]
      summary: Atomic targets in one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Symbol facts for one project-relative eligible text file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SymbolsResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Clear one selected file analysis
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '204': {description: Analysis cache entry removed.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job:
    get:
      tags: [Projects]
      summary: Sequential semantic-analysis job progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free project-scoped progress, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '204': {description: No Analyze-all job has been started for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start bounded sequential analysis
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Job accepted; one file is analyzed at a time, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/pause:
    post:
      tags: [Projects]
      summary: Pause after the current one-file analysis
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Paused job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/resume:
    post:
      tags: [Projects]
      summary: Resume a persisted paused job
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Resumed job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/cancel:
    post:
      tags: [Projects]
      summary: Cancel the active sequential analysis job
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Canceled job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/candidates/checks:
    post:
      tags: [Generation]
      summary: Run focused checks for one validated candidate in an isolated workspace
      responses:
        '200': {description: Source-free candidate check report}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/apply:
    post:
      tags: [Generation]
      summary: Explicitly apply one checked candidate
      responses:
        '200': {description: Atomic one-file apply result with Undo metadata}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/undo:
    post:
      tags: [Generation]
      summary: Undo the immediately preceding unchanged apply
      responses:
        '200': {description: Atomic one-file undo result}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/audit:
    get:
      tags: [Generation]
      summary: Return source-free project mutation audit history
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free apply and undo audit entries}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
  /api/chat/message:
    post:
      tags: [Generation]
      summary: Generate one focused preview
      description: Generates a preview for one selected symbol in one selected file. No generated code is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationRequest'}
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/chat/history:
    get:
      tags: [Generation]
      summary: Current activity history
      responses:
        '200':
          description: Current project-scoped source-free activity history.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ChatEntry'}
components:
  parameters:
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: single_coder_preview}
    SystemInfo:
      type: object
      properties:
        cwd: {type: string}
        home_dir: {type: string}
        version: {type: string}
    EffectiveModel:
      type: object
      required: [profile, model, temperature, max_tokens, skills, timeout, max_retries]
      properties:
        profile: {type: string, example: coder}
        model: {type: string}
        temperature: {type: number}
        max_tokens: {type: integer}
        skills: {type: array, items: {type: string}}
        timeout: {type: string}
        max_retries: {type: integer}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, analysis_file, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        analysis_file: {type: string}
        summary: {type: string}
        ai_status: {type: string}
        analyzed_at: {type: string, format: date-time}
    FileInfo:
      type: object
      properties:
        path: {type: string}
        content_hash: {type: string, description: Hash required with a mutable request.}
        name: {type: string}
        extension: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        content: {type: string}
    ProjectIndex:
      type: object
      required: [schema_version, project_id, project_revision, generated_at, files]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        generated_at: {type: string, format: date-time}
        files:
          type: array
          items: {$ref: '#/components/schemas/IndexFile'}
    IndexFile:
      type: object
      required: [path, content_hash, language, size_bytes, line_count, modified_at, binary, imports, symbols, analysis_status]
      properties:
        path: {type: string, description: Project-relative safe path.}
        content_hash: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        imports: {type: array, items: {type: string}}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        analysis_status: {type: string}
    SymbolInfo:
      type: object
      required: [name, kind, signature, start_line, end_line, visibility, confidence, atomic_target]
      properties:
        name: {type: string}
        kind: {type: string}
        signature: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
        visibility: {type: string}
        confidence: {type: string, enum: [exact, approximate]}
        atomic_target: {type: boolean}
    Diagnostic:
      type: object
      properties:
        message: {type: string}
        line: {type: integer}
    SymbolsResponse:
      type: object
      required: [project_id, project_revision, path, language, symbols]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        language: {type: string}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
    ReindexRequest:
      type: object
      properties:
        project_revision: {type: string, description: Optional revision expected by the client.}
    FileAnalysisRequest:
      type: object
      required: [path, project_revision]
      properties:
        path: {type: string}
        project_revision: {type: string}
        refresh: {type: boolean}
        confirm_remote_provider: {type: boolean}
    FileAnalysis:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, language, status, prompt_version, context_policy_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        language: {type: string}
        purpose: {type: string}
        responsibilities: {type: array, items: {type: string}}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
        imports: {type: array, items: {type: string}}
        dependencies: {type: array, items: {type: string}}
        side_effects: {type: array, items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        symbol_explanations: {type: object, additionalProperties: {type: string}}
        status: {type: string, enum: [fresh, missing, stale, failed, running]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        context_policy_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalyzeAllRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
        max_files: {type: integer, minimum: 1, maximum: 500, description: Bounded cache-warming file budget.}
        max_retries: {type: integer, minimum: 0, maximum: 3}
        confirm_remote_provider: {type: boolean}
    AnalyzeAllJob:
      type: object
      required: [project_id, project_revision, status, max_files, max_retries, files, created_at, updated_at]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, enum: [running, paused, canceled, completed, stale]}
        max_files: {type: integer}
        max_retries: {type: integer}
        files:
          type: array
          items: {$ref: '#/components/schemas/AnalyzeAllFileJob'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AnalyzeAllFileJob:
      type: object
      required: [path, status, attempts]
      properties:
        path: {type: string, description: Eligible project-relative source file.}
        status: {type: string, enum: [pending, running, completed, failed]}
        attempts: {type: integer}
        error: {type: string, description: Sanitized per-file failure state.}
    Finding:
      type: object
      properties: {severity: {type: string}, summary: {type: string}}
    Suggestion:
      type: object
      properties: {title: {type: string}, summary: {type: string}, target_symbol: {type: string}, action: {type: string}}
    ContextManifest:
      type: object
      properties:
        included: {type: array, items: {$ref: '#/components/schemas/ContextFile'}}
        excluded: {type: array, items: {$ref: '#/components/schemas/ContextDecision'}}
        estimated_tokens: {type: integer}
        byte_limit: {type: integer}
        token_limit: {type: integer}
        truncated: {type: boolean}
    ContextFile:
      type: object
      properties:
        path: {type: string}
        size_bytes: {type: integer, format: int64}
        hash: {type: string}
        estimated_tokens: {type: integer}
        truncated: {type: boolean}
    ContextDecision:
      type: object
      properties:
        path: {type: string}
        include: {type: boolean}
        reason: {type: string}
    GenerationRequest:
      type: object
      required: [message, file_path, target_symbol, project_id, project_revision, base_file_hash]
      properties:
        message: {type: string}
        file_path: {type: string, description: Project-relative selected file.}
        target_symbol: {type: string, description: Selected function, method, type, interface, or class.}
        scope_mode: {type: string, enum: [strict_symbol, symbol_plus_imports], default: strict_symbol}
        project_id: {type: string, description: Stable id returned by project import.}
        project_revision: {type: string, description: Current project revision returned by project import.}
        base_file_hash: {type: string, description: Hash returned by selected-file information.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    GenerationResponse:
      type: object
      required: [generation_id, version, project_id, project_revision, base_file_hash, target_path, target_symbol, scope_mode, candidate_content, candidate_hash, effective_model, context_manifest]
      properties:
        generation_id: {type: string}
        version: {type: string, enum: [v1]}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string, description: Hash captured before the model request.}
        target_path: {type: string}
        target_symbol: {type: string}
        scope_mode: {type: string, enum: [strict_symbol, symbol_plus_imports]}
        candidate_content: {type: string, description: Unvalidated preview only; never persisted or applied by this endpoint.}
        candidate_hash: {type: string, description: Normalized SHA-256 hash of candidate_content.}
        rationale: {type: string}
        effective_model: {$ref: '#/components/schemas/EffectiveModel'}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
        validation: {$ref: '#/components/schemas/GenerationValidation'}
    GenerationValidation:
      type: object
      required: [applicable, scope_mode, diagnostics, diff]
      properties:
        applicable: {type: boolean}
        scope_mode: {type: string, enum: [strict_symbol, symbol_plus_imports]}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/GenerationFinding'}}
        diff: {$ref: '#/components/schemas/UnifiedDiff'}
    GenerationFinding:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
    UnifiedDiff:
      type: object
      properties:
        old_path: {type: string}
        new_path: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/DiffLine'}}
    DiffLine:
      type: object
      properties:
        kind: {type: string, enum: [context, added, removed]}
        old_line: {type: integer}
        new_line: {type: integer}
        text: {type: string}
    ChatEntry:
      type: object
      properties:
        role: {type: string}
        content: {type: string}
        phase: {type: string}
        timestamp: {type: string, format: date-time}
    Error:
      type: object
      required: [type, message, user_message, code]
      properties:
        type: {type: string}
        message: {type: string}
        user_message: {type: string}
        code: {type: integer}
