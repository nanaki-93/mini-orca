      properties:
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string, description: Current selected-file content hash.}
        path: {type: string, description: Exact eligible project-relative file path.}
        symbol: {type: string, description: Optional exact atomic indexed declaration; all returned anchors are restricted to it.}
        confirm_remote_provider: {type: boolean, description: Fresh Analyze-scope confirmation required for non-loopback providers.}
    DeclarationSourceAnchor:
      type: object
      required: [path, symbol, signature, start_line, end_line]
      properties:
        path: {type: string}
        symbol: {type: string}
        signature: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    UnifiedDiff:
      type: object
      properties:
        old_path: {type: string}
        new_path: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/DiffLine'}}
