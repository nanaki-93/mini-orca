      properties:
        code: {$ref: '#/components/schemas/ModelSelection'}
        performance: {$ref: '#/components/schemas/ModelSelection'}
        security: {$ref: '#/components/schemas/ModelSelection'}
        review: {$ref: '#/components/schemas/ModelSelection'}
