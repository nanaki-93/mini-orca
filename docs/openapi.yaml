      required: [project_id, project_revision, post_apply_hash, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        post_apply_hash: {type: string}
        confirm: {type: boolean, description: Must be true after the user confirms restoration of the immediately preceding unchanged apply.}
