        confirm_remote_provider: {type: boolean}
    SecurityScanRequest:
      type: object
      required: [path, project_revision]
      properties:
        path: {type: string, description: One project-relative context-policy-eligible Go file.}
        project_revision: {type: string}
    SecurityFileReport:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, status, source, findings, context_policy_version, generated_at]
      properties:
        schema_version: {type: string, enum: ['1']}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        status: {type: string, enum: [completed, completed_empty, partial]}
        source: {type: string, enum: [deterministic, ai]}
        rule_set_version: {type: string}
        findings: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/SecurityFinding'}}
        reason: {type: string, description: Present only when the deterministic five-finding limit truncates source-order matches.}
        model: {type: string}
        configured_model: {type: string}
        profile: {type: string, enum: [analyze]}
        scope: {type: string, enum: [analyze]}
        provider_origin: {type: string}
        reasoning_effort: {type: string}
        prompt_version: {type: string, enum: [security-file-v1, security-file-v2, security-file-v3]}
        context_policy_version: {type: string}
        instructions_fingerprint: {type: string, description: Identity of the applicable AGENTS.md guides used for AI review.}
        generated_at: {type: string, format: date-time}
      oneOf:
        - required: [rule_set_version]
          properties:
            source: {type: string, enum: [deterministic]}
            status: {type: string, enum: [completed, completed_empty, partial]}
          not:
            anyOf:
              - required: [model]
              - required: [configured_model]
              - required: [profile]
              - required: [scope]
              - required: [provider_origin]
              - required: [reasoning_effort]
              - required: [prompt_version]
        - required: [model, configured_model, profile, scope, provider_origin, reasoning_effort, prompt_version]
          properties:
            source: {type: string, enum: [ai]}
            status: {type: string, enum: [completed, completed_empty]}
          not: {required: [rule_set_version]}
    SecurityFinding:
      type: object
      required: [id, rule, category, title, source_anchor, severity, confidence, evidence_kind, observed_condition, preconditions_or_unknowns, remediation, verification_idea, triage, verification_state]
      properties:
        id: {type: string}
        rule: {type: string}
        category: {type: string}
        title: {type: string}
        source_anchor: {$ref: '#/components/schemas/SecuritySourceAnchor'}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        confidence: {type: string, enum: [high, medium, low]}
        evidence_kind: {type: string, enum: [rule_match, model_suspicion]}
        observed_condition: {type: string}
        preconditions_or_unknowns: {type: string}
        remediation: {type: string}
        verification_idea: {type: string, description: Safe verification idea only; no exploit execution occurs.}
        cwe: {type: string}
        reference: {type: string, format: uri}
        triage: {type: string, enum: [open, dismissed, accepted]}
        verification_state: {type: string, enum: [unverified, verified, not_reproducible]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
      oneOf:
        - properties:
            evidence_kind: {type: string, enum: [rule_match]}
            severity: {type: string, enum: [high]}
            confidence: {type: string, enum: [high]}
        - properties:
            evidence_kind: {type: string, enum: [model_suspicion]}
    SecuritySourceAnchor:
      type: object
      required: [path, start_line, end_line]
      properties:
        path: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        symbol: {type: string}
    FileAnalysis:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, language, status, prompt_version, context_policy_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        language: {type: string}
        purpose: {type: string}
        responsibilities: {type: array, items: {type: string}}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
        imports: {type: array, items: {type: string}}
        dependencies: {type: array, items: {type: string}}
        side_effects: {type: array, items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        symbol_explanations: {type: object, additionalProperties: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, missing, stale, failed, running]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        context_policy_version: {type: string}
        instructions_fingerprint: {type: string, description: Identity of the applicable AGENTS.md guides used for analysis.}
        generated_at: {type: string, format: date-time}
    PerformanceFinding:
      type: object
      required: [id, category, potential_impact, confidence, title, observed_pattern, workload_conditions, recommendation, tradeoff, verification_plan, start_line, end_line]
      properties:
        id: {type: string}
        category: {type: string, enum: [cpu, memory, io, concurrency, caching, ui]}
        potential_impact: {type: string, enum: [high, medium, low, unknown]}
        confidence: {type: string, enum: [high, medium, low]}
        title: {type: string}
        observed_pattern: {type: string}
        workload_conditions: {type: string}
        recommendation: {type: string}
        tradeoff: {type: string}
        verification_plan: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
        symbol: {type: string}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    Finding:
      type: object
      properties:
        category: {$ref: '#/components/schemas/FindingCategory'}
        severity: {type: string}
        title: {type: string, description: Short content-specific name; older reports may omit it.}
        summary: {type: string}
        task_spec: {$ref: '#/components/schemas/BugTaskSpec'}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    BugTaskSpec:
      type: object
      required: [schema_version, target_path, target_symbol, target_signature, acceptance_criteria, non_goals]
      properties:
        schema_version: {type: string, enum: ['1']}
        target_path: {type: string, description: Exact project-relative target file.}
        target_symbol: {type: string, description: Exact atomic Go declaration.}
        target_signature: {type: string, description: Daemon-validated indexed signature.}
        acceptance_criteria: {type: array, items: {type: string}, maxItems: 8}
        non_goals: {type: array, items: {type: string}, maxItems: 8}
        go_test_candidate: {$ref: '#/components/schemas/GoTestCandidateSpec'}
    GoTestCandidateSpec:
      type: object
      required: [name, content]
      properties:
        name: {type: string, description: One valid Go Test function name.}
        content: {type: string, description: Reviewed test source used only in a temporary copied check workspace.}
    Suggestion:
      type: object
      properties: {title: {type: string}, summary: {type: string}, target_symbol: {type: string}, action: {type: string}, engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}}
    ContextManifest:
      type: object
      properties:
        included: {type: array, items: {$ref: '#/components/schemas/ContextFile'}}
        excluded: {type: array, items: {$ref: '#/components/schemas/ContextDecision'}}
        estimated_tokens: {type: integer}
        byte_limit: {type: integer}
        token_limit: {type: integer}
        truncated: {type: boolean}
        scope: {type: string, enum: [analyze, bug, function]}
        model: {type: string}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean}
    ContextFile:
      type: object
      properties:
        path: {type: string}
        size_bytes: {type: integer, format: int64}
        hash: {type: string}
        estimated_tokens: {type: integer}
        truncated: {type: boolean}
    ContextDecision:
      type: object
      properties:
        path: {type: string}
        include: {type: boolean}
        reason: {type: string}
    DeclarationExplanationRequest:
      type: object
      required: [project_id, project_revision, base_file_hash, target_path, target_symbol, confirm_remote_provider]
      additionalProperties: false
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        target_path: {type: string, description: Exact eligible project-relative Go source path.}
        target_symbol: {type: string, description: Exact atomic indexed declaration name.}
        confirm_remote_provider: {type: boolean, description: Fresh Function-scope confirmation required for non-loopback providers.}
    DeclarationExplanation:
      type: object
      required: [version, project_id, project_revision, base_file_hash, anchor, summary, behavior, inputs, outputs, side_effects, error_behavior, context_manifest]
      properties:
        version: {type: string, enum: [v1]}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        anchor: {$ref: '#/components/schemas/DeclarationSourceAnchor'}
        summary: {type: string}
        behavior: {type: array, maxItems: 6, items: {type: string}}
        inputs: {type: array, maxItems: 6, items: {type: string}}
        outputs: {type: array, maxItems: 6, items: {type: string}}
        side_effects: {type: array, maxItems: 6, items: {type: string}}
        error_behavior: {type: array, maxItems: 6, items: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
    SecurityReviewRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, base_file_hash, path, confirm_remote_provider]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string, description: Current selected-file content hash.}
        path: {type: string, description: Exact eligible project-relative file path.}
        symbol: {type: string, description: Optional exact atomic indexed declaration; all returned anchors are restricted to it.}
        confirm_remote_provider: {type: boolean, description: Fresh Analyze-scope confirmation required for non-loopback providers.}
    DeclarationSourceAnchor:
      type: object
      required: [path, symbol, signature, start_line, end_line]
      properties:
        path: {type: string}
        symbol: {type: string}
        signature: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    UnifiedDiff:
      type: object
      properties:
        old_path: {type: string}
        new_path: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/DiffLine'}}
    DiffLine:
      type: object
      properties:
        kind: {type: string, enum: [context, added, removed]}
        old_line: {type: integer}
        new_line: {type: integer}
        text: {type: string}
    FindingCategory:
      type: string
      enum: [bugs, performance, security]
      description: Explicit semantic category. An absent legacy field means unclassified and never contributes to fresh section counts.
    AnalysisRunStatus:
      type: string
      enum: [queued, running, pausing, paused, canceling, canceled, interrupted, completed, completed_empty, partial, failed, unavailable, stale]
    AnalysisStage:
      type: string
      enum: [semantic, performance, security_rules, security_ai, feature_suggestions]
    AnalysisStageStatus:
      type: string
      enum: [pending, running, completed, completed_empty, partial, failed, skipped, unavailable, canceled, interrupted, stale]
    AnalysisRunLimits:
      type: object
      additionalProperties: false
      required: [batch_files, budget_seconds, max_attempts_per_stage]
      properties:
        batch_files: {type: integer, minimum: 1, maximum: 500, default: 100, description: Dispatch-window limit; does not truncate captured project inventory.}
        budget_seconds: {type: integer, minimum: 1, maximum: 3600, default: 900}
        max_attempts_per_stage: {type: integer, minimum: 1, maximum: 4, default: 2, description: Initial request plus all retries; cumulative across resumes.}
    AnalysisQueueIdentity:
      type: object
      required: [project_id, project_revision, policy_fingerprint, provider_fingerprint, queue_id]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        policy_fingerprint: {type: string, minLength: 1}
        provider_fingerprint: {type: string, minLength: 1}
        queue_id: {type: string, minLength: 1, description: Stable captured scope; excludes mutable cache availability.}
    AnalysisRunIdentity:
      allOf:
        - {$ref: '#/components/schemas/AnalysisQueueIdentity'}
        - type: object
          required: [id, generation]
          properties:
            id: {type: string, minLength: 1}
            generation: {type: string, minLength: 1}
    AnalysisSelectionRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, selection_id, excluded_paths]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        selection_id: {type: string, minLength: 1}
        excluded_paths: {type: array, maxItems: 20000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 4096}, description: Canonical project-relative paths. Empty selects all eligible files.}
    AnalysisFileSelection:
      type: object
      required: [project_id, project_revision, selection_id, excluded_paths, files, editable, recovery]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        selection_id: {type: string}
        excluded_paths: {type: array, items: {type: string}}
        editable: {type: boolean}
        recovery: {$ref: '#/components/schemas/AnalysisRecoverySummary'}
        files:
          type: array
          items:
            type: object
            required: [path, reason, stages]
            properties:
              path: {type: string}
              reason: {type: string, description: Empty when selectable; otherwise the eligibility exclusion reason.}
              stages:
                type: array
                description: Read-only current analysis status per stage. Empty for ineligible files. Does not dispatch analysis.
                items:
                  type: object
                  required: [stage, status, reason]
                  properties:
                    stage: {$ref: '#/components/schemas/AnalysisStage'}
                    status: {type: string, enum: [fresh, stale, missing, failed, partial, running, pending, paused, interrupted, canceled, skipped, unavailable]}
                    reason: {type: string, description: Explanation of the current cache or retained run state.}
    AnalysisRecoverySummary:
      type: object
      required: [state, file_count, stage_count]
      description: Read-only daemon eligibility for recover_incomplete over the saved selection. States are evaluated in order running, continuation, not_started, blocked (source), available, blocked (model configuration), complete. Never dispatches analysis.
      properties:
        state: {type: string, enum: [running, continuation, not_started, blocked, available, complete]}
        file_count: {type: integer, minimum: 0, description: Selected eligible files with at least one recoverable stage, under the same model choices as the stage statuses.}
        stage_count: {type: integer, minimum: 0, description: Recoverable stages in those files.}
        reason: {type: string, description: Present for running, continuation and blocked; names the required action.}
    AnalysisModels:
      type: object
      additionalProperties: false
      required: [code, features]
      anyOf:
        - required: [performance, security]
        - required: [review]
      description: Independent model choices for one run. Legacy review supplies either missing Performance or Security choice. Omission uses Bug for Code and Analyze for reviews/features. Resume retains the captured choices; endpoints and credentials remain daemon-owned.
      properties:
        code: {$ref: '#/components/schemas/ModelSelection'}
        performance: {$ref: '#/components/schemas/ModelSelection'}
