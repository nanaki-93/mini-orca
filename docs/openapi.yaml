openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 4.4.0
  description: |
    Local REST API used by the Mini-Orca Compose Desktop client. The daemon is the
    LLM boundary. A user opens one Go file and declaration, starts a file-scoped
    conversation, then reviews an editable declaration draft before explicitly
    applying it. Source and diff views are read-only; no route creates multi-file
    changes, writes automatically, or exposes a browser IDE.
    Project import, semantic analysis, Analyze-all, and chat messages can send
    prompt content; a non-loopback provider requires explicit confirmation for
    each of those requests. Verified scans, validation, checks, Apply, and Undo
    do not send prompts and never run automatically.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Security
  - name: Chat
  - name: Drafts
paths:
  /api/projects/current/analysis/selection:
    get:
      tags: [Projects]
      description: Read project inventory and saved exclusions without dispatching analysis.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: project_revision, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      responses:
        '200': {description: Saved selection and file eligibility, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisFileSelection'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      description: Atomically save exclusions for future project analysis. Requires matching project and selection identities and no active, paused or interrupted run. Does not write source or dispatch analysis.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisSelectionRequest'}}}}
      responses:
        '200': {description: Saved selection, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisFileSelection'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis/preview:
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisPreviewRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '200': {description: Whole-project admission preview, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunPreview'}}}}
  /api/projects/current/analysis/run:
    get:
      tags: [Projects]
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: project_revision, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      description: Read current progress with required project_id and project_revision query guards; never dispatch.
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '204': {description: No saved run for this project}
        '200': {description: Current run, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunStartRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '202': {description: Durably admitted run, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
  /api/projects/current/analysis/run/control:
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunControlRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '200': {description: Updated control state, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
  /api/projects/current/analysis/results:
    get:
      tags: [Projects]
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: project_revision, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: policy_fingerprint, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: provider_fingerprint, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: queue_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: generation, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: category, required: true, schema: {$ref: '#/components/schemas/FindingCategory'}}
        - {in: query, name: path, required: false, schema: {type: string, minLength: 1, maxLength: 4096}, description: Canonical project-relative path already captured by this run.}
      description: Require all AnalysisRunIdentity fields and category as query guards; optional path only filters this read view.
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '200': {description: Categorized producer evidence, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisSectionResults'}}}}
  /health:
    get:
      tags: [Daemon]
      summary: Health check
      responses:
        '200':
          description: Daemon is healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /status:
    get:
      tags: [Daemon]
      summary: Daemon workflow status
      responses:
        '200':
          description: Daemon status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /api/projects/current/chat/sessions:
    post:
      tags: [Chat]
      summary: Open a conversation pinned to one file, declaration, and optional reviewed task
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChatSessionRequest'}}}
      responses:
        '201': {description: Active file-scoped session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/chat/sessions/{sessionID}/messages:
    post:
      tags: [Chat]
      summary: Request a declaration proposal in an existing session
      description: The message body cannot change the session's project, file, mode, or declaration target. A repair is explicit, limited to the latest failed task draft, and pins that parent's reviewed temporary proof for the remaining lineage.
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessageRequest'}}}
      responses:
        '200': {description: New editable declaration draft proposal, content: {application/json: {schema: {$ref: '#/components/schemas/ChatDraftProposal'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/models/current:
    get:
      tags: [Daemon]
      summary: Effective scoped model catalog
      responses:
        '200':
          description: Non-secret analyze, bug, and function model scopes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
  /api/projects/import:
    post:
      tags: [Projects]
      summary: Import and analyze a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectImportRequest'}
      responses:
        '200':
          description: Imported project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/restore:
    post:
      tags: [Projects]
      summary: Restore a previously imported project without model access
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRestoreRequest'}
      responses:
        '200':
          description: Restored project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/overview:
    get:
      tags: [Projects]
      summary: Source-free project workspace overview
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Deterministic metrics, optional structured analysis, coverage, and source-separated finding counts, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectOverview'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings:
    get:
      tags: [Projects]
      summary: List source-free verified findings and AI suggestions
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: source
          in: query
          schema: {type: string, enum: [ai, parser, vet, test]}
        - name: confidence
          in: query
          schema: {type: string, enum: [suggested, tool_reported]}
        - name: severity
          in: query
          schema: {type: string, enum: [low, medium, high]}
        - name: status
          in: query
          schema: {type: string, enum: [open, dismissed, fixed, retired]}
        - name: freshness
          in: query
          schema: {type: string, enum: [fresh, stale]}
      responses:
        '200': {description: Sanitized findings with their provenance and lifecycle, content: {application/json: {schema: {$ref: '#/components/schemas/FindingsResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/{findingID}:
    patch:
      tags: [Projects]
      summary: Update a finding's user triage status
      parameters:
        - name: findingID
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FindingTriageRequest'}}}
      responses:
        '204': {description: Triage status recorded.}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/scan:
    get:
      tags: [Projects]
      summary: Read explicit Go scan progress from a temporary copied workspace
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free workspace preparation, parser, vet, and test progress; bounded workspace failures include sanitized evidence, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '204': {description: No verified scan exists for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start a Go verified scan in a temporary copied workspace
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoScanRequest'}}}
      responses:
        '202': {description: Scan started, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Cancel the active temporary-workspace Go scan
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cancellation requested; completed phases remain available, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/execution-trust:
    get:
      tags: [Projects]
      summary: Read the current project's trusted local execution scope
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: task_test_name
          in: query
          required: false
          schema: {type: string}
          description: Exact generated Go test name for a task-test trust preview.
      responses:
        '200': {description: Current-session trust and the exact project-code command scope, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly trust local execution for the current project revision
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrustRequest'}}}
      responses:
        '200': {description: Current-session trust recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/symbols:
    get:
      tags: [Projects]
      summary: Atomic targets in one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Symbol facts for one project-relative eligible text file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SymbolsResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/impact:
    get:
      tags: [Projects]
      summary: Advisory index-based impact preview for one selected file or symbol
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - name: symbol
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Source-free advisory references that do not alter model context
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/git:
    get:
      tags: [Projects]
      summary: Read-only Git status for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Repository availability, branch, and target-file status
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/security-scan:
    post:
      tags: [Security]
      summary: Scan exactly one eligible Go file with deterministic source-only security rules
      description: Applies the current Go ruleset without provider access or subprocess execution. A rule match requires syntactic review and is not proof of exploitability.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityScanRequest'}}}
      responses:
        '200': {description: Source-free deterministic Security report; partial reports retain the first five source-order matches and state that coverage limit, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/explanation:
    post:
      tags: [Projects]
      summary: Explain one exact indexed Go declaration without creating workflow state
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanationRequest'}}}
      responses:
        '200': {description: Transient bounded explanation with source anchors and Function-context provenance, content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/security-review:
    post:
      tags: [Security]
      summary: Perform one explicit passive AI security review of one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityReviewRequest'}}}
      responses:
        '200': {description: Source-free advisory report; completed_empty does not mean the file is secure, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job:
    get:
      tags: [Projects]
      summary: Sequential semantic-analysis job progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free project-scoped progress, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '204': {description: No Analyze-all job has been started for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start bounded sequential analysis
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Job accepted; one file is analyzed at a time, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/pause:
    post:
      tags: [Projects]
      summary: Pause after the current one-file analysis
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Paused job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/resume:
    post:
      tags: [Projects]
      summary: Resume a persisted paused job
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllRequest'}}}
      responses:
        '202': {description: Resumed job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis-job/cancel:
    post:
      tags: [Projects]
      summary: Cancel the active sequential analysis job
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Canceled job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyzeAllJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance:
    get:
      tags: [Performance]
      summary: Read cached source-based performance review coverage and findings
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Queue-derived source-based review report, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceReport'}}}}
        '204': {description: No performance review has been started for this project revision.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance/context:
    get:
      tags: [Performance]
      summary: Preview a policy-filtered bounded performance queue without provider work
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: max_files, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: run_budget_seconds, in: query, schema: {type: integer, minimum: 1, maximum: 3600}}
      responses:
        '200': {description: Source-free queue and configured Analysis-model manifest, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceQueuePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job:
    get:
      tags: [Performance]
      summary: Read persisted bounded performance-review progress
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free progress, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '204': {description: No performance job has been started for this project revision.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Performance]
      summary: Explicitly start a bounded sequential source-based performance review
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJobRequest'}}}
      responses:
        '202': {description: Job accepted; only one file is reviewed at a time, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/pause:
    post:
      tags: [Performance]
      summary: Pause a performance review after its active file finishes
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: expected_job_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Paused job, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/resume:
    post:
      tags: [Performance]
      summary: Resume a compatible paused performance job with fresh provider confirmation
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJobRequest'}}}
      responses:
        '202': {description: Resumed job, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/performance-job/cancel:
    post:
      tags: [Performance]
      summary: Cancel active or pending performance review work
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: expected_job_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Canceled job; completed cached reports remain available, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceJob'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}:
    patch:
      tags: [Drafts]
      summary: Create the next draft revision from a declaration/import edit
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftUpdateRequest'}}}
      responses:
        '200': {description: Updated draft revision with prior validation and check evidence cleared, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}/validate:
    post:
      tags: [Drafts]
      summary: Compose and validate one exact declaration draft revision
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftValidationRequest'}}}
      responses:
        '200': {description: Valid or invalid draft with read-only composition evidence, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}/checks:
    post:
      tags: [Drafts]
      summary: Run focused checks for one validated declaration revision
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftCheckRequest'}}}
      responses:
        '200': {description: Isolated check report for the displayed revision and hash, content: {application/json: {schema: {$ref: '#/components/schemas/DraftCheckReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/drafts/{draftID}/benchmarks:
    get:
      tags: [Performance]
      summary: List selectable existing Go benchmarks for one validated draft
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {name: expected_revision, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: expected_hash, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Available existing benchmarks or an unavailable reason; no process is started, content: {application/json: {schema: {$ref: '#/components/schemas/GoBenchmarkCatalog'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Performance]
      summary: Compare one selected existing Go benchmark in copied workspaces
      parameters:
        - {$ref: '#/components/parameters/DraftID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoBenchmarkComparisonRequest'}}}
      responses:
        '200': {description: Complete paired measurements or a sample-free unavailable/failed/canceled state; this does not enable Apply, content: {application/json: {schema: {$ref: '#/components/schemas/GoBenchmarkComparison'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/apply:
    post:
      tags: [Drafts]
      summary: Explicitly apply one validated and checked declaration draft
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApplyRequest'}}}
      responses:
        '200': {description: Atomic one-file apply result with Undo metadata}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/undo:
    post:
      tags: [Drafts]
      summary: Undo the immediately preceding unchanged apply
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UndoRequest'}}}
      responses:
        '200': {description: Atomic one-file undo result}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: {type: string}
    DraftID:
      name: draftID
      in: path
      required: true
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: single_coder_preview}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: [analyze, bug, function]}
        profile: {type: string, enum: [analyze, bug, function]}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured Chat Completions reasoning effort.}
        provider_origin: {type: string, description: Sanitized scheme, host, and optional port only.}
        remote_provider: {type: boolean}
        temperature: {type: number}
        max_tokens: {type: integer}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
    ModelCatalog:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: object
          required: [analyze, bug, function]
          properties:
            analyze: {$ref: '#/components/schemas/ScopedModel'}
            bug: {$ref: '#/components/schemas/ScopedModel'}
            function: {$ref: '#/components/schemas/ScopedModel'}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    ProjectRestoreRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path of a previously imported local project.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        summary: {type: string}
        ai_status: {type: string}
        report: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analyzed_at: {type: string, format: date-time}
    ProjectOverview:
      type: object
      required: [project_id, project_revision, metrics, analysis, analysis_coverage, finding_counts]
      properties:
        analysis_run: {$ref: '#/components/schemas/AnalysisRun'}
        project_id: {type: string}
        project_revision: {type: string}
        metrics: {$ref: '#/components/schemas/ProjectMetrics'}
        analysis: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analysis_coverage: {$ref: '#/components/schemas/AnalysisCoverage'}
        finding_counts: {$ref: '#/components/schemas/FindingCounts'}
    ProjectMetrics:
      type: object
      required: [type, file_count, source_file_count, total_lines, languages]
      properties:
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
    ProjectAnalysisReport:
      type: object
      required: [schema_version, project_id, project_revision, components, entry_points, flows, risks, next_steps, status, model, profile, prompt_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        purpose: {type: string}
        architecture: {type: string, description: "Advisory Mermaid flowchart for new reports; older reports may contain prose."}
        components: {type: array, items: {type: string}}
        entry_points: {type: array, items: {type: string}}
        flows: {type: array, description: "Advisory Mermaid flowcharts or sequence diagrams for new reports; older items may contain prose.", items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        next_steps: {type: array, items: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, stale, failed, unavailable]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalysisCoverage:
      type: object
      required: [total, fresh, stale, missing, failed, running]
      properties:
        total: {type: integer}
        fresh: {type: integer}
        stale: {type: integer}
        missing: {type: integer}
        failed: {type: integer}
        running: {type: integer}
    FindingCounts:
      type: object
      required: [verified, ai_suggestions]
      properties:
        verified: {type: integer, description: Count with non-AI source and tool_reported confidence.}
        ai_suggestions: {type: integer, description: Count with AI source and suggested confidence.}
    FindingsResponse:
      type: object
      required: [project_id, project_revision, findings]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/UnifiedFinding'}}
    UnifiedFinding:
      type: object
      required: [id, source, confidence, severity, title, message, project_id, project_revision, location, status, freshness, detected_at]
      properties:
        id: {type: string}
        category: {$ref: '#/components/schemas/FindingCategory'}
        source: {type: string, enum: [ai, parser, vet, test]}
        confidence: {type: string, enum: [suggested, tool_reported]}
        severity: {type: string, enum: [low, medium, high]}
        title: {type: string}
        message: {type: string}
        rule: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        file_hash: {type: string}
        location: {$ref: '#/components/schemas/FindingLocation'}
        evidence: {type: string, description: Sanitized and bounded tool or model evidence.}
        status: {type: string, enum: [open, dismissed, fixed, retired]}
        freshness: {type: string, enum: [fresh, stale]}
        detected_at: {type: string, format: date-time}
        originating_analysis: {type: string, enum: [project, file]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    EngineeringInsight:
      type: object
      required: [mechanism, why_it_matters_here]
      description: Optional AI interpretation attached to its parent result; it carries no navigation or mutation authority.
      properties:
        mechanism: {type: string, maxLength: 1000}
        why_it_matters_here: {type: string, maxLength: 1000}
        tradeoff_or_failure_mode: {type: string, maxLength: 1000}
        transferable_lesson: {type: string, maxLength: 1000}
    FindingLocation:
      type: object
      properties:
        path: {type: string, description: Project-relative path.}
        start_line: {type: integer}
        end_line: {type: integer}
        symbol: {type: string}
    FindingTriageRequest:
      type: object
      required: [project_revision, status]
      properties:
        project_revision: {type: string}
        status: {type: string, enum: [open, dismissed, fixed]}
    GoScanRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
    GoScanReport:
      type: object
      required: [project_id, project_revision, status, started_at, updated_at, phases]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, enum: [running, completed, canceled, failed]}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        phases: {type: array, items: {$ref: '#/components/schemas/GoScanPhase'}}
    ExecutionTrustRequest:
      type: object
      required: [project_revision, confirm]
      properties:
        project_revision: {type: string}
        confirm: {type: boolean, description: Must be true after the client shows the command scope.}
    ExecutionTrust:
      type: object
      required: [project_id, project_revision, trusted, commands]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        trusted: {type: boolean, description: In-memory authorization for this daemon session only.}
        commands:
          type: array
          description: Exact argv vectors for this requested scan or task-test action; gofmt and go vet are source-only and omitted.
          items: {type: array, items: {type: string}}
    GoScanPhase:
      type: object
      required: [name, state]
      properties:
        name: {type: string, enum: [workspace, parse, vet, tests]}
        state: {type: string, enum: [passed, failed, canceled]}
        command: {type: array, items: {type: string}}
        output: {type: string, description: Sanitized and bounded output.}
        exit_code: {type: integer}
    FileInfo:
      type: object
      properties:
        path: {type: string}
        content_hash: {type: string, description: Hash required with a mutable request.}
        name: {type: string}
        extension: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        content: {type: string}
    ProjectIndex:
      type: object
      required: [schema_version, project_id, project_revision, generated_at, files]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        generated_at: {type: string, format: date-time}
        files:
          type: array
          items: {$ref: '#/components/schemas/IndexFile'}
    IndexFile:
      type: object
      required: [path, content_hash, language, size_bytes, line_count, modified_at, binary, imports, symbols, analysis_status]
      properties:
        path: {type: string, description: Project-relative safe path.}
        content_hash: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        imports: {type: array, items: {type: string}}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        analysis_status: {type: string}
    SymbolInfo:
      type: object
      required: [name, kind, signature, start_line, end_line, visibility, confidence, atomic_target]
      properties:
        name: {type: string}
        kind: {type: string}
        signature: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
        visibility: {type: string}
        confidence: {type: string, enum: [exact, approximate]}
        atomic_target: {type: boolean}
    Diagnostic:
      type: object
      properties:
        message: {type: string}
        line: {type: integer}
    SymbolsResponse:
      type: object
      required: [project_id, project_revision, path, language, symbols]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        language: {type: string}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
    ReindexRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
    FileAnalysisRequest:
      type: object
      required: [path, project_revision]
      properties:
        path: {type: string}
        project_revision: {type: string}
        refresh: {type: boolean}
        confirm_remote_provider: {type: boolean}
    SecurityScanRequest:
      type: object
      required: [path, project_revision]
      properties:
        path: {type: string, description: One project-relative context-policy-eligible Go file.}
        project_revision: {type: string}
    SecurityFileReport:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, status, source, findings, context_policy_version, generated_at]
      properties:
        schema_version: {type: string, enum: ['1']}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        status: {type: string, enum: [completed, completed_empty, partial]}
        source: {type: string, enum: [deterministic, ai]}
        rule_set_version: {type: string}
        findings: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/SecurityFinding'}}
        reason: {type: string, description: Present only when the deterministic five-finding limit truncates source-order matches.}
        model: {type: string}
        configured_model: {type: string}
        profile: {type: string, enum: [analyze]}
        scope: {type: string, enum: [analyze]}
        provider_origin: {type: string}
        reasoning_effort: {type: string}
        prompt_version: {type: string, enum: [security-file-v1, security-file-v2]}
        context_policy_version: {type: string}
        generated_at: {type: string, format: date-time}
      oneOf:
        - required: [rule_set_version]
          properties:
            source: {type: string, enum: [deterministic]}
            status: {type: string, enum: [completed, completed_empty, partial]}
          not:
            anyOf:
              - required: [model]
              - required: [configured_model]
              - required: [profile]
              - required: [scope]
              - required: [provider_origin]
              - required: [reasoning_effort]
              - required: [prompt_version]
        - required: [model, configured_model, profile, scope, provider_origin, reasoning_effort, prompt_version]
          properties:
            source: {type: string, enum: [ai]}
            status: {type: string, enum: [completed, completed_empty]}
          not: {required: [rule_set_version]}
    SecurityFinding:
      type: object
      required: [id, rule, category, title, source_anchor, severity, confidence, evidence_kind, observed_condition, preconditions_or_unknowns, remediation, verification_idea, triage, verification_state]
      properties:
        id: {type: string}
        rule: {type: string}
        category: {type: string}
        title: {type: string}
        source_anchor: {$ref: '#/components/schemas/SecuritySourceAnchor'}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        confidence: {type: string, enum: [high, medium, low]}
        evidence_kind: {type: string, enum: [rule_match, model_suspicion]}
        observed_condition: {type: string}
        preconditions_or_unknowns: {type: string}
        remediation: {type: string}
        verification_idea: {type: string, description: Safe verification idea only; no exploit execution occurs.}
        cwe: {type: string}
        reference: {type: string, format: uri}
        triage: {type: string, enum: [open, dismissed, accepted]}
        verification_state: {type: string, enum: [unverified, verified, not_reproducible]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
      oneOf:
        - properties:
            evidence_kind: {type: string, enum: [rule_match]}
            severity: {type: string, enum: [high]}
            confidence: {type: string, enum: [high]}
        - properties:
            evidence_kind: {type: string, enum: [model_suspicion]}
    SecuritySourceAnchor:
      type: object
      required: [path, start_line, end_line]
      properties:
        path: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        symbol: {type: string}
    FileAnalysis:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, language, status, prompt_version, context_policy_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        language: {type: string}
        purpose: {type: string}
        responsibilities: {type: array, items: {type: string}}
        symbols: {type: array, items: {$ref: '#/components/schemas/SymbolInfo'}}
        imports: {type: array, items: {type: string}}
        dependencies: {type: array, items: {type: string}}
        side_effects: {type: array, items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        symbol_explanations: {type: object, additionalProperties: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, missing, stale, failed, running]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        context_policy_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalyzeAllRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
        max_files: {type: integer, minimum: 1, maximum: 500, description: Bounded cache-warming file budget.}
        max_retries: {type: integer, minimum: 0, maximum: 3}
        confirm_remote_provider: {type: boolean}
    AnalyzeAllJob:
      type: object
      required: [project_id, project_revision, status, max_files, max_retries, files, created_at, updated_at]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, enum: [running, paused, interrupted, canceled, completed, stale]}
        max_files: {type: integer}
        max_retries: {type: integer}
        files:
          type: array
          items: {$ref: '#/components/schemas/AnalyzeAllFileJob'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AnalyzeAllFileJob:
      type: object
      required: [path, status, attempts]
      properties:
        path: {type: string, description: Eligible project-relative source file.}
        status: {type: string, enum: [pending, running, completed, failed]}
        attempts: {type: integer}
        error: {type: string, description: Sanitized per-file failure state.}
    PerformanceJobRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
        max_files: {type: integer, minimum: 1, maximum: 500}
        run_budget_seconds: {type: integer, minimum: 1, maximum: 3600, description: Provider execution budget; defaults to 900 seconds.}
        queue_id: {type: string, description: Optional queue identity returned by the current context preview.}
