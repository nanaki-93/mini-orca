openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 4.4.0
  description: |
    Local REST API used by the Mini-Orca TUI client. The daemon is the LLM
    boundary. Shared conversations capture up to eight Go/Markdown paths, produce
    checked proposals and require diff review and explicit Apply. Legacy one-file
    declaration APIs remain compatible. Source and diff views are read-only.
    Project import, semantic analysis, Analyze-all, and chat messages can send
    prompt content; a non-loopback HTTP or CLI provider requires explicit confirmation for
    each of those requests. Verified scans, validation, checks, Apply, and Undo
    do not send prompts. An explicitly started change workflow runs its trusted
    checks after generation; source Apply and Undo always require human action.
    Native ADK graphs retain separate stage and human-input outcomes. Persisted
    events, model verdicts, artifacts and restored approvals do not grant current
    execution or source-mutation authority. Optional external services require
    their configured capability and the explicit operation-specific grant.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Security
  - name: Chat
  - name: Drafts
paths:
  /api/projects/current:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the selected project without changing the active project
      responses:
        '200': {description: Project summary, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/plans/investigate:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Chat]
      summary: Investigate explicitly captured plan scope without approving or changing source
      description: Requires Code profile remote confirmation when applicable. Captured hashes, absent paths, project revision, policy and instructions are rechecked before publication. Cancel the request to stop investigation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanInvestigationRequest'}}}}
      responses:
        '200': {description: Bounded model suggestions with validated source citations, content: {application/json: {schema: {$ref: '#/components/schemas/PlanInvestigation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/integrations:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive MCP configuration and expiring inventory grants
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: No connection or process startup; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentIntegration'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/integrations/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover or revoke a configured MCP integration
      description: Discovery requires confirm_connect and the current configuration fingerprint. It opens and closes a bounded connection, returning a 15-minute schema grant. Revocation cancels in-flight operations and requires the current grant when one exists. Neither action grants source sharing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Ready inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentIntegration'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-settings:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read configured or overridden agent settings without dispatch
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive private settings and safe configured model metadata; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-settings/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Confirm versioned settings for future admissions
      description: Replace complete roles, limits and disabled configured skills, or reset to operator configuration. Limits cannot exceed configured ceilings. Active runs retain their captured settings. Stale overrides require explicit reset. No source writes, provider dispatch, credential changes or tool grants.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettingsControl'}}}}
      responses:
        '200': {description: Durably saved settings with an advanced version; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-settings/skills/validate:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Explicitly inspect captured local skill text without execution or grants
      description: Validates the manifest and indexed resources with current hashes/policy and the native parser. A valid result does not enable the skill or grant required tools; invocation-specific admission remains required.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSkillValidationRequest'}}}}
      responses:
        '200': {description: Bounded metadata and source references without instruction/resource bodies; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSkillValidation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-access:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive inbound principal configuration and temporary grants
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Current project's configured principals; no-store and no dispatch, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/RemoteServicePrincipal'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-access/{principalID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: principalID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly grant or revoke an inbound principal's project access
      description: Grants last 15 minutes and bind project revision, credential and provider configuration. Grant requires connection and source-sharing confirmation plus applicable provider confirmation. Revoke requires the current live grant, cancels and joins its operations. No source mutation authority is granted.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteServiceControl'}}}}
      responses:
        '200': {description: Authorized or revoked principal; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteServicePrincipal'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/remote-agents:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive A2A configurations and expiring card grants
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: No remote discovery or dispatch; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentRemote'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/remote-agents/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover or revoke an A2A card grant
      description: Discovery requires confirm_connect and current configuration identity. Pins the configured A2A 1.0 JSON-RPC endpoint and card fingerprint for 15 minutes. Revocation requires the current grant and cancels admitted operations. Neither grants source sharing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Current ready inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRemote'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read durable delegation metadata without network activity
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Questions, observations and advisory text/artifacts are omitted or empty; stale checks revision only; no-store, content: {application/json: {schema: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentDelegation'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Send one explicitly admitted advisory task to a remote agent
      description: Persists a pending receipt before a single send. Requires current project/card/source identities and fresh delegation/source-sharing consent. Receipts distinguish remote outcomes from local transport success. Unknown or pending work blocks another start at the endpoint. No automatic retries or source mutation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRequest'}}}}
      responses:
        '200': {description: Private advisory outcome receipt, including unknown or not_sent; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations/{delegationID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: delegationID, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: Read a private advisory delegation receipt
      description: Includes bounded text/artifacts and checks current source freshness locally. Never contacts the remote agent or resumes a task.
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Private advisory receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations/{delegationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: delegationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly recover or continue an existing remote task
      description: Requires current receipt version and confirm. Refresh uses GetTask; reconnect uses SubscribeToTask; cancel uses CancelTask. Input sends one new message only for input_required with current source authority and fresh sharing consent. Reconciliation records a user-reported observation for unknown, auth_required or expired pending work without network dispatch. Reconciliation cannot race an active local owner.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationControl'}}}}
      responses:
        '200': {description: Updated private advisory receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/apis:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive curated API configurations and inventories
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Private configurations and optional expiring grants; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentAPI'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/apis/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover a local OpenAPI specification or revoke its grant
      description: Discovery requires confirm_connect and current configuration identity. Reads indexed local JSON only; it never contacts the API. Revoke requires any current grant and cancels admitted operations.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Current inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAPI'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/api-actions:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read private exact-action candidates and durable external outcome receipts
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-bearing review and recovery records; no-store, content: {application/json: {schema: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/AgentAPIAction'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/api-actions/{actionID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: actionID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Approve one exact external request or record a user-reported reconciliation
      description: Claims a durable pending receipt before one HTTP attempt. Pending or unknown outcomes block new writes through the operation. Reconciliation requires an externally checked observation and never retries. A 200 response does not imply the external effect completed; inspect state.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APIActionControl'}}}}
      responses:
        '200': {description: Current outcome receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAPIAction'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/research:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read search availability and private report metadata without provider work
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive availability and reports; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchOverview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly research a bounded question through native Google Search
      description: Requires configured search, a supported Code profile, source/search consent and applicable remote-provider confirmation. Source hashes and policy are checked before dispatch and publication. One search-only ADK invocation; no retries, function tools or caching.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchRequest'}}}}
      responses:
        '200': {description: Private report reference without answer text; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/research/{reportID}/report:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: reportID, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{20,64}$'}}
    get:
      tags: [Projects]
      summary: Read a private report with citations and original Search suggestions
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Isolated script-free HTML with no-store, nosniff, no-referrer and restrictive CSP; opening rechecks source freshness without provider work, content: {text/html: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/attachments:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Inspect attachment availability and imported versions without dispatch
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive no-store metadata, content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentOverview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly import bounded supplied media into a private artifact
      description: No filesystem path, provider-fetch URL or network request. The normal 1 MiB JSON body limit applies; decoded data is limited to 512 KiB.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentImport'}}}}
      responses:
        '200': {description: Immutable private artifact metadata, content: {application/json: {schema: {$ref: '#/components/schemas/AgentArtifact'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/attachments/advice:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Request one explicitly consented native multimodal advisory response
      description: Binds imported versions, project/revision, context policy, settings, Function model and destination. No tools, retries, implicit context, remote caching, source changes or provider file uploads. Raw PCM is not completion input; use WAV audio.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentAdviceRequest'}}}}
      responses:
        '200': {description: Metadata for a private advisory artifact; answer text requires explicit artifact inspection, content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentAdviceReceipt'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/projects/current/cloud-copies:
    get:
      tags: [Projects]
      summary: Read configured cloud destinations and local receipts without connecting
      description: Main checkout only; any worktree_path is rejected. Configuration is not a remote availability probe.
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive no-store cloud metadata, content: {application/json: {schema: {$ref: '#/components/schemas/CloudCatalog'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/cloud-copies/preview:
    post:
      tags: [Projects]
      summary: Preview an exact private archive and destination without uploading
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CloudSelection'}}}}
      responses:
        '200': {description: Local metadata and content fingerprint only, content: {application/json: {schema: {$ref: '#/components/schemas/CloudPreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/cloud-copies/control:
    post:
      tags: [Projects]
      summary: Explicitly copy, reconcile or delete a scoped cloud archive
      description: Main checkout only. Copy requires the unchanged preview and source-sharing confirmation. Check and delete require a current receipt version and exact destination. An unknown outcome is retained without automatic upload replay. Cleanup deadlines do not imply a server TTL or deletion of provider backups.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CloudControl'}}}}
      responses:
        '200': {description: Durable no-store receipt; unknown is an uncertain outcome, content: {application/json: {schema: {$ref: '#/components/schemas/CloudCopy'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-triggers:
    get:
      tags: [Projects]
      summary: Inspect ambient watch, grant and retained budget without dispatch
      description: Main checkout only; any worktree_path is rejected. Permission state is separate from the last detection/attempt. A stored watch is inactive after restart until an explicit control.
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive no-store metadata, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTriggers'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-triggers/control:
    post:
      tags: [Projects]
      summary: Explicitly watch, grant, revoke or disable ambient semantic analysis
      description: Main checkout only. Watch does not grant source sharing; grant binds the exact semantic destination and filtered context to an expiry and fixed limits. Revoke/disable join active work and preserve window consumption. A lost receipt requires a passive refresh before retrying.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerControl'}}}}
      responses:
        '200': {description: Updated no-store watch metadata, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTriggers'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/live-sessions:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Inspect live availability and retained session metadata without connecting
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive no-store metadata, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOverview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly open a bounded owned live advisory session
      description: Gemini API with explicit key only. No source mutation, tools, implicit context, capture or playback. Cancellation during connection joins the owner. Failed attempts remain charged; no automatic retry or replay.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpenRequest'}}}}
      responses:
        '200': {description: Connected session metadata, content: {application/json: {schema: {$ref: '#/components/schemas/LiveSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/projects/current/live-sessions/{liveID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {name: liveID, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      tags: [Projects]
      summary: Inspect retained live state and private output artifact metadata
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
