      type: object
      required: [project_revision, expected_revision, declaration]
      properties:
        project_revision: {type: string}
        expected_revision: {type: integer, format: int64}
        declaration: {type: string, description: Replacement text for the isolated declaration, not the source file.}
        imports: {type: array, items: {type: string}}
    DraftValidationRequest:
      type: object
      required: [project_revision, expected_revision]
      properties:
        project_revision: {type: string}
        expected_revision: {type: integer, format: int64}
    DraftCheckRequest:
      type: object
      required: [project_revision, expected_revision, expected_hash]
      properties:
        project_revision: {type: string}
        expected_revision: {type: integer, format: int64}
        expected_hash: {type: string}
        run_lint: {type: boolean}
        run_tests: {type: boolean}
    DraftCheckReport:
      type: object
      required: [target_path, applicable, checks]
      properties:
        draft_id: {type: string}
        draft_revision: {type: integer, format: int64}
        draft_hash: {type: string}
        candidate_hash: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        target_path: {type: string}
        applicable: {type: boolean}
        checks: {type: array, items: {type: object}}
    GoBenchmarkComparisonRequest:
      type: object
      required: [project_revision, expected_revision, expected_hash, benchmark, expected_scope]
      additionalProperties: false
      properties:
        project_revision: {type: string}
        expected_revision: {type: integer, format: int64, minimum: 1}
        expected_hash: {type: string}
        benchmark: {type: string, description: Exact name returned by the benchmark catalog; never a command or shell fragment.}
        expected_scope: {type: string, description: Opaque scope returned with the displayed fixed argv; binds execution to that reviewed selection.}
