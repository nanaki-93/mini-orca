      properties:
        path: {type: string}
        symbol: {type: string}
        signature: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    ChatSessionRequest:
      type: object
      required: [project_id, project_revision, base_file_hash, open_path, mode, target_symbol]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        open_path: {type: string, description: Project-relative open Go source file.}
        mode: {type: string, enum: [replace_symbol, create_symbol]}
        target_symbol: {type: string, description: Exact existing symbol for replacement or absent top-level identifier for creation.}
