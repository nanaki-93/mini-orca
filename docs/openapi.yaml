openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 4.4.0
  description: |
    Local REST API used by the Mini-Orca TUI client. The daemon is the LLM
    boundary. Shared conversations capture up to eight Go/Markdown paths, produce
    checked proposals and require diff review and explicit Apply. Legacy one-file
    declaration APIs remain compatible. Source and diff views are read-only.
    Project import, semantic analysis, Analyze-all, and chat messages can send
    prompt content; a non-loopback HTTP or CLI provider requires explicit confirmation for
    each of those requests. Verified scans, validation, checks, Apply, and Undo
    do not send prompts. An explicitly started change workflow runs its trusted
    checks after generation; source Apply and Undo always require human action.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Security
  - name: Chat
  - name: Drafts
paths:
  /api/projects/current:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the selected project without changing the active project
      responses:
        '200': {description: Project summary, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/plans/investigate:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Chat]
      summary: Investigate explicitly captured plan scope without approving or changing source
      description: Requires Function profile remote confirmation when applicable. Captured hashes, absent paths, project revision, policy and instructions are rechecked before publication. Cancel the request to stop investigation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanInvestigationRequest'}}}}
      responses:
        '200': {description: Bounded model suggestions with validated source citations, content: {application/json: {schema: {$ref: '#/components/schemas/PlanInvestigation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/integrations:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive MCP configuration and expiring inventory grants
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: No connection or process startup; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentIntegration'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/integrations/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover or revoke a configured MCP integration
      description: Discovery requires confirm_connect and the current configuration fingerprint. It opens and closes a bounded connection, returning a 15-minute schema grant. Revocation cancels in-flight operations and requires the current grant when one exists. Neither action grants source sharing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Ready inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentIntegration'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/remote-agents:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive A2A configurations and expiring card grants
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: No remote discovery or dispatch; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentRemote'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/remote-agents/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover or revoke an A2A card grant
      description: Discovery requires confirm_connect and current configuration identity. Pins the configured A2A 1.0 JSON-RPC endpoint and card fingerprint for 15 minutes. Revocation requires the current grant and cancels admitted operations. Neither grants source sharing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Current ready inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRemote'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read durable delegation metadata without network activity
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Questions, observations and advisory text/artifacts are omitted or empty; stale checks revision only; no-store, content: {application/json: {schema: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentDelegation'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Send one explicitly admitted advisory task to a remote agent
      description: Persists a pending receipt before a single send. Requires current project/card/source identities and fresh delegation/source-sharing consent. Receipts distinguish remote outcomes from local transport success. Unknown or pending work blocks another start at the endpoint. No automatic retries or source mutation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRequest'}}}}
      responses:
        '200': {description: Private advisory outcome receipt, including unknown or not_sent; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations/{delegationID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: delegationID, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: Read a private advisory delegation receipt
      description: Includes bounded text/artifacts and checks current source freshness locally. Never contacts the remote agent or resumes a task.
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Private advisory receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/delegations/{delegationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: delegationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly recover or continue an existing remote task
      description: Requires current receipt version and confirm. Refresh uses GetTask; reconnect uses SubscribeToTask; cancel uses CancelTask. Input sends one new message only for input_required with current source authority and fresh sharing consent. Reconciliation records a user-reported observation for unknown, auth_required or expired pending work without network dispatch. Reconciliation cannot race an active local owner.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationControl'}}}}
      responses:
        '200': {description: Updated private advisory receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentDelegation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/apis:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read passive curated API configurations and inventories
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Private configurations and optional expiring grants; no-store, content: {application/json: {schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentAPI'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/apis/{integrationID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: integrationID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Explicitly discover a local OpenAPI specification or revoke its grant
      description: Discovery requires confirm_connect and current configuration identity. Reads indexed local JSON only; it never contacts the API. Revoke requires any current grant and cancels admitted operations.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationControl'}}}}
      responses:
        '200': {description: Current inventory or revoked configuration; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAPI'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/api-actions:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read private exact-action candidates and durable external outcome receipts
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-bearing review and recovery records; no-store, content: {application/json: {schema: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/AgentAPIAction'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/api-actions/{actionID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: actionID, required: true, schema: {type: string}}
    post:
      tags: [Projects]
      summary: Approve one exact external request or record a user-reported reconciliation
      description: Claims a durable pending receipt before one HTTP attempt. Pending or unknown outcomes block new writes through the operation. Reconciliation requires an externally checked observation and never retries. A 200 response does not imply the external effect completed; inspect state.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APIActionControl'}}}}
      responses:
        '200': {description: Current outcome receipt; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAPIAction'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/research:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read search availability and private report metadata without provider work
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive availability and reports; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchOverview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly research a bounded question through native Google Search
      description: Requires configured search, a supported Function profile, source/search consent and applicable remote-provider confirmation. Source hashes and policy are checked before dispatch and publication. One search-only ADK invocation; no retries, function tools or caching.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchRequest'}}}}
      responses:
        '200': {description: Private report reference without answer text; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/research/{reportID}/report:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: reportID, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{20,64}$'}}
    get:
      tags: [Projects]
      summary: Read a private report with citations and original Search suggestions
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Isolated script-free HTML with no-store, nosniff, no-referrer and restrictive CSP; opening rechecks source freshness without provider work, content: {text/html: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/memory:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read private curated memory metadata without dispatching or changing state
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: At most 512 records with empty text and unchecked source status; no-store, content: {application/json: {schema: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/AgentMemory'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly retain a candidate memory
      description: Requires action create, version zero and a draft. Captured source identity and policy are validated; no model, source mutation or check execution occurs.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryMutation'}}}}
      responses:
        '200': {description: New candidate with private text; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemory'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/memory/{memoryID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: memoryID, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: Read private retained text and current source status
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Private record with source and revision freshness; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemory'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly edit, accept or forget a retained memory
      description: Requires a positive current version. Edit requires a draft and resets acceptance. Accept rechecks source/provenance. Forget deletes the record immediately. No checks, provider work or source mutation occurs.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryMutation'}}}}
      responses:
        '200': {description: Updated record, or JSON null after forget; no-store, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/AgentMemory'}], nullable: true}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-runs:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {$ref: '#/components/parameters/AgentProjectID'}
      - {$ref: '#/components/parameters/ProjectRevision'}
    get:
      tags: [Projects]
      summary: Read source-free root invocation history
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: cursor, schema: {type: string}, description: Opaque project/revision-bound pagination cursor.}
      responses:
        '200': {description: Bounded retained roots, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunList'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-runs/events:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {$ref: '#/components/parameters/AgentProjectID'}
      - {$ref: '#/components/parameters/ProjectRevision'}
    get:
      tags: [Projects]
      summary: Replay durable progress or subscribe with SSE
      description: Retains 2048 source-free events. Missing, expired, foreign or future cursors return a reset snapshot at the current cursor. SSE frames use agent_progress and are bounded to 1 MiB with ten-second write deadlines. No model text is streamed here.
      parameters:
        - {in: query, name: cursor, schema: {type: string, maxLength: 180}}
        - {in: header, name: Last-Event-ID, schema: {type: string, maxLength: 180}, description: Alternative cursor; must match if both are provided.}
      responses:
        '200':
          description: One replay batch or a sequence of agent_progress SSE frames.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AgentEventBatch'}}
            text/event-stream: {schema: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-runs/{runID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {$ref: '#/components/parameters/AgentProjectID'}
      - {$ref: '#/components/parameters/ProjectRevision'}
      - {$ref: '#/components/parameters/AgentRunID'}
    get:
      tags: [Projects]
      summary: Read invocation hierarchy and retained evidence references
      parameters:
        - {in: query, name: include_text, schema: {type: boolean, default: false}, description: Explicitly request private advisory model output.}
      responses:
        '200': {description: Bounded private detail with source-free metadata by default, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunDetail'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-runs/{runID}/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {$ref: '#/components/parameters/AgentRunID'}
    post:
      tags: [Projects]
      summary: Cancel a current root invocation owned by this daemon
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunControl'}}}}
      responses:
        '200': {description: Cancellation requested; worker owns cleanup, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunDetail'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-runs/{runID}/input:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {$ref: '#/components/parameters/AgentRunID'}
    post:
      tags: [Projects]
      summary: Respond to an exact native checkpoint through the proposal owner
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeInputResponse'}}}}
      responses:
        '200': {description: Guarded proposal review result; Apply remains explicit, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Chat]
      description: List bounded local conversation summaries without generation or source contents.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChangeHistoryEntry'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Chat]
      description: Capture a task and one to eight explicit Go/Markdown paths.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeCreateRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/recovery:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Chat]
      description: Read the latest grouped mutation or interrupted recovery journal.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    get:
      tags: [Chat]
      description: Read a proposal and recheck source freshness.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/resume:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Restore history and clear check/review authority; no provider request.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeIdentity'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/messages:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Generate a scoped proposal or explicitly request bounded check-driven repair.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMessageRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/checks:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Check the current proposal; tests/vet require independent execution trust.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeCheckRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/workflow:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
