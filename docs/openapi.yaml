        repair: {type: boolean, description: Explicit check-driven repair for the latest task-bound failed draft; pins its reviewed temporary proof and is limited to three per session.}
    ChatSession:
      type: object
      required: [id, project_id, project_revision, base_file_hash, open_path, mode, target_symbol, state, messages, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        base_file_hash: {type: string}
        open_path: {type: string}
        mode: {type: string, enum: [replace_symbol, create_symbol]}
        target_symbol: {type: string}
        task_spec: {$ref: '#/components/schemas/BugTaskSpec'}
        repair_count: {type: integer, minimum: 0, maximum: 3}
        state: {type: string, enum: [active, stale]}
        latest_draft_id: {type: string}
        messages: {type: array, items: {$ref: '#/components/schemas/ChatSessionMessage'}}
