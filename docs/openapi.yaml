        project_revision: {type: string, minLength: 1}
        plan: {$ref: '#/components/schemas/ChangePlanInput'}
        paths: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string}}
        sources: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/PlanInvestigationSource'}}
        acceptance_criteria: {type: array, maxItems: 16, items: {type: string, minLength: 1, maxLength: 1024}}
        confirm_remote_provider: {type: boolean, default: false}
    PlanInvestigation:
      type: object
      required: [version, project_id, project_revision, input_hash, context_manifest, approach, evidence, assumptions, suggested_scope, acceptance_criteria]
      properties:
        version: {type: string, enum: [v1]}
        project_id: {type: string}
        project_revision: {type: string}
        input_hash: {type: string}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
        approach: {type: string, minLength: 1, maxLength: 4096}
        evidence: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/PlanEvidence'}}
        assumptions: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 512}}
        suggested_scope: {type: array, maxItems: 8, items: {type: string}, description: Advisory paths; never automatically added to read/write scope.}
        acceptance_criteria: {type: array, minItems: 1, maxItems: 16, items: {type: string, minLength: 1, maxLength: 512}}
    ChangePlanInput:
      type: object
      required: [problem, approach]
      properties:
        problem: {type: string, minLength: 1, maxLength: 8192}
        evidence: {type: string, maxLength: 8192}
        approach: {type: string, minLength: 1, maxLength: 8192}
        non_goals: {type: array, maxItems: 16, items: {type: string, maxLength: 8192}}
        read_paths: {type: array, maxItems: 8, uniqueItems: true, items: {type: string}, description: Existing context paths distinct from write targets; policy and size limits apply.}
        citations: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/PlanEvidence'}}
        assumptions: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 512}}
    ChangePlan:
      allOf:
        - {$ref: '#/components/schemas/ChangePlanInput'}
        - type: object
          required: [hash]
          properties:
            hash: {type: string, description: "Captured intent, criteria, source, instructions and workspace identity."}
            approved_hash: {type: string}
            read_targets: {type: array, items: {$ref: '#/components/schemas/ChangeTarget'}}
    ChangePlanRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [plan, paths, acceptance_criteria]
          properties:
            plan: {$ref: '#/components/schemas/ChangePlanInput'}
            paths: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string}}
            acceptance_criteria: {type: array, minItems: 1, maxItems: 16, items: {type: string, maxLength: 1024}}
    ChangeFileReviewRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [path]
          properties:
            path: {type: string}
    ChangeTarget:
      type: object
      properties:
        path: {type: string}
