      type: string
      enum: [pending, running, completed, completed_empty, partial, failed, skipped, unavailable, canceled, interrupted, stale]
    AnalysisRunLimits:
      type: object
      additionalProperties: false
      required: [batch_files, budget_seconds, max_attempts_per_stage]
      properties:
        batch_files: {type: integer, minimum: 1, maximum: 500, default: 100, description: Dispatch-window limit; does not truncate captured project inventory.}
        budget_seconds: {type: integer, minimum: 1, maximum: 3600, default: 900}
        max_attempts_per_stage: {type: integer, minimum: 1, maximum: 4, default: 2, description: Initial request plus all retries; cumulative across resumes.}
    AnalysisQueueIdentity:
      type: object
      required: [project_id, project_revision, policy_fingerprint, provider_fingerprint, queue_id]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        policy_fingerprint: {type: string, minLength: 1}
        provider_fingerprint: {type: string, minLength: 1}
        queue_id: {type: string, minLength: 1, description: Stable captured scope; excludes mutable cache availability.}
    AnalysisRunIdentity:
      allOf:
        - {$ref: '#/components/schemas/AnalysisQueueIdentity'}
        - type: object
          required: [id, generation]
          properties:
            id: {type: string, minLength: 1}
            generation: {type: string, minLength: 1}
    AnalysisSelectionRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, selection_id, excluded_paths]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        selection_id: {type: string, minLength: 1}
        excluded_paths: {type: array, maxItems: 20000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 4096}, description: Canonical project-relative paths. Empty selects all eligible files.}
    AnalysisFileSelection:
      type: object
      required: [project_id, project_revision, selection_id, excluded_paths, files, editable]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        selection_id: {type: string}
        excluded_paths: {type: array, items: {type: string}}
        editable: {type: boolean}
        files:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: {type: string}
              reason: {type: string, description: Empty when selectable; otherwise the eligibility exclusion reason.}
    AnalysisPreviewRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, scope, refresh, limits]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        scope: {type: string, enum: [project]}
        refresh: {type: boolean}
        retry_stale_failed: {type: boolean, default: false, description: Select only files with stale or failed analysis; incompatible with refresh. Resume preserves the admitted selection.}
        limits: {$ref: '#/components/schemas/AnalysisRunLimits'}
        resume_run: {$ref: '#/components/schemas/AnalysisRunIdentity'}
    AnalysisFileIdentity:
      type: object
      required: [path, content_hash, language]
      properties:
        path: {type: string, minLength: 1, description: Canonical project-relative path.}
        content_hash: {type: string, minLength: 1}
        language: {type: string, minLength: 1}
    AnalysisProviderRequirement:
      type: object
      required: [id, stages, model, remote_confirmation_required]
      properties:
        id: {type: string, minLength: 1}
        stages: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/AnalysisStage'}}
        model: {$ref: '#/components/schemas/ScopedModel'}
        remote_confirmation_required: {type: boolean}
    AnalysisStagePlan:
      type: object
      required: [stage, eligible, cached, max_model_requests]
      properties:
        stage: {$ref: '#/components/schemas/AnalysisStage'}
        eligible: {type: boolean}
        cached: {type: boolean}
        reason: {type: string, description: Sanitized eligibility/cache explanation.}
        provider_id: {type: string}
        max_model_requests: {type: integer, minimum: 0, maximum: 4, description: Zero for cache/rules/ineligible work; otherwise includes all retries.}
    AnalysisPlannedFile:
      allOf:
        - {$ref: '#/components/schemas/AnalysisFileIdentity'}
        - type: object
          required: [size_bytes, stages]
          properties:
            size_bytes: {type: integer, format: int64, minimum: 0}
            stages: {type: array, items: {$ref: '#/components/schemas/AnalysisStagePlan'}}
