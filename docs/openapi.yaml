        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        title: {type: string}
        revision: {type: integer}
        hash: {type: string}
        state: {type: string}
        freshness: {type: string}
        workflow_status: {type: string}
        updated_at: {type: string, format: date-time}
    ChangeVerification:
