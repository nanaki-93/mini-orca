        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Source-free workspace preparation, parser, vet, and test progress; bounded workspace failures include sanitized evidence, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '204': {description: No verified scan exists for this project revision.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Explicitly start a Go verified scan in a temporary copied workspace
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoScanRequest'}}}
      responses:
        '202': {description: Scan started, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Cancel the active temporary-workspace Go scan
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cancellation requested; completed phases remain available, content: {application/json: {schema: {$ref: '#/components/schemas/GoScanReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/events:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Stream Server-Sent Events (SSE) for project analysis, scan, and workflow progress
      responses:
        '200':
          description: Server-Sent Events stream of ready and update notifications.
          content:
            text/event-stream:
              schema:
                type: string
  /api/projects/current/execution-trust:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the current project's trusted local execution scope
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: task_test_name
          in: query
          required: false
          schema: {type: string}
          description: Exact generated Go test name for a task-test trust preview.
      responses:
        '200': {description: Remembered project trust bound to current sources and the exact command scope, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Save or revoke local execution trust for the current project path
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrustRequest'}}}
      responses:
        '200': {description: Project trust decision saved in private user settings, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/bootstrap/exec:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Execute mise and lefthook bootstrap steps under local execution trust
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrustRequest'}}}
      responses:
        '200': {description: Bootstrap execution steps and statuses, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/impact:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Advisory index-based impact preview for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Source-free advisory references that do not alter model context
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/git:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read-only Git status for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Repository availability, branch, and target-file status
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/security-scan:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Scan exactly one eligible Go file with deterministic source-only security rules
      description: Applies the current Go ruleset without provider access or subprocess execution. A rule match requires syntactic review and is not proof of exploitability.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityScanRequest'}}}
      responses:
        '200': {description: Source-free deterministic Security report; partial reports retain the first five source-order matches and state that coverage limit, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/explanation:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Explain one exact indexed Go declaration without creating workflow state
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanationRequest'}}}
      responses:
        '200': {description: Transient bounded explanation with source anchors and Function-context provenance, content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/security-review:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Perform one explicit passive AI security review of one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityReviewRequest'}}}
      responses:
        '200': {description: Source-free advisory report; completed_empty does not mean the file is secure, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    AgentProjectID:
      in: query
      name: project_id
      required: true
      schema: {type: string}
    AgentRunID:
      in: path
      name: runID
      required: true
      schema: {type: string}
    WorktreePath:
      in: query
      name: worktree_path
      required: false
      description: Optional absolute path of another registered worktree in the active repository. Requests use that checkout's project identity, jobs, trust and proposal guards without changing the active project. Membership is rechecked on every request.
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    RemoteServicePrincipal:
      type: object
      required: [config, configuration, state]
      properties:
        config:
          type: object
          required: [id, bearer_token_env, project_id, capabilities]
          properties:
            id: {type: string}
            bearer_token_env: {type: string, description: Credential reference only.}
            project_id: {type: string}
            capabilities: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [analysis, proposal]}}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [disabled, configured, unavailable, authorized, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
    RemoteServiceControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        action: {type: string, enum: [grant, revoke]}
        grant: {type: string, description: Current live grant required for replacement or revocation.}
        confirm_connect: {type: boolean, default: false}
        confirm_source_sharing: {type: boolean, default: false}
        confirm_remote_provider: {type: boolean, default: false}
    AgentRemote:
      type: object
      required: [config, configuration, state]
      properties:
        config:
          type: object
          required: [id, card_url, endpoint, skills, timeout_seconds]
          properties:
            id: {type: string}
            card_url: {type: string, format: uri}
            endpoint: {type: string, format: uri}
            bearer_token_env: {type: string, description: Credential reference only; never the resolved secret.}
            skills: {type: array, minItems: 1, maxItems: 4, items: {type: string}}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
        configuration: {type: string}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        inventory:
          type: object
          required: [fingerprint, name, description, version, streaming, skills]
          properties:
            fingerprint: {type: string}
            name: {type: string}
            description: {type: string}
            version: {type: string}
            streaming: {type: boolean}
            skills:
              type: array
              maxItems: 4
              items:
                type: object
                required: [id, name, description]
                properties:
                  id: {type: string}
                  name: {type: string}
                  description: {type: string}
    ExternalSource:
      type: object
      additionalProperties: false
      required: [path, hash]
      properties:
        path: {type: string}
        hash: {type: string, description: Current captured source hash.}
    DelegationRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, remote, kind, skill, question, confirm_delegate]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        remote: {$ref: '#/components/schemas/IntegrationUse'}
        kind: {type: string, enum: [analysis, review]}
        skill: {type: string, description: Allowlisted advertised skill ID.}
        question: {type: string, minLength: 1, maxLength: 2048, description: Limit is UTF-8 bytes; newline/tab permitted, other controls rejected.}
        sources: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/ExternalSource'}}
        stream: {type: boolean, default: false, description: Explicit SSE request; requires advertised support.}
        confirm_delegate: {type: boolean, enum: [true]}
    DelegationControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, version, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [input, refresh, reconnect, cancel, reconcile]}
        remote: {$ref: '#/components/schemas/IntegrationUse'}
        reply: {type: string, maxLength: 2048, description: Input only; UTF-8 byte limit. Requires remote.confirm_source_sharing.}
        observation: {type: string, maxLength: 2048, description: Reconciliation only; user-reported external outcome, never remote verification.}
        stream: {type: boolean, default: false, description: Input only. Reconnect always subscribes using SSE.}
        confirm: {type: boolean, enum: [true]}
    RemoteProgress:
      type: object
      required: [state, artifacts, usage]
      properties:
        task_id: {type: string}
        context_id: {type: string}
        state: {type: string, enum: [submitted, working, input_required, auth_required, completed, failed, rejected, canceled, unknown, not_sent]}
        text: {type: string, description: Untrusted plain text; combined text/artifacts limited to 64 KiB.}
        artifacts:
          type: array
          nullable: true
          maxItems: 4
          items:
            type: object
            required: [id, name, text, complete]
            properties:
              id: {type: string}
              name: {type: string}
              text: {type: string}
              complete: {type: boolean}
        usage:
          type: object
          required: [input_tokens, output_tokens, source]
          properties:
            input_tokens: {type: integer, format: int64, minimum: 0}
            output_tokens: {type: integer, format: int64, minimum: 0}
            source: {type: string, enum: [unknown, remote_reported], description: Unknown counts are zero placeholders. Remote model/search call counts are never inferred.}
    AgentDelegation:
      type: object
      required: [id, version, project_id, project_revision, remote_id, endpoint_hash, card_fingerprint, skill, kind, question, policy, sources, input_hash, message_id, operation, attempt_id, state, progress, created_at, updated_at, lease_until, stale, active, advisory]
      properties:
        id: {type: string}
        version: {type: integer, format: int64}
        project_id: {type: string}
        project_revision: {type: string}
        remote_id: {type: string}
        endpoint_hash: {type: string}
        card_fingerprint: {type: string}
        skill: {type: string}
        kind: {type: string, enum: [analysis, review]}
        question: {type: string, description: Empty on list responses.}
        policy: {type: string}
        sources: {type: array, nullable: true, maxItems: 8, items: {$ref: '#/components/schemas/MemorySource'}}
        input_hash: {type: string}
        message_id: {type: string}
        operation: {type: string, enum: [start, input, refresh, reconnect, cancel, reconcile]}
        attempt_id: {type: string}
        state: {type: string, enum: [pending, submitted, working, input_required, auth_required, completed, failed, rejected, canceled, unknown, not_sent, reconciled]}
        progress: {$ref: '#/components/schemas/RemoteProgress'}
        observation: {type: string, description: User-reported reconciliation; omitted on list responses.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        lease_until: {type: string, format: date-time, description: Zero timestamp when no pending lease remains.}
        stale: {type: boolean, description: Detail rechecks actual sources; list checks revision only.}
        active: {type: boolean, description: An operation currently owned by this daemon.}
        advisory: {type: boolean, enum: [true]}
    AgentAPI:
      type: object
      required: [config, configuration, state]
      properties:
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        config:
          type: object
          required: [id, spec_path, endpoint, operations, timeout_seconds]
          properties:
            id: {type: string}
            spec_path: {type: string, description: Indexed project-relative OpenAPI 3.0 JSON specification.}
            endpoint: {type: string, format: uri}
            bearer_token_env: {type: string, description: Credential environment reference only.}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
            operations:
              type: array
              minItems: 1
              maxItems: 4
              items:
                type: object
                required: [name, effect]
                properties:
                  name: {type: string}
                  effect: {type: string, enum: [read_external, mutate_external]}
        inventory:
          type: object
          required: [fingerprint, operations]
          properties:
            fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
            operations: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/APIOperation'}}
    APIOperation:
      type: object
      required: [id, method, path, effect, description, parameters, input_schema, responses]
      properties:
        id: {type: string}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        path: {type: string}
        effect: {type: string, enum: [read_external, mutate_external]}
        description: {type: string, maxLength: 512}
        input_schema: {type: object, additionalProperties: true}
        responses: {type: object, additionalProperties: {type: object, nullable: true, additionalProperties: true}, description: Exact successful HTTP status keys; null denotes empty 204.}
        parameters:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, in, required, schema]
            properties:
              name: {type: string}
              in: {type: string, enum: [path, query]}
              required: {type: boolean}
              schema: {type: object, additionalProperties: true}
              style: {type: string, enum: [simple, form]}
              explode: {type: boolean}
              description: {type: string}
    APIActionControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, version, request_hash, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [approve, reconcile]}
        version: {type: integer, format: int64, minimum: 1}
        request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm: {type: boolean, enum: [true]}
        reported_outcome: {type: string, enum: [applied, not_applied, other], description: Required only for reconciliation.}
        observation: {type: string, description: Required nonempty user account up to 2048 bytes for reconciliation; forbidden for approval.}
    AgentAPIAction:
      type: object
      required: [id, version, project_id, project_revision, integration_id, inventory, scope, operation_key, request, arguments, request_hash, state, created_at, updated_at, expires_at, can_approve, can_reconcile, stale]
      properties:
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        project_id: {type: string}
        project_revision: {type: string}
        integration_id: {type: string}
        inventory: {type: string}
        scope: {type: string}
        operation_key: {type: string}
        request_hash: {type: string}
        arguments: {type: object, additionalProperties: true}
        request:
          type: object
          required: [operation_id, operation_key, method, url]
          properties:
            operation_id: {type: string}
            operation_key: {type: string}
            method: {type: string}
            url: {type: string, format: uri}
            body: {type: object, additionalProperties: true}
        state: {type: string, enum: [candidate, pending, completed, not_sent, unknown, reconciled]}
        http_status: {type: integer}
        response: {type: object, additionalProperties: true}
        response_hash: {type: string}
        reported_outcome: {type: string, enum: [applied, not_applied, other]}
        observation: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        pending_until: {type: string, format: date-time}
        can_approve: {type: boolean}
        can_reconcile: {type: boolean}
        stale: {type: boolean}
    ResearchRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, question, confirm_search, confirm_source_sharing]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        question: {type: string, description: Nonempty question up to 2048 UTF-8 bytes.}
        sources:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [path, hash]
            properties:
              path: {type: string}
              hash: {type: string}
        confirm_search: {type: boolean, enum: [true]}
        confirm_source_sharing: {type: boolean, enum: [true]}
        confirm_remote_provider: {type: boolean, default: false}
    ResearchReport:
      type: object
      required: [id, project_id, project_revision, title, state, model, created_at, stale]
      properties:
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        title: {type: string}
        state: {type: string, enum: [grounded, uncited, ungrounded]}
        model: {type: string}
        created_at: {type: string, format: date-time}
        stale: {type: boolean, description: Revision comparison in list metadata; report rendering additionally checks admitted sources and policy.}
    ResearchOverview:
      type: object
      required: [state, model, reports]
      properties:
        state: {type: string, enum: [available, disabled, unsupported_profile]}
        model: {type: string}
        reports: {type: array, items: {$ref: '#/components/schemas/ResearchReport'}}
    IntegrationUse:
      type: object
      description: Ephemeral consent for one admitted investigation or explanation. A saved plan, discovered inventory, incoming principal grant or remote-agent connection does not inherit this source-sharing authority.
      additionalProperties: false
      required: [id, grant, schema_fingerprint, confirm_source_sharing]
      properties:
        id: {type: string, maxLength: 24}
        grant: {type: string, description: Current in-memory discovery grant; invalidated by revoke, reindex, replacement or restart.}
        schema_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm_source_sharing: {type: boolean, enum: [true], description: Approve this investigation's admitted prompt, source, skill and memory context reaching this server.}
    IntegrationControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, configuration]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [discover, revoke]}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        grant: {type: string, description: Required to revoke an existing inventory.}
        confirm_connect: {type: boolean, default: false, description: Required true for discovery; explicitly approves endpoint access or launching the configured installed process.}
    AgentIntegration:
      type: object
      required: [config, configuration, state]
      properties:
        config:
          type: object
          required: [id, transport, tools, timeout_seconds]
          properties:
            id: {type: string}
            transport: {type: string, enum: [stdio, streamable_http]}
            endpoint: {type: string}
            bearer_token_env: {type: string, description: Environment variable reference only; never its value.}
            command: {type: string, description: Absolute installed executable.}
            args: {type: array, maxItems: 16, items: {type: string}}
            environment: {type: object, additionalProperties: {type: string}, description: Child variable to explicit credential variable reference.}
            timeout_seconds: {type: integer, minimum: 1, maximum: 60}
            tools:
              type: array
              maxItems: 4
              items:
                type: object
                properties:
                  name: {type: string}
                  effect: {type: string, enum: [read_external]}
        configuration: {type: string}
        state: {type: string, enum: [configured, ready, expired]}
        grant: {type: string}
        expires_at: {type: string, format: date-time}
        inventory:
          type: object
          required: [fingerprint, tools]
          properties:
            fingerprint: {type: string}
            tools:
              type: array
              maxItems: 4
              items:
                type: object
                required: [remote_name, name, description, input_schema, output_schema]
                properties:
                  remote_name: {type: string}
                  name: {type: string, description: Stable local alias used by the investigation.}
                  description: {type: string, maxLength: 1024}
                  input_schema: {type: object, additionalProperties: true}
                  output_schema: {type: object, additionalProperties: true}
    MemorySource:
      type: object
      additionalProperties: false
      required: [path, hash]
      properties:
        path: {type: string, description: Bounded relative source path; no traversal or excluded files.}
        hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        start_line: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        end_line: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      description: Both lines zero means whole file; otherwise an inclusive valid span. Hash must match current source.
    MemoryDraft:
      type: object
      additionalProperties: false
      required: [kind, title, sources]
      properties:
        kind: {type: string, enum: [decision, lesson, verified_outcome]}
        title: {type: string, description: Nonempty title up to 120 UTF-8 bytes without control characters.}
        text: {type: string, description: Nonempty manual advice up to 2048 UTF-8 bytes; must be empty when deriving a proposal receipt or retained harness lesson.}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MemorySource'}}
        retention_days: {type: integer, minimum: 1, maximum: 365, default: 30}
        session_id: {type: string}
        identity: {$ref: '#/components/schemas/ChangeIdentity'}
        lesson_index: {type: integer, minimum: 0}
      description: Verified outcomes require session_id and exact identity with live passing check receipts. Retained harness lessons also select lesson_index. Manual decisions/lessons omit these fields. Editing always resets acceptance.
    MemoryMutation:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, version]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [create, edit, accept, forget]}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        draft: {$ref: '#/components/schemas/MemoryDraft'}
      description: Create uses the collection route and version zero. Other actions use the detail route and current positive version. Create/edit require draft; accept/forget reject it.
    AgentArtifact:
      type: object
      required: [id, name, version, hash, kind, mime, size, created, project_id, project_revision, owner, ownership, provenance, revision_status, source_status, protected, in_use, can_delete, uri]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        name: {type: string, maxLength: 128}
        version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740992}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        kind: {type: string, enum: [text, inline]}
        mime: {type: string, maxLength: 256}
        display_name: {type: string, maxLength: 256}
        size: {type: integer, minimum: 0, maximum: 4194304}
        created: {type: string, format: date-time}
        project_id: {type: string}
        project_revision: {type: string, description: Recorded revision; empty means unknown.}
        owner:
          type: object
          required: [app, user, id]
          properties:
            app: {type: string}
            user: {type: string}
            id: {type: string}
        ownership: {type: string, enum: [project, research]}
        provenance: {type: object, additionalProperties: {type: string}, description: Host identity fields only; arbitrary custom metadata is omitted.}
        revision_status: {type: string, enum: [current, stale, unknown]}
        source_status: {type: string, enum: [unchecked]}
        protected: {type: boolean}
        in_use: {type: boolean}
        can_delete: {type: boolean, description: Advisory snapshot; deletion always rechecks protection under the journal lock.}
        uri: {type: string}
    AttachmentImport:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, name, mime, data, confirm_import]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        name: {type: string, minLength: 1, maxLength: 128, description: Plain UTF-8 display name without paths or control characters.}
        mime: {type: string, enum: [image/png, image/jpeg, application/pdf, audio/wav, 'audio/pcm;rate=16000']}
        data: {type: string, format: byte, description: Base64 of 1 to 524288 bytes; MIME/content validation applies.}
        confirm_import: {type: boolean, enum: [true]}
    AttachmentReference:
      type: object
      additionalProperties: false
      required: [id, version, hash]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 1}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    AttachmentOverview:
      type: object
      required: [project_id, project_revision, state, configuration, settings_version, model, limits, attachments, truncated]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        state: {type: string, enum: [available, unsupported_profile, stale_settings]}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {$ref: '#/components/schemas/ScopedModel'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        attachments: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentArtifact'}}
        truncated: {type: boolean, description: Older imports remain in the paginated artifact library.}
    AttachmentAdviceRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, settings_version, model, provider_origin, question, attachments, confirm_source_sharing, confirm_remote_provider]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        provider_origin: {type: string}
        question: {type: string, minLength: 1, maxLength: 2048, description: At most 2048 UTF-8 bytes.}
        attachments: {type: array, minItems: 1, maxItems: 4, items: {$ref: '#/components/schemas/AttachmentReference'}, description: Distinct current imported versions totaling at most 1 MiB.}
        confirm_source_sharing: {type: boolean, enum: [true]}
        confirm_remote_provider: {type: boolean, description: Required to be true for a remote Code profile.}
    AttachmentAdviceReceipt:
      type: object
      required: [state, artifact, model, usage, usage_known]
      properties:
        state: {type: string, enum: [advisory]}
        artifact: {$ref: '#/components/schemas/AgentArtifact'}
        model: {type: string}
        usage_known: {type: boolean}
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: {type: integer, minimum: 0}
            completion_tokens: {type: integer, minimum: 0}
            total_tokens: {type: integer, minimum: 0}
            prompt_tokens_details:
              type: object
              properties:
                cached_tokens: {type: integer, minimum: 0}
    CloudTarget:
      type: object
      additionalProperties: false
      required: [id, service, project, region, resource, principal, credential_file_env, retention_days]
      properties:
        id: {type: string}
        service: {type: string, enum: [vertex_session, gcs_artifact]}
        project: {type: string, pattern: '^[1-9][0-9]{5,19}$'}
        region: {type: string}
        resource: {type: string}
        principal: {type: string}
        credential_file_env: {type: string}
        retention_days: {type: integer, minimum: 1, maximum: 365}
    CloudSelection:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, target_id, kind, source_id]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        target_id: {type: string}
        kind: {type: string, enum: [session, artifact]}
        source_id: {type: string}
    CloudPreview:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, target_id, kind, source_id, id, target, configuration, source_revision, source_version, hash, size]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        target_id: {type: string}
        kind: {type: string, enum: [session, artifact]}
        source_id: {type: string}
        id: {type: string, pattern: '^mo-[a-f0-9]{32}$'}
        target: {$ref: '#/components/schemas/CloudTarget'}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_revision: {type: string}
        source_version: {type: integer, format: int64, minimum: 0}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, minimum: 1, maximum: 4194304}
    CloudCopy:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, kind, source_id, id, target, configuration, source_revision, source_version, hash, size, version, state, created_at, updated_at, cleanup_at, lease_until]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string, enum: [session, artifact]}
        source_id: {type: string}
        id: {type: string, pattern: '^mo-[a-f0-9]{32}$'}
        target: {$ref: '#/components/schemas/CloudTarget'}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_revision: {type: string}
        source_version: {type: integer, format: int64, minimum: 0}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, minimum: 1, maximum: 4194304}
        version: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [copying, checking, deleting, completed, unknown, missing, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        cleanup_at: {type: string, format: date-time}
        lease_until: {type: string, format: date-time}
    CloudDestination:
      type: object
      required: [target, configuration, state]
      properties:
        target: {$ref: '#/components/schemas/CloudTarget'}
        configuration: {type: string}
        state: {type: string, enum: [configured]}
    CloudCatalog:
      type: object
      required: [project_id, project_revision, destinations, copies]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        destinations: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/CloudDestination'}}
        copies: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/CloudCopy'}}
    CloudControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, id, version, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [copy, check, delete]}
        id: {type: string, pattern: '^mo-[a-f0-9]{32}$'}
        version: {type: integer, format: int64, minimum: 0}
        preview: {$ref: '#/components/schemas/CloudPreview'}
        confirm: {type: boolean, const: true}
        confirm_source_sharing: {type: boolean}
    TriggerControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, settings_version, policy, model, provider_origin, control_revision, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string, description: Revoke/disable may use an older revision for the current project.}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        policy: {type: string}
        model: {type: string}
        provider_origin: {type: string}
        control_revision: {type: integer, format: int64, minimum: 0}
        action: {type: string, enum: [watch, grant, revoke, disable]}
        confirm: {type: boolean, enum: [true]}
        options: {$ref: '#/components/schemas/TriggerOptions', description: Required for watch; rejected for other actions.}
        scope_hash: {type: string, description: Exact current scope hash required for grant.}
        grant_seconds: {type: integer, minimum: 60, maximum: 86400, description: Required for grant and capped by configured ceiling.}
        confirm_source_sharing: {type: boolean, description: Required true for grant; selected sources and filtered project context.}
        confirm_remote_provider: {type: boolean, description: Required true for grant when the actual semantic destination is remote.}
    TriggerOptions:
      type: object
      additionalProperties: false
      required: [mode, interval_seconds, paths]
      properties:
        mode: {type: string, enum: [disabled, changes, interval]}
        interval_seconds: {type: integer, minimum: 0, maximum: 86400, description: Zero for changes/disabled; 60–86400 for interval.}
        paths: {type: array, maxItems: 8, uniqueItems: true, items: {type: string, maxLength: 512}, description: One to eight canonical indexed source paths for an active watch; empty when disabled.}
    TriggerAllowance:
      type: object
      required: [runs, model_calls, input_tokens, output_tokens, seconds]
      properties:
        runs: {type: integer, minimum: 0, maximum: 16}
        model_calls: {type: integer, minimum: 0, maximum: 64}
        input_tokens: {type: integer, format: int64, minimum: 0, maximum: 67108864}
        output_tokens: {type: integer, format: int64, minimum: 0, maximum: 16777216}
        seconds: {type: integer, minimum: 0, maximum: 86400}
    TriggerCeilings:
      type: object
      required: [poll_seconds, debounce_seconds, quiet_seconds, window_seconds, max_runs, max_model_calls, max_input_tokens, max_output_tokens, run_seconds, grant_seconds]
      properties:
        poll_seconds: {type: integer, minimum: 1, maximum: 60, default: 2}
        debounce_seconds: {type: integer, minimum: 1, maximum: 300, default: 3}
        quiet_seconds: {type: integer, minimum: 5, maximum: 3600, default: 60}
        window_seconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
        max_runs: {type: integer, minimum: 1, maximum: 16, default: 4}
        max_model_calls: {type: integer, minimum: 1, maximum: 64, default: 16}
        max_input_tokens: {type: integer, format: int64, minimum: 1024, maximum: 67108864, default: 4194304}
        max_output_tokens: {type: integer, format: int64, minimum: 1024, maximum: 16777216, default: 262144}
        run_seconds: {type: integer, minimum: 1, maximum: 300, default: 120}
        grant_seconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
    TriggerGrant:
      type: object
      nullable: true
      required: [id, project_id, configuration, settings_version, policy, scope_hash, model, provider_origin, created_at, expires_at, run_limits]
      properties:
        id: {type: string}
        project_id: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        policy: {type: string}
        scope_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        model: {type: string}
        provider_origin: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        run_limits: {$ref: '#/components/schemas/AgentLimits'}
    TriggerAttempt:
      type: object
      nullable: true
      required: [id, project_revision, path, source_hash, state, started_at, finished_at, reserved, usage]
      properties:
        id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        source_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [running, completed, failed, interrupted, canceled]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, description: Zero time while running; an uncertain final receipt can remain running without an owner.}
        reserved: {$ref: '#/components/schemas/TriggerAllowance'}
        usage: {$ref: '#/components/schemas/AgentUsage'}
    TriggerRecord:
      type: object
      required: [version, control_revision, project_id, options, grant, window, observed, handled, changed_at, next_eligible_at, last_attempt, state, reason, updated_at]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        control_revision: {type: integer, format: int64, minimum: 0}
        project_id: {type: string}
        options: {$ref: '#/components/schemas/TriggerOptions'}
        grant: {$ref: '#/components/schemas/TriggerGrant'}
        window:
          type: object
          required: [started_at, ends_at, limits, charged]
          description: Fixed allowance and conservative nonrefundable charges. Zero times before the first attempt; controls and restart cannot reset an open window.
          properties:
            started_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            limits: {$ref: '#/components/schemas/TriggerAllowance'}
            charged: {$ref: '#/components/schemas/TriggerAllowance'}
        observed: {type: object, additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}}
        handled: {type: object, additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}}
        changed_at: {type: string, format: date-time}
        next_eligible_at: {type: string, format: date-time}
        last_attempt: {$ref: '#/components/schemas/TriggerAttempt'}
        state: {type: string, enum: [disabled, watching, suggested, waiting, unchanged, running, completed, failed, interrupted, canceled, budget_exhausted, stale, unavailable]}
        reason: {type: string, maxLength: 256}
        updated_at: {type: string, format: date-time}
    AgentTriggers:
      type: object
      required: [project_id, project_revision, configuration, settings_version, policy, model, provider_origin, state, owned, fault, scope_hash, record, ceilings, run_limits, destination]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        policy: {type: string}
        model: {type: string}
        provider_origin: {type: string}
        state: {type: string, enum: [disabled, watch_only, granted, grant_expired, stale_settings, stale_grant, interrupted, failed]}
        owned: {type: boolean}
        fault: {type: boolean}
        scope_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        record: {$ref: '#/components/schemas/TriggerRecord'}
        ceilings: {$ref: '#/components/schemas/TriggerCeilings'}
        run_limits: {$ref: '#/components/schemas/AgentLimits'}
        destination: {$ref: '#/components/schemas/ScopedModel'}
    LiveOpenRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, settings_version, model, provider_origin, confirm_connect, confirm_remote_provider]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        provider_origin: {type: string}
        confirm_connect: {type: boolean, enum: [true]}
        confirm_remote_provider: {type: boolean, description: Must be true for a remote Code profile.}
    LiveControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, settings_version, model, provider_origin, control_revision, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        provider_origin: {type: string}
        control_revision: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [send, interrupt, reconnect, close]}
        text: {type: string, minLength: 1, maxLength: 2048, description: Send only; at most 2048 UTF-8 bytes and exclusive with attachment.}
        attachment: {$ref: '#/components/schemas/AttachmentReference'}
        confirm_connect: {type: boolean, description: Must be true for reconnect.}
        confirm_source_sharing: {type: boolean, description: Must be true for every send.}
        confirm_remote_provider: {type: boolean, description: Must be true for send or reconnect with a remote Code profile.}
    LiveOverview:
      type: object
      required: [project_id, project_revision, configuration, settings_version, model, provider_origin, state, destination, limits, lifetime_seconds, max_connections, max_turns_per_connection, max_input_bytes, max_output_bytes, sessions]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        provider_origin: {type: string}
        state: {type: string, enum: [available, disabled, unsupported_profile, stale_settings]}
        destination: {$ref: '#/components/schemas/ScopedModel'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        lifetime_seconds: {type: integer, enum: [300]}
        max_connections: {type: integer, enum: [2]}
        max_turns_per_connection: {type: integer, enum: [8]}
        max_input_bytes: {type: integer, enum: [131072], description: Per connection payload ceiling; shared budget may reduce it.}
        max_output_bytes: {type: integer, enum: [524288], description: Per connection payload ceiling; shared budget may reduce it.}
        sessions: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/LiveSession'}}
    LiveSession:
      type: object
      description: Source-free local receipt. Partial reported usage is separate from conservative cumulative charges. Private transcript and audio artifacts become available after each connection ends. No resume handles or automatic replay.
      required: [project_id, project_revision, configuration, settings_version, model, provider_origin, id, version, control_revision, policy, state, connections, turns, completed_turns, sent_bytes, received_bytes, reported_input_tokens, reported_output_tokens, usage_reported, usage, run_ids, artifacts, created_at, updated_at, expires_at, owned, stale, can_reconnect, retention_failed, output_artifacts, missing_artifacts]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string}
        settings_version: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        provider_origin: {type: string}
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        control_revision: {type: integer, format: int64, minimum: 1}
        policy: {type: string}
        state: {type: string, enum: [connecting, connected, disconnected, go_away, closed, interrupted, limit_reached, failed]}
        connections: {type: integer, minimum: 1, maximum: 2}
        turns: {type: integer, minimum: 0, maximum: 16, description: Attempted send and interrupt controls.}
        completed_turns: {type: integer, minimum: 0, maximum: 512, description: Provider turn-completion signals; advisory only.}
        sent_bytes: {type: integer, format: int64, minimum: 0, description: Attempted payload bytes including setup.}
        received_bytes: {type: integer, format: int64, minimum: 0}
        reported_input_tokens: {type: integer, format: int64, minimum: 0}
        reported_output_tokens: {type: integer, format: int64, minimum: 0}
        usage_reported: {type: boolean, description: Partial provider observations exist; this is not a final billing receipt.}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        run_ids: {type: array, maxItems: 2, items: {type: string}}
        artifacts: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/AgentArtifactReference'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        owned: {type: boolean}
        stale: {type: boolean}
        can_reconnect: {type: boolean}
        retention_failed: {type: boolean}
        output_artifacts: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/AgentArtifact'}}
        missing_artifacts: {type: integer, minimum: 0, maximum: 4}
    ArtifactList:
      type: object
      required: [project_id, project_revision, snapshot, artifacts]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        artifacts: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentArtifact'}}
        next_cursor: {type: string, maxLength: 2048}
    ArtifactDetail:
      allOf:
        - {$ref: '#/components/schemas/AgentArtifact'}
        - type: object
          required: [preview_kind, truncated]
          properties:
            preview_kind: {type: string, enum: [text, binary, research_report]}
            text: {type: string, description: At most 65536 UTF-8 bytes; omitted for binary and research reports.}
            truncated: {type: boolean}
            report_id: {type: string, description: Open the explicit research report route to preserve citations and Search suggestions.}
    ArtifactControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, version, hash]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [export, delete]}
        version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740992}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ArtifactReceipt:
      type: object
      required: [project_id, project_revision, id, version, hash, state]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 1}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [exported, deleted]}
        path: {type: string, description: Actual private export path; absent for deletion.}
    AgentMemory:
      type: object
      required: [id, version, project_id, project_revision, policy, kind, state, title, text, sources, provenance, created_at, updated_at, expires_at, stale, expired, source_status]
      properties:
        id: {type: string}
        version: {type: integer, format: int64}
        project_id: {type: string}
        project_revision: {type: string}
        policy: {type: string}
        kind: {type: string, enum: [decision, lesson, verified_outcome]}
        state: {type: string, enum: [candidate, accepted]}
        title: {type: string}
        text: {type: string, description: Empty on list; private advisory text on detail and mutation responses.}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MemorySource'}}
        provenance:
          type: object
          required: [origin]
          properties:
            origin: {type: string, enum: [user, proposal_checks, harness_lesson]}
            session_id: {type: string}
            workflow_id: {type: string}
            proposal_hash: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        stale: {type: boolean, description: Revision differs; detail also includes changed source/policy. Revision-only stale advice may remain eligible.}
        expired: {type: boolean}
        source_status: {type: string, enum: [unchecked, current, changed], description: List does not read source; detail checks source and policy. Acceptance alone does not guarantee retrieval eligibility.}
    AgentUsage:
      type: object
      description: Shared budget charges across descendants, including conservative estimates; do not add child totals together. Accounting is absent for legacy measurements that cannot be reconstructed.
      properties:
        accounting: {$ref: '#/components/schemas/AgentUsageAccounting'}
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        unknown_usage_calls: {type: integer}
        reserved_input_tokens: {type: integer, format: int64}
        reserved_output_tokens: {type: integer, format: int64}
        active_calls: {type: integer}
        elapsed_millis: {type: integer, format: int64}
    AgentUsageAccounting:
      type: object
      required: [version, providers]
      properties:
        version: {type: integer, enum: [1]}
        providers: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/AgentProviderUsage'}}
    AgentProviderUsage:
      type: object
      description: Source-free grouped accounting. Reported counts include partial lower bounds; charged minus reported tokens are conservative estimates. Cache tokens are included in input; missing cache knowledge remains unknown. Failed calls can still have complete usage receipts.
      properties:
        model_key: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the JSON pair of configured provider and model; excludes endpoint and credentials.}
        model_calls: {type: integer, minimum: 0}
        active_calls: {type: integer, minimum: 0}
        failed_calls: {type: integer, minimum: 0}
        unknown_usage_calls: {type: integer, minimum: 0}
        reported_calls: {type: integer, minimum: 0}
        partial_usage_calls: {type: integer, minimum: 0}
        cache_known_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, format: int64, minimum: 0}
        output_tokens: {type: integer, format: int64, minimum: 0}
        reported_input_tokens: {type: integer, format: int64, minimum: 0}
        reported_output_tokens: {type: integer, format: int64, minimum: 0}
        cached_input_tokens: {type: integer, format: int64, minimum: 0}
    AgentRoleSettings:
      type: object
      additionalProperties: false
      required: [creation, testing, review]
      properties:
        creation: {type: string, enum: [analyze, bug, code]}
        testing: {type: string, enum: [analyze, bug, code]}
        review: {type: string, enum: [analyze, bug, code]}
    AgentPreferences:
      type: object
      additionalProperties: false
      required: [roles, limits, disabled_skills]
      properties:
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        disabled_skills: {type: array, maxItems: 8, uniqueItems: true, items: {type: string, maxLength: 192}, description: Only explicitly configured directories; empty enables all configured skills.}
    AgentSettings:
      type: object
      required: [project_id, project_revision, configuration, version, state, roles, limits, ceilings, skills, models]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        state: {type: string, enum: [configured, overridden, stale]}
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        ceilings: {$ref: '#/components/schemas/AgentLimits'}
        skills:
          type: array
          maxItems: 8
          items:
            type: object
            required: [directory, enabled]
            properties:
              directory: {type: string, maxLength: 192}
              enabled: {type: boolean}
        models: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/ScopedModel'}}
    AgentSettingsControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, version, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        action: {type: string, enum: [replace, reset]}
        confirm: {type: boolean, enum: [true]}
        values:
          allOf:
            - {$ref: '#/components/schemas/AgentPreferences'}
          description: Required for replace and forbidden for reset; stale saved overrides require reset.
    AgentSkillValidationRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, version, directory]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0}
        directory: {type: string, maxLength: 192}
    AgentSkillFile:
      type: object
      required: [path, hash, size_bytes]
      properties:
        path: {type: string, maxLength: 256}
        hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: integer, minimum: 1, maximum: 8192}
    AgentSkillValidation:
      type: object
      required: [project_id, project_revision, configuration, version, directory, state, inspection]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0}
        directory: {type: string, maxLength: 192}
        state: {type: string, enum: [valid]}
        inspection:
          type: object
          required: [name, description, required_tools, manifest, resources]
          properties:
            name: {type: string}
            description: {type: string, maxLength: 512}
            license: {type: string, maxLength: 256}
            compatibility: {type: string, maxLength: 500}
            required_tools: {type: array, items: {type: string, maxLength: 64}}
            manifest: {$ref: '#/components/schemas/AgentSkillFile'}
            resources: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/AgentSkillFile'}}
    MissionSource:
      type: object
      additionalProperties: false
      required: [path, hash, exists]
      properties:
        path: {type: string, minLength: 1, maxLength: 512, description: Canonical relative file path; no symlinks, exclusions or overlapping file/parent paths.}
        hash: {type: string, description: sha256-prefixed source hash when present; empty when absent.}
        exists: {type: boolean}
    MissionChild:
      type: object
      additionalProperties: false
      required: [id, title, approach, acceptance_criteria, write_paths, limits]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        title: {type: string, minLength: 1, maxLength: 120}
        approach: {type: string, minLength: 1, maxLength: 4096}
        acceptance_criteria: {type: array, minItems: 1, maxItems: 16, items: {type: string, minLength: 1, maxLength: 512}}
        dependencies: {type: array, nullable: true, maxItems: 15, uniqueItems: true, items: {type: string}}
        write_paths: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string}}
        read_paths: {type: array, nullable: true, maxItems: 8, uniqueItems: true, items: {type: string}, description: Distinct from writes; absent paths require an ancestor writer.}
        limits: {$ref: '#/components/schemas/AgentLimits'}
    MissionPlan:
      type: object
      additionalProperties: false
      required: [goal, sources, limits, children, integration_order]
      properties:
        goal: {type: string, minLength: 1, maxLength: 4096}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MissionSource'}}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        children: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/MissionChild'}}
        integration_order: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string}, description: Complete topological order; shared write/read access requires explicit dependency reachability.}
      description: Text bounds are UTF-8 bytes. Child calls, tools, tokens and repairs sum within the mission budget; elapsed time and concurrency are ceilings. Every budget field is explicit, including zero repairs. Captured source is at most 256 KiB total.
    MissionRecord:
      type: object
      required: [id, project_id, project_revision, policy, configuration, instructions, plan, plan_hash, reviewed, approved, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        policy: {type: string}
        configuration: {type: string}
        instructions: {type: object, additionalProperties: {type: string}, description: Captured effective instruction fingerprints keyed by source path.}
        plan: {$ref: '#/components/schemas/MissionPlan'}
        plan_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        reviewed: {type: array, maxItems: 16, uniqueItems: true, items: {type: string}}
        approved: {type: boolean, description: Planning review only; no execution or Apply authority.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentMission:
      type: object
      required: [catalog_revision, mission, stale, source_status]
      properties:
        catalog_revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740992}
        mission: {$ref: '#/components/schemas/MissionRecord'}
        stale: {type: boolean}
        source_status: {type: string, enum: [current, changed, unavailable]}
    MissionBase:
      type: object
      additionalProperties: false
      required: [head, branch]
      properties:
        head: {type: string, pattern: '^([a-f0-9]{40}|[a-f0-9]{64})$'}
        branch: {type: string, minLength: 1, maxLength: 240}
    MissionExecutionChild:
      type: object
      additionalProperties: false
      required: [id, state, limits]
      properties:
        id: {type: string}
        generation: {type: integer, minimum: 0, maximum: 3, description: Zero for the original model proposal; positive values identify provider-free revalidation attempts.}
        state: {type: string, enum: [pending, reserved, running, awaiting_review, rejected, failed, interrupted, integrated]}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        wave_id: {type: string}
        directory: {type: string, description: Owned direct child of the checkout's .worktrees directory.}
        branch: {type: string}
        base_head: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        session_id: {type: string}
        workflow_id: {type: string}
        proposal_hash: {type: string}
        proposal_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 1024}
        updated_at: {type: string, format: date-time}
    MissionWave:
      type: object
      additionalProperties: false
      required: [id, owner, children, started_at, allowance_millis]
      properties:
        id: {type: string}
        owner: {type: string, description: Opaque daemon ownership identity; never an execution grant.}
        children: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string}}
        started_at: {type: string, format: date-time}
        allowance_millis: {type: integer, format: int64, minimum: 1}
    MissionCheckpoint:
      type: object
      additionalProperties: false
      required: [project_revision, base, sources, instructions]
      properties:
        project_revision: {type: string, minLength: 1}
        base: {$ref: '#/components/schemas/MissionBase'}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MissionSource'}}
        instructions: {type: object, additionalProperties: {type: string}}
    MissionProposalEvidence:
      type: object
      additionalProperties: false
      required: [key, version, hash]
      properties:
        key:
          type: object
          additionalProperties: false
          required: [session, name]
          properties:
            session:
              type: object
              additionalProperties: false
              required: [app, user, id]
              properties:
                app: {type: string, enum: [mini-orca-missions]}
                user: {type: string, enum: [local]}
                id: {type: string, description: Exact execution ID.}
            name: {type: string, description: Child ID followed by -proposal.json.}
        version: {type: integer, format: int64, minimum: 1}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    MissionIntegration:
      type: object
      additionalProperties: false
      required: [id, child_id, owner, state, source, session_id, workflow_id, proposal_hash, proposal_revision, evidence, before, cleanup, started_at, updated_at]
      properties:
        id: {type: string}
        child_id: {type: string}
        owner: {type: string, description: Opaque owner with a three-minute recovery lease.}
        state: {type: string, enum: [pending, merged, failed, conflicts, unavailable]}
        source: {$ref: '#/components/schemas/MissionBase'}
        session_id: {type: string}
        workflow_id: {type: string}
        proposal_hash: {type: string}
        proposal_revision: {type: integer, format: int64, minimum: 0}
        evidence: {$ref: '#/components/schemas/MissionProposalEvidence'}
        before: {$ref: '#/components/schemas/MissionCheckpoint'}
        after: {$ref: '#/components/schemas/MissionCheckpoint'}
        failure: {type: string, maxLength: 1024}
        cleanup: {type: string, enum: [retained, pending, worktree_removed, removed, failed]}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MissionIntegrationRequest:
      type: object
      additionalProperties: false
      required: [child_id, session_id, workflow_id, proposal_hash, proposal_revision, path, source]
      properties:
        child_id: {type: string, minLength: 1}
        session_id: {type: string, minLength: 1}
        workflow_id: {type: string, description: Exact original workflow ID, or empty for a revalidated candidate with no current model-review authority.}
        proposal_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        proposal_revision: {type: integer, format: int64, minimum: 0}
        path: {type: string, minLength: 1, description: Canonical registered child worktree path.}
        source: {$ref: '#/components/schemas/MissionBase'}
        integration_id: {type: string, description: Required for reconcile_integration and cleanup_integration; rejected for integrate.}
    MissionRevalidationRequest:
      type: object
      additionalProperties: false
      required: [previous]
      properties:
        previous: {$ref: '#/components/schemas/MissionIntegrationRequest', description: Exact retained draft or applied proposal and old checkout HEAD. integration_id must be absent.}
        revalidation_id: {type: string, description: Required only for reconcile_revalidation; rejected for a new attempt.}
    MissionRevalidation:
      type: object
      additionalProperties: false
      required: [id, owner, state, previous, source, evidence, before, candidate, allowance_millis, started_at, updated_at]
      properties:
        id: {type: string}
        owner: {type: string}
        state: {type: string, enum: [pending, awaiting_review, failed, interrupted]}
        previous: {$ref: '#/components/schemas/MissionExecutionChild'}
        source: {$ref: '#/components/schemas/MissionBase'}
        evidence: {$ref: '#/components/schemas/MissionProposalEvidence'}
        before: {$ref: '#/components/schemas/MissionCheckpoint'}
        candidate: {$ref: '#/components/schemas/MissionExecutionChild'}
        failure: {type: string, maxLength: 1024}
        allowance_millis: {type: integer, format: int64, minimum: 1, description: Reserved from remaining mission elapsed time and capped by the original child's elapsed allowance.}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MissionExecution:
      type: object
      additionalProperties: false
      required: [id, execution_revision, catalog_revision, mission, base, current, state, children, created_at, updated_at]
      properties:
        id: {type: string}
        execution_revision: {type: integer, format: int64, minimum: 1}
        catalog_revision: {type: integer, format: int64, minimum: 1}
        mission: {$ref: '#/components/schemas/MissionRecord'}
        base: {$ref: '#/components/schemas/MissionBase'}
        current: {$ref: '#/components/schemas/MissionCheckpoint'}
        integrations: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/MissionIntegration'}}
        revalidations: {type: array, maxItems: 48, items: {$ref: '#/components/schemas/MissionRevalidation'}}
        state: {type: string, enum: [prepared, running, pausing, canceling, paused, canceled, awaiting_review, blocked, interrupted, integrating, ready, completed, revalidating]}
        elapsed_millis: {type: integer, format: int64, minimum: 0, description: Charged active wave and revalidation time; excludes human review waiting.}
        wave: {$ref: '#/components/schemas/MissionWave'}
        failure: {type: string, maxLength: 1024}
        children: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/MissionExecutionChild'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentMissionExecution:
      type: object
      additionalProperties: false
      required: [execution, stale, source_status, ready_children, owner_state]
      properties:
        execution: {$ref: '#/components/schemas/MissionExecution'}
        stale: {type: boolean}
        source_status: {type: string, enum: [current, changed, unavailable]}
        ready_children: {type: array, maxItems: 16, items: {type: string}}
        owner_state: {type: string, enum: [idle, active, waiting_for_owner, recovery_required]}
        git: {$ref: '#/components/schemas/GitMutationResult'}
    MissionExecutionRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action, plan_hash, confirm]
      description: Prepare requires catalog_revision and base, no execution_id, zero execution_revision and no execution/provider grants. All other actions require execution_id and execution_revision with zero catalog_revision. Start requires confirm_execution, no base and selected remote profile confirmation when applicable. Pause/cancel/reconcile reject base and new grants. Integrate/reconcile_integration/cleanup_integration require destination base, exact integration object and confirm_execution, without provider grants. Revalidate/reconcile_revalidation require the exact revalidation object, current base and confirm_execution, without provider grants. Nested effect objects cannot be mixed or supplied to other actions. The plan hash identifies the immutable approved plan. Unknown and duplicate keys and trailing JSON are rejected.
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        action: {type: string, enum: [prepare, start, pause, cancel, reconcile, integrate, reconcile_integration, cleanup_integration, revalidate, reconcile_revalidation]}
        plan_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        catalog_revision: {type: integer, format: int64, minimum: 0}
        execution_id: {type: string}
        execution_revision: {type: integer, format: int64, minimum: 0}
        base: {$ref: '#/components/schemas/MissionBase'}
        confirm: {type: boolean, enum: [true]}
        confirm_execution: {type: boolean}
        confirmed_profiles: {type: array, maxItems: 3, uniqueItems: true, items: {type: string}}
        integration: {$ref: '#/components/schemas/MissionIntegrationRequest'}
        revalidation: {$ref: '#/components/schemas/MissionRevalidationRequest'}
    MissionChildOrigin:
      type: object
      additionalProperties: false
      required: [mission_id, execution_id, child_id, plan_hash]
      properties:
        mission_id: {type: string}
        execution_id: {type: string}
        child_id: {type: string}
        plan_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        revalidation_id: {type: string, description: Exact retained attempt for a fresh candidate; original model history stays in the previous proposal.}
    MissionList:
      type: object
      required: [project_id, project_revision, catalog_revision, missions]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        catalog_revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        missions:
          type: array
          maxItems: 128
          items:
            type: object
            required: [id, project_revision, goal, plan_hash, child_count, reviewed_count, approved, stale, source_status, updated_at]
            properties:
              id: {type: string}
              project_revision: {type: string}
              goal: {type: string, maxLength: 4096}
              plan_hash: {type: string}
              child_count: {type: integer, minimum: 1, maximum: 16}
              reviewed_count: {type: integer, minimum: 0, maximum: 16}
              approved: {type: boolean}
              stale: {type: boolean, description: Stored revision differs; source freshness remains unchecked in lists.}
              source_status: {type: string, enum: [unchecked]}
              updated_at: {type: string, format: date-time}
    MissionMutation:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, catalog_revision, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        catalog_revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        plan_hash: {type: string, description: Empty for create; exact saved hash for all other actions.}
        action: {type: string, enum: [create, revise, review, approve]}
        child_id: {type: string, description: Required only for review.}
        confirm: {type: boolean, description: Must be true for review and approve.}
        plan: {$ref: '#/components/schemas/MissionPlan'}
    MissionPlanningRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, catalog_revision, goal, sources, limits, planning_limits]
      description: Duplicate keys and trailing JSON are rejected. Both budgets must fit effective operator/project limits. Host-owned goal, inventory and mission budget cannot be replaced by model output.
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        catalog_revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        goal: {type: string, minLength: 1, maxLength: 4096}
        sources: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/MissionSource'}}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        planning_limits: {$ref: '#/components/schemas/MissionPlanningLimits'}
        confirm_remote_provider: {type: boolean, description: Required true when the Code profile requires remote consent.}
    MissionPlanningLimits:
      type: object
      additionalProperties: false
      required: [model_calls, tool_calls, repairs, input_tokens, output_tokens, elapsed_seconds, concurrent_calls]
      description: Independent generation budget shared across provider retries and tool turns; does not spend or authorize future child execution. The Code timeout may shorten the elapsed ceiling.
      properties:
        model_calls: {type: integer, minimum: 1, maximum: 8}
        tool_calls: {type: integer, minimum: 1, maximum: 24}
        repairs: {type: integer, enum: [0]}
        input_tokens: {type: integer, format: int64, minimum: 1, maximum: 1048576}
        output_tokens: {type: integer, format: int64, minimum: 1, maximum: 8388608}
        elapsed_seconds: {type: integer, minimum: 1, maximum: 300}
        concurrent_calls: {type: integer, enum: [1]}
    MissionPlanningResult:
      allOf:
        - {$ref: '#/components/schemas/AgentMission'}
        - type: object
          required: [input_hash, prompt_version, planning_limits, usage, context_manifest]
          properties:
            input_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
            prompt_version: {type: string, enum: [mission-planner-v1]}
            planning_limits: {$ref: '#/components/schemas/MissionPlanningLimits'}
            usage: {$ref: '#/components/schemas/AgentUsage'}
            context_manifest: {$ref: '#/components/schemas/ContextManifest'}
    AgentLimits:
      type: object
      additionalProperties: false
      required: [model_calls, tool_calls, repairs, input_tokens, output_tokens, elapsed_seconds, concurrent_calls]
      properties:
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        elapsed_seconds: {type: integer}
        concurrent_calls: {type: integer}
    AgentCheckpoint:
      type: object
      properties:
        request_id: {type: string}
        node_id: {type: string, enum: [human_review]}
        invocation_id: {type: string}
        expires_at: {type: string, format: date-time}
        decision: {type: string, enum: [approve, reject, cancel, expire]}
        received_at: {type: string, format: date-time}
    AgentRun:
      type: object
      required: [id, root_id, project_id, project_revision, kind, status, active, stale, can_cancel, usage, limits, started_at, updated_at]
      properties:
        change_session_id: {type: string}
        workflow_id: {type: string}
        id: {type: string}
        root_id: {type: string}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        status: {type: string, enum: [running, canceling, waiting_input, completed, failed, canceled, expired, interrupted, changes_requested]}
        active: {type: boolean}
        stale: {type: boolean}
        can_cancel: {type: boolean}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        input: {$ref: '#/components/schemas/AgentCheckpoint'}
    AgentRunList:
      type: object
      required: [project_id, project_revision, runs]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        runs: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentRun'}}
        next_cursor: {type: string}
    AgentArtifactReference:
      type: object
      required: [session, name, version]
      properties:
        session:
          type: object
          required: [app, user, id]
          properties:
            app: {type: string}
            user: {type: string}
            id: {type: string}
        name: {type: string, enum: [completion.json]}
        version: {type: integer, format: int64, minimum: 1}
    AgentRunEvent:
      type: object
      required: [sequence, run_id, invocation_id, project_id, project_revision, kind, state, time, usage]
      properties:
        sequence: {type: integer, minimum: 1}
        run_id: {type: string, description: Root invocation identity.}
        invocation_id: {type: string, description: Native child or root invocation identity.}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        node_id: {type: string}
        request_id: {type: string}
        kind: {type: string, enum: [started, finished, node, input_requested, input_received, input_finished]}
        state: {type: string}
        time: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        evidence: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentArtifactReference'}}
    AgentEventBatch:
      type: object
      required: [project_id, project_revision, epoch, cursor, reset, has_more, events]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        epoch: {type: string}
        cursor: {type: string}
        reset: {type: boolean, description: Replace local state with the current snapshot at this cursor.}
        has_more: {type: boolean}
        events: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        snapshot: {$ref: '#/components/schemas/AgentRunList'}
    AgentRunDetail:
      type: object
      required: [run, invocations, has_more, events, events_truncated]
      properties:
        trace: {$ref: '#/components/schemas/AgentTraceSummary'}
        cost: {$ref: '#/components/schemas/AgentCostEstimate'}
        run: {$ref: '#/components/schemas/AgentRun'}
        invocations: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRun'}}
        has_more: {type: boolean}
        events: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        events_truncated: {type: boolean}
        input: {$ref: '#/components/schemas/ChangeInput'}
        text:
          type: object
          description: Present only with explicit include_text. Private model text is bounded to 64 KiB UTF-8; transient partial buffers cover at most 64 invocations. Tool disclosures contain at most 16 records from the selected invocation's last 128 events. Grounded research returns research_report_required without text so citations and Search suggestions remain together in its report.
          required: [available, state, truncated]
          properties:
            available: {type: boolean}
            state: {type: string, enum: [unavailable, partial_model_output, final_model_output]}
            text: {type: string}
            truncated: {type: boolean}
            artifact: {$ref: '#/components/schemas/AgentArtifactReference'}
            tools_truncated: {type: boolean}
            tool_records:
              type: array
              maxItems: 16
              items:
                type: object
                required: [event_id, name, kind, value, truncated]
                properties:
                  event_id: {type: string}
                  call_id: {type: string, maxLength: 128}
                  name: {type: string, maxLength: 128}
                  kind: {type: string, enum: [arguments, result]}
                  value: {type: string, description: JSON text bounded to 2048 UTF-8 bytes; credential-bearing keys are redacted and nested values are limited to 24 levels. Truncated text need not be valid JSON.}
                  truncated: {type: boolean}
    AgentTraceSummary:
      type: object
      required: [version, trace_id, snapshot, legacy, truncated, incomplete, omitted, spans]
      properties:
        export: {$ref: '#/components/schemas/AgentTraceExportPreview'}
        version: {type: integer, enum: [1]}
        trace_id: {type: string, pattern: '^[a-f0-9]{32}$'}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        legacy: {type: boolean}
        truncated: {type: boolean}
        incomplete: {type: boolean}
        omitted: {type: integer, format: int64, minimum: 0}
        spans: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentTraceSpan'}}
    AgentTraceExportPreview:
      type: object
      required: [enabled, finished, unfinished]
      properties:
        enabled: {type: boolean}
        destination: {type: string, maxLength: 2048}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        finished: {type: integer, minimum: 0, maximum: 256}
        unfinished: {type: integer, minimum: 0, maximum: 256}
        reason: {type: string, enum: [not_configured, no_finished_spans]}
    AgentTraceExportRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, snapshot, destination_fingerprint, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        destination_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm: {type: boolean, enum: [true]}
    AgentTraceExportReceipt:
      type: object
      required: [project_id, project_revision, run_id, snapshot, destination_fingerprint, state, sent]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        run_id: {type: string}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        destination_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [exported, partial, warning, unknown]}
        sent: {type: integer, minimum: 1, maximum: 256, description: Span count in the attempted payload; not proof of delivery}
        accepted: {type: integer, minimum: 0, maximum: 256, description: Absent when acceptance is unknown.}
        rejected: {type: integer, minimum: 0, maximum: 256, description: Absent when rejection is unknown.}
        reason: {type: string, enum: [transport_error, canceled, deadline_exceeded, unexpected_response, invalid_acknowledgement, collector_warning, collector_rejected]}
    AgentTraceSpan:
      type: object
      additionalProperties: false
      required: [id, kind, status, started, elapsed_nanos]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{16}$'}
        parent_id: {type: string, pattern: '^[a-f0-9]{16}$'}
        run_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        operation_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        kind: {type: string, enum: [invocation, node, tool, provider, retry, summary, delegation, check]}
        status: {type: string, enum: [running, completed, failed, canceled, timed_out, interrupted, unfinished]}
        started: {type: string, format: date-time}
        ended: {type: string, format: date-time}
        elapsed_nanos: {type: integer, format: int64, minimum: 0}
    AgentCostEstimate:
      type: object
      required: [status, known_subtotal, reasons]
      properties:
        status: {type: string, enum: [estimated, unknown]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        price_version: {type: string, maxLength: 64}
        known_subtotal: {type: number, minimum: 0}
        total: {type: number, minimum: 0, description: Present only when the token cost can be estimated completely with configured rates; not an invoice.}
        reasons:
          type: array
          uniqueItems: true
          items: {type: string, enum: [price_table_unavailable, legacy_usage, model_rate_unavailable, usage_incomplete, cache_split_unknown]}
    AgentRunControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [cancel]}
    Error:
      type: object
      required: [type, message, user_message]
      properties:
        type: {type: string}
        message: {type: string}
        user_message: {type: string}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: shared_proposals}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: ["", analyze, bug, code], description: Empty for unassigned catalog choices.}
        profile: {$ref: '#/components/schemas/ModelSelection'}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured reasoning effort supported by the selected provider.}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean, description: CLI providers always require confirmation because their downstream destination is not independently verified.}
        temperature: {type: number, nullable: true, description: Null for CLI providers without sampling controls.}
        max_tokens: {type: integer, nullable: true, description: Null for CLI providers without output-token controls.}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
    ModelCapabilities:
      type: object
      description: Implemented adapter protocols, not model entitlements. Older metadata may omit this object; missing capabilities are unavailable.
      required: [completion, json_schema, tools, streaming, attachments, grounding, live_sessions]
      properties:
        completion: {type: boolean}
        json_schema: {type: boolean}
        tools: {type: boolean}
        streaming: {type: boolean}
        attachments: {type: boolean}
        grounding: {type: boolean}
        live_sessions: {type: boolean}
    ModelSelection:
      type: string
      minLength: 1
      maxLength: 644
      pattern: '^(analyze|bug|code|configured:[0-9a-fA-F]{64}|pi:[^/]+/.+|agy:[a-zA-Z0-9][a-zA-Z0-9._-]{0,511})$'
      description: Opaque ID returned by the available model catalog. Legacy analyze, bug and code profile names remain supported. Catalog membership is rechecked before admission; endpoints, executable paths and credentials cannot be supplied.
    AvailableModels:
      type: object
      required: [models, defaults, pi, agy]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelChoice'}
        defaults:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/ModelSelection'}
            bug: {$ref: '#/components/schemas/ModelSelection'}
            code: {$ref: '#/components/schemas/ModelSelection'}
        pi:
          $ref: '#/components/schemas/ModelDiscovery'
        agy:
          $ref: '#/components/schemas/ModelDiscovery'
    ModelDiscovery:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        message: {type: string, description: Sanitized discovery failure and recovery guidance.}
    ModelChoice:
      type: object
      required: [id, name, provider, source, location, model]
      properties:
        id: {$ref: '#/components/schemas/ModelSelection'}
        name: {type: string}
        provider: {type: string, description: Transport provider for configured or Agy models; Pi provider ID for Pi models.}
        source: {type: string, enum: [configured, pi, agy]}
        location: {type: string, enum: [local, remote, unknown], description: Pi location is inferred from catalog baseUrl metadata; Agy location is unknown because its catalog omits endpoints. It does not waive CLI prompt consent or verify availability of the endpoint.}
        model: {$ref: '#/components/schemas/ScopedModel'}
    ModelCatalog:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/ScopedModel'}
            bug: {$ref: '#/components/schemas/ScopedModel'}
            code: {$ref: '#/components/schemas/ScopedModel'}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: Required before prompt content is sent to a non-loopback provider.}
    ProjectRestoreRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path of a previously imported local project.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        summary: {type: string}
        ai_status: {type: string}
        report: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analyzed_at: {type: string, format: date-time}
    ProjectOverview:
      type: object
      required: [project_id, project_revision, metrics, analysis, analysis_coverage, finding_counts]
      properties:
        analysis_run: {$ref: '#/components/schemas/AnalysisRun'}
        project_id: {type: string}
        project_revision: {type: string}
        metrics: {$ref: '#/components/schemas/ProjectMetrics'}
        analysis: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        docs: {$ref: '#/components/schemas/ProjectDocsReport'}
        analysis_coverage: {$ref: '#/components/schemas/AnalysisCoverage'}
        finding_counts: {$ref: '#/components/schemas/FindingCounts'}
    ProjectDocsReport:
      type: object
      description: "Derived handbook composition. Version 2 anchors component paths and imports to inventory and labels model interpretations as advisory; missing scenario steps or guarantees are not synthesized. Legacy derived handbooks are rebuilt passively from retained reports and indexes."
      required: [schema_version, project_id, project_revision, status, context, components, scenarios, decisions, runbook, glossary]
      properties:
        schema_version: {type: string, enum: ['2']}
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string}
        context:
          type: object
          required: [purpose, topology, stack]
          properties:
            purpose: {type: string}
            topology: {type: string}
            stack: {type: array, items: {type: string}}
            architecture_diagram: {type: string}
        components: {type: array, items: {type: object}}
        scenarios: {type: array, items: {type: object}}
        decisions: {type: array, items: {type: object}}
        runbook: {type: array, items: {type: object}}
        glossary: {type: array, items: {type: object}}
        updated_at: {type: string}
    ProjectMetrics:
      type: object
      required: [type, file_count, source_file_count, total_lines, languages]
      properties:
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
    ProjectAnalysisReport:
      type: object
      required: [schema_version, project_id, project_revision, components, entry_points, flows, risks, next_steps, status, model, profile, prompt_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        purpose: {type: string}
        architecture: {type: string, description: "Advisory Mermaid flowchart for new reports; older reports may contain prose."}
        components: {type: array, items: {type: string}}
        entry_points: {type: array, items: {type: string}}
        flows: {type: array, description: "Advisory Mermaid flowcharts or sequence diagrams for new reports; older items may contain prose.", items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        next_steps: {type: array, items: {type: string}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, stale, failed, unavailable]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalysisCoverage:
      type: object
      required: [total, fresh, stale, missing, failed, running, partial, unavailable]
      properties:
        total: {type: integer}
        fresh: {type: integer}
        stale: {type: integer}
        missing: {type: integer}
        failed: {type: integer}
        running: {type: integer}
        partial: {type: integer}
        unavailable: {type: integer}
    FindingCounts:
      type: object
      required: [verified, ai_suggestions]
      properties:
        verified: {type: integer, description: Count with non-AI source and tool_reported confidence.}
        ai_suggestions: {type: integer, description: Count with AI source and suggested confidence.}
    FindingsResponse:
      type: object
      required: [project_id, project_revision, findings]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/UnifiedFinding'}}
        completed: {type: array, description: "Merged finding targets for this project, independent of finding filters and evidence freshness.", items: {$ref: '#/components/schemas/FindingCompletion'}}
    FindingTarget:
      type: object
      additionalProperties: false
      required: [project_id, kind, id, path]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 1024, description: "Original finding project identity, retained when preparing in a worktree."}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string, minLength: 1, maxLength: 1024}
        path: {type: string, minLength: 1, maxLength: 1024, description: Project-relative finding path within the captured change paths.}
        source: {type: string, enum: [ai, deterministic], description: Required only for security findings; omitted for other producers.}
    FindingCompletion:
      type: object
      required: [project_id, kind, id, path, commit_oid]
      properties:
        project_id: {type: string}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string}
        path: {type: string}
        source: {type: string, enum: [ai, deterministic]}
        commit_oid: {type: string, description: Committed fix verified as an ancestor of the reviewed merged head.}
    UnifiedFinding:
      type: object
      required: [id, source, confidence, severity, title, message, project_id, project_revision, location, status, freshness, detected_at]
      properties:
        id: {type: string}
        category: {$ref: '#/components/schemas/FindingCategory'}
        source: {type: string, enum: [ai, parser, vet, test]}
        confidence: {type: string, enum: [suggested, tool_reported]}
        severity: {type: string, enum: [low, medium, high]}
        title: {type: string}
        message: {type: string}
        rule: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        file_hash: {type: string}
        location: {$ref: '#/components/schemas/FindingLocation'}
        evidence: {type: string, description: Sanitized and bounded tool or model evidence.}
        status: {type: string, enum: [open, dismissed, fixed, retired]}
        freshness: {type: string, enum: [fresh, stale]}
        detected_at: {type: string, format: date-time}
        originating_analysis: {type: string, enum: [project, file]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    EngineeringInsight:
      type: object
      required: [mechanism, why_it_matters_here]
      description: Optional AI interpretation attached to its parent result; it carries no navigation or mutation authority.
      properties:
        mechanism: {type: string, maxLength: 1000}
        why_it_matters_here: {type: string, maxLength: 1000}
        tradeoff_or_failure_mode: {type: string, maxLength: 1000}
        transferable_lesson: {type: string, maxLength: 1000}
    FindingLocation:
      type: object
      properties:
        path: {type: string, description: Project-relative path.}
        start_line: {type: integer}
        end_line: {type: integer}
    FindingTriageRequest:
      type: object
      required: [project_revision, status]
      properties:
        project_revision: {type: string}
        status: {type: string, enum: [open, dismissed, fixed]}
    GoScanRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
    GoScanReport:
      type: object
      required: [project_id, project_revision, status, started_at, updated_at, phases]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, enum: [running, completed, canceled, failed]}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        phases: {type: array, items: {$ref: '#/components/schemas/GoScanPhase'}}
    ExecutionTrustRequest:
      type: object
      required: [project_revision, confirm]
      properties:
        project_revision: {type: string}
        confirm: {type: boolean, description: Must be true after the client shows the command scope.}
    ExecutionTrust:
      type: object
      required: [project_id, project_revision, trusted, commands]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        trusted: {type: boolean, description: Remembered consent for this canonical project path, validated against the current revision and workspace. Revoked consent remains revoked after restart.}
        commands:
          type: array
          description: Exact argv vectors for this requested scan or task-test action; gofmt and go vet are source-only and omitted.
          items: {type: array, items: {type: string}}
    GoScanPhase:
      type: object
      required: [name, state]
      properties:
        name: {type: string, enum: [workspace, parse, vet, tests]}
        state: {type: string, enum: [passed, failed, canceled]}
        command: {type: array, items: {type: string}}
        output: {type: string, description: Sanitized and bounded output.}
        exit_code: {type: integer}
    FileInfo:
      type: object
      properties:
        path: {type: string}
        content_hash: {type: string, description: Hash required with a mutable request.}
        name: {type: string}
        extension: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        content: {type: string}
    ProjectIndex:
      type: object
      required: [schema_version, project_id, project_revision, generated_at, files]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        generated_at: {type: string, format: date-time}
