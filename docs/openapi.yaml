        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Analyze exactly one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysisRequest'}}}
      responses:
        '200': {description: Fresh or failed source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/security-scan:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Scan exactly one eligible Go file with deterministic source-only security rules
      description: Applies the current Go ruleset without provider access or subprocess execution. A rule match requires syntactic review and is not proof of exploitability.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityScanRequest'}}}
      responses:
        '200': {description: Source-free deterministic Security report; partial reports retain the first five source-order matches and state that coverage limit, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/explanation:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Explain one exact indexed Go declaration without creating workflow state
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanationRequest'}}}
      responses:
        '200': {description: Transient bounded explanation with source anchors and Function-context provenance, content: {application/json: {schema: {$ref: '#/components/schemas/DeclarationExplanation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/security-review:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Security]
      summary: Perform one explicit passive AI security review of one selected file
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecurityReviewRequest'}}}
      responses:
        '200': {description: Source-free advisory report; completed_empty does not mean the file is secure, content: {application/json: {schema: {$ref: '#/components/schemas/SecurityFileReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/context:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Preview bounded model context
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Paths, hashes, exclusion reasons, token estimate, and truncation state; source text is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextManifest'}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    AgentProjectID:
      in: query
      name: project_id
      required: true
      schema: {type: string}
    AgentRunID:
      in: path
      name: runID
      required: true
      schema: {type: string}
    WorktreePath:
      in: query
      name: worktree_path
      required: false
      description: Optional absolute path of another registered worktree in the active repository. Requests use that checkout's project identity, jobs, trust and proposal guards without changing the active project. Membership is rechecked on every request.
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    IntegrationUse:
      type: object
      description: Ephemeral consent for one admitted investigation or explanation. A saved plan, discovered inventory, incoming principal grant or remote-agent connection does not inherit this source-sharing authority.
      additionalProperties: false
      required: [id, grant, schema_fingerprint, confirm_source_sharing]
      properties:
        id: {type: string, maxLength: 24}
        grant: {type: string, description: Current in-memory discovery grant; invalidated by revoke, reindex, replacement or restart.}
        schema_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm_source_sharing: {type: boolean, enum: [true], description: Approve this investigation's admitted prompt, source, skill and memory context reaching this server.}
    AgentUsage:
      type: object
      description: Shared budget charges across descendants, including conservative estimates; do not add child totals together. Accounting is absent for legacy measurements that cannot be reconstructed.
      properties:
        accounting: {$ref: '#/components/schemas/AgentUsageAccounting'}
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        unknown_usage_calls: {type: integer}
        reserved_input_tokens: {type: integer, format: int64}
        reserved_output_tokens: {type: integer, format: int64}
        active_calls: {type: integer}
        elapsed_millis: {type: integer, format: int64}
    AgentUsageAccounting:
      type: object
      required: [version, providers]
      properties:
        version: {type: integer, enum: [1]}
        providers: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/AgentProviderUsage'}}
    AgentProviderUsage:
      type: object
      description: Source-free grouped accounting. Reported counts include partial lower bounds; charged minus reported tokens are conservative estimates. Cache tokens are included in input; missing cache knowledge remains unknown. Failed calls can still have complete usage receipts.
      properties:
        model_key: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the JSON pair of configured provider and model; excludes endpoint and credentials.}
        model_calls: {type: integer, minimum: 0}
        active_calls: {type: integer, minimum: 0}
        failed_calls: {type: integer, minimum: 0}
        unknown_usage_calls: {type: integer, minimum: 0}
        reported_calls: {type: integer, minimum: 0}
        partial_usage_calls: {type: integer, minimum: 0}
        cache_known_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, format: int64, minimum: 0}
        output_tokens: {type: integer, format: int64, minimum: 0}
        reported_input_tokens: {type: integer, format: int64, minimum: 0}
        reported_output_tokens: {type: integer, format: int64, minimum: 0}
        cached_input_tokens: {type: integer, format: int64, minimum: 0}
    AgentRoleSettings:
      type: object
      additionalProperties: false
      required: [creation, testing, review]
      properties:
        creation: {type: string, enum: [analyze, bug, code]}
        testing: {type: string, enum: [analyze, bug, code]}
        review: {type: string, enum: [analyze, bug, code]}
    AgentPreferences:
      type: object
      additionalProperties: false
      required: [roles, limits, disabled_skills]
      properties:
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        disabled_skills: {type: array, maxItems: 8, uniqueItems: true, items: {type: string, maxLength: 192}, description: Only explicitly configured directories; empty enables all configured skills.}
    AgentSettings:
      type: object
      required: [project_id, project_revision, configuration, version, state, roles, limits, ceilings, skills, models]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        state: {type: string, enum: [configured, overridden, stale]}
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        ceilings: {$ref: '#/components/schemas/AgentLimits'}
        skills:
          type: array
          maxItems: 8
          items:
            type: object
            required: [directory, enabled]
            properties:
              directory: {type: string, maxLength: 192}
              enabled: {type: boolean}
        models: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/ScopedModel'}}
    AgentSettingsControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, version, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        action: {type: string, enum: [replace, reset]}
        confirm: {type: boolean, enum: [true]}
        values:
          allOf:
            - {$ref: '#/components/schemas/AgentPreferences'}
          description: Required for replace and forbidden for reset; stale saved overrides require reset.
    AgentSkillValidationRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, version, directory]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0}
        directory: {type: string, maxLength: 192}
    AgentSkillFile:
      type: object
      required: [path, hash, size_bytes]
      properties:
        path: {type: string, maxLength: 256}
        hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: integer, minimum: 1, maximum: 8192}
    AgentSkillValidation:
      type: object
      required: [project_id, project_revision, configuration, version, directory, state, inspection]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0}
        directory: {type: string, maxLength: 192}
        state: {type: string, enum: [valid]}
        inspection:
          type: object
          required: [name, description, required_tools, manifest, resources]
          properties:
            name: {type: string}
            description: {type: string, maxLength: 512}
            license: {type: string, maxLength: 256}
            compatibility: {type: string, maxLength: 500}
            required_tools: {type: array, items: {type: string, maxLength: 64}}
            manifest: {$ref: '#/components/schemas/AgentSkillFile'}
            resources: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/AgentSkillFile'}}
    AgentLimits:
      type: object
      additionalProperties: false
      required: [model_calls, tool_calls, repairs, input_tokens, output_tokens, elapsed_seconds, concurrent_calls]
      properties:
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        elapsed_seconds: {type: integer}
        concurrent_calls: {type: integer}
    AgentCheckpoint:
      type: object
      properties:
        request_id: {type: string}
        node_id: {type: string, enum: [human_review]}
        invocation_id: {type: string}
        expires_at: {type: string, format: date-time}
        decision: {type: string, enum: [approve, reject, cancel, expire]}
        received_at: {type: string, format: date-time}
    AgentRun:
      type: object
      required: [id, root_id, project_id, project_revision, kind, status, active, stale, can_cancel, usage, limits, started_at, updated_at]
      properties:
        change_session_id: {type: string}
        workflow_id: {type: string}
        id: {type: string}
        root_id: {type: string}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        status: {type: string, enum: [running, canceling, waiting_input, completed, failed, canceled, expired, interrupted, changes_requested]}
        active: {type: boolean}
        stale: {type: boolean}
        can_cancel: {type: boolean}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        input: {$ref: '#/components/schemas/AgentCheckpoint'}
    AgentRunList:
      type: object
      required: [project_id, project_revision, runs]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        runs: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentRun'}}
        next_cursor: {type: string}
    AgentArtifactReference:
      type: object
      required: [session, name, version]
      properties:
        session:
          type: object
          required: [app, user, id]
          properties:
            app: {type: string}
            user: {type: string}
            id: {type: string}
        name: {type: string, enum: [completion.json]}
        version: {type: integer, format: int64, minimum: 1}
    AgentRunEvent:
      type: object
      required: [sequence, run_id, invocation_id, project_id, project_revision, kind, state, time, usage]
      properties:
        sequence: {type: integer, minimum: 1}
        run_id: {type: string, description: Root invocation identity.}
        invocation_id: {type: string, description: Native child or root invocation identity.}
        parent_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        node_id: {type: string}
        request_id: {type: string}
        kind: {type: string, enum: [started, finished, node, input_requested, input_received, input_finished]}
        state: {type: string}
        time: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        evidence: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentArtifactReference'}}
    AgentEventBatch:
      type: object
      required: [project_id, project_revision, epoch, cursor, reset, has_more, events]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        epoch: {type: string}
        cursor: {type: string}
        reset: {type: boolean, description: Replace local state with the current snapshot at this cursor.}
        has_more: {type: boolean}
        events: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        snapshot: {$ref: '#/components/schemas/AgentRunList'}
    AgentRunDetail:
      type: object
      required: [run, invocations, has_more, events, events_truncated]
      properties:
        trace: {$ref: '#/components/schemas/AgentTraceSummary'}
        cost: {$ref: '#/components/schemas/AgentCostEstimate'}
        run: {$ref: '#/components/schemas/AgentRun'}
        invocations: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRun'}}
        has_more: {type: boolean}
        events: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentRunEvent'}}
        events_truncated: {type: boolean}
        input: {$ref: '#/components/schemas/ChangeInput'}
        text:
          type: object
          description: Present only with explicit include_text. Private model text is bounded to 64 KiB UTF-8; transient partial buffers cover at most 64 invocations. Tool disclosures contain at most 16 records from the selected invocation's last 128 events. Grounded research returns research_report_required without text so citations and Search suggestions remain together in its report.
          required: [available, state, truncated]
          properties:
            available: {type: boolean}
            state: {type: string, enum: [unavailable, partial_model_output, final_model_output]}
            text: {type: string}
            truncated: {type: boolean}
            artifact: {$ref: '#/components/schemas/AgentArtifactReference'}
            tools_truncated: {type: boolean}
            tool_records:
              type: array
              maxItems: 16
              items:
                type: object
                required: [event_id, name, kind, value, truncated]
                properties:
                  event_id: {type: string}
                  call_id: {type: string, maxLength: 128}
                  name: {type: string, maxLength: 128}
                  kind: {type: string, enum: [arguments, result]}
                  value: {type: string, description: JSON text bounded to 2048 UTF-8 bytes; credential-bearing keys are redacted and nested values are limited to 24 levels. Truncated text need not be valid JSON.}
                  truncated: {type: boolean}
    AgentTraceSummary:
      type: object
      required: [version, trace_id, snapshot, legacy, truncated, incomplete, omitted, spans]
      properties:
        export: {$ref: '#/components/schemas/AgentTraceExportPreview'}
        version: {type: integer, enum: [1]}
        trace_id: {type: string, pattern: '^[a-f0-9]{32}$'}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        legacy: {type: boolean}
        truncated: {type: boolean}
        incomplete: {type: boolean}
        omitted: {type: integer, format: int64, minimum: 0}
        spans: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/AgentTraceSpan'}}
    AgentTraceExportPreview:
      type: object
      required: [enabled, finished, unfinished]
      properties:
        enabled: {type: boolean}
        destination: {type: string, maxLength: 2048}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        finished: {type: integer, minimum: 0, maximum: 256}
        unfinished: {type: integer, minimum: 0, maximum: 256}
        reason: {type: string, enum: [not_configured, no_finished_spans]}
    AgentTraceExportRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, snapshot, destination_fingerprint, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        destination_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        confirm: {type: boolean, enum: [true]}
    AgentTraceExportReceipt:
      type: object
      required: [project_id, project_revision, run_id, snapshot, destination_fingerprint, state, sent]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        run_id: {type: string}
        snapshot: {type: string, pattern: '^[a-f0-9]{64}$'}
        destination_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [exported, partial, warning, unknown]}
        sent: {type: integer, minimum: 1, maximum: 256, description: Span count in the attempted payload; not proof of delivery}
        accepted: {type: integer, minimum: 0, maximum: 256, description: Absent when acceptance is unknown.}
        rejected: {type: integer, minimum: 0, maximum: 256, description: Absent when rejection is unknown.}
        reason: {type: string, enum: [transport_error, canceled, deadline_exceeded, unexpected_response, invalid_acknowledgement, collector_warning, collector_rejected]}
    AgentTraceSpan:
      type: object
      additionalProperties: false
      required: [id, kind, status, started, elapsed_nanos]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{16}$'}
        parent_id: {type: string, pattern: '^[a-f0-9]{16}$'}
        run_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        operation_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        kind: {type: string, enum: [invocation, node, tool, provider, retry, summary, delegation, check]}
        status: {type: string, enum: [running, completed, failed, canceled, timed_out, interrupted, unfinished]}
        started: {type: string, format: date-time}
        ended: {type: string, format: date-time}
        elapsed_nanos: {type: integer, format: int64, minimum: 0}
    AgentCostEstimate:
      type: object
      required: [status, known_subtotal, reasons]
      properties:
        status: {type: string, enum: [estimated, unknown]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        price_version: {type: string, maxLength: 64}
        known_subtotal: {type: number, minimum: 0}
        total: {type: number, minimum: 0, description: Present only when the token cost can be estimated completely with configured rates; not an invoice.}
        reasons:
          type: array
          uniqueItems: true
          items: {type: string, enum: [price_table_unavailable, legacy_usage, model_rate_unavailable, usage_incomplete, cache_split_unknown]}
    AgentRunControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, action]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        action: {type: string, enum: [cancel]}
    Error:
      type: object
      required: [type, message, user_message]
      properties:
        type: {type: string}
        message: {type: string}
        user_message: {type: string}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: shared_proposals}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: ["", analyze, bug, code], description: Empty for unassigned catalog choices.}
        profile: {$ref: '#/components/schemas/ModelSelection'}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured reasoning effort supported by the selected provider.}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean, description: CLI providers always require confirmation because their downstream destination is not independently verified.}
        temperature: {type: number, nullable: true, description: Null for CLI providers without sampling controls.}
        max_tokens: {type: integer, nullable: true, description: Null for CLI providers without output-token controls.}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
    ModelCapabilities:
      type: object
      description: Implemented adapter protocols, not model entitlements. Older metadata may omit this object; missing capabilities are unavailable.
      required: [completion, json_schema, tools, streaming]
      properties:
        completion: {type: boolean}
        json_schema: {type: boolean}
        tools: {type: boolean}
        streaming: {type: boolean}
    ModelSelection:
      type: string
      minLength: 1
      maxLength: 644
      pattern: '^(analyze|bug|code|configured:[0-9a-fA-F]{64}|pi:[^/]+/.+|agy:[a-zA-Z0-9][a-zA-Z0-9._-]{0,511})$'
      description: Opaque ID returned by the available model catalog. Legacy analyze, bug and code profile names remain supported. Catalog membership is rechecked before admission; endpoints, executable paths and credentials cannot be supplied.
    AvailableModels:
      type: object
      required: [models, defaults, pi, agy]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelChoice'}
        defaults:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/ModelSelection'}
            bug: {$ref: '#/components/schemas/ModelSelection'}
            code: {$ref: '#/components/schemas/ModelSelection'}
        pi:
          $ref: '#/components/schemas/ModelDiscovery'
        agy:
          $ref: '#/components/schemas/ModelDiscovery'
    ModelDiscovery:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        message: {type: string, description: Sanitized discovery failure and recovery guidance.}
    ModelChoice:
      type: object
      required: [id, name, provider, source, location, model]
      properties:
        id: {$ref: '#/components/schemas/ModelSelection'}
        name: {type: string}
        provider: {type: string, description: Transport provider for configured or Agy models; Pi provider ID for Pi models.}
        source: {type: string, enum: [configured, pi, agy]}
