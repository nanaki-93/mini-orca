        base_file_hash: {type: string}
        anchor: {$ref: '#/components/schemas/DeclarationSourceAnchor'}
        summary: {type: string}
        behavior: {type: array, maxItems: 6, items: {type: string}}
        inputs: {type: array, maxItems: 6, items: {type: string}}
        outputs: {type: array, maxItems: 6, items: {type: string}}
        side_effects: {type: array, maxItems: 6, items: {type: string}}
        error_behavior: {type: array, maxItems: 6, items: {type: string}}
