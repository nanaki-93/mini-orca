# Mini-Orca Configuration Example
# Version: 4.1.0
# This file demonstrates all available configuration options.

# ─── LLM ──────────────────────────────────────────────────────────────────────
# Configure the single LLM endpoint used by all agents.

llm:
  base_url: "http://localhost:1234"
  api_key: ""            # Only required for remote providers (OpenAI, etc.)
  model: ""              # Optional: specify a model name
  temperature: 0.7       # Default temperature for all phases
  max_tokens: 8192       # Default max tokens for all phases

# ─── Agents ───────────────────────────────────────────────────────────────────
# Configure the orchestrator agents with their skills and optional model overrides.

agents:
  coder:
    skills:
      - code_generation
      - refactoring
      - debugging
    model: ""  # Optional: override the default model for this agent
    timeout_seconds: 300 # Optional request timeout for this profile

  tester:
    skills:
      - test_generation
      - edge_case_detection
      - validation
    model: ""  # Optional: override the default model for this agent

  reviewer:
    skills:
      - code_review
      - security_check
      - best_practices
    model: ""  # Optional: override the default model for this agent

# ─── Skills ───────────────────────────────────────────────────────────────────
# Define available skills (knowledge base) and tools.

skills:
  knowledge:
    code_generation: "Generate clean, well-documented code"
    refactoring: "Refactor code for clarity and maintainability"
    debugging: "Debug and fix issues in code"
    test_generation: "Generate comprehensive unit and integration tests"
    edge_case_detection: "Identify and handle edge cases"
    validation: "Validate code against requirements and standards"
    code_review: "Review code for quality and correctness"
    security_check: "Identify potential security vulnerabilities"
    best_practices: "Enforce coding best practices and patterns"

  tools:
    formatter: "Format code according to project standards"
    linter: "Lint code for style and correctness"
    test_runner: "Execute test suites"

# ─── Project ──────────────────────────────────────────────────────────────────
# Path of the project to work with.

project_path: "."         # Default to current directory if empty

# ─── Retry ────────────────────────────────────────────────────────────────────
# Configure retry behavior for failed operations.

retry:
  max_retries: 3
  backoff_base: 1000   # ms - base delay for exponential backoff
  backoff_max: 30000   # ms - maximum delay between retries

# ─── Operation timeouts ──────────────────────────────────────────────────────
# These deadlines bound work started by one desktop request. They are separate
# from the daemon's HTTP server timeouts.
timeouts:
  import_seconds: 300
  analysis_seconds: 300
  generation_seconds: 300
  focused_check_seconds: 60

# ─── Logging ──────────────────────────────────────────────────────────────────
# Configure structured logging.

logging:
  level: "info"         # debug, info, warn, error
  format: "json"        # json or text
  filename: ""          # Optional: path to log file (default: stdout)
  sensitive_keys:       # Optional: list of keys to redact from logs
    - "password"
    - "secret"
    - "api_key"
    - "token"
    - "authorization"
