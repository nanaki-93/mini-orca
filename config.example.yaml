# Copy this file to ignored config.yaml and replace each placeholder model ID.
# Mini-Orca accepts only this strict YAML schema; it does not read environment
# variables into profile values or support legacy llm/agents/skills sections.
# Each scope defaults to provider: openai. For provider: agy or provider: pi,
# keep model/context_max_tokens/reasoning_effort, remove API and sampling fields,
# and optionally set cli_path to an absolute executable path. See CONFIG.md.
# Native Google scopes use provider: gemini with an explicit api_key, or
# provider: vertex with an Express api_key OR access_token + vertex_project +
# vertex_location. Native endpoints default to Google's APIs; ambient credentials
# are never used. See CONFIG.md for full examples and supported settings.

model_scopes:
  # Project import, architectural summaries, and explicit source-based Performance reviews.
  analyze:
    api_base_url: "http://localhost:1234/v1"
    api_key: "" # Empty keys are valid for local OpenAI-compatible servers.
    model: "replace-with-analysis-model-id"
    temperature: 0.1
    max_tokens: 16000
    context_max_tokens: 120000

  # Selected-file analysis and Analyze-all suggestions.
  bug:
    api_base_url: "http://localhost:1234/v1"
    api_key: ""
    model: "replace-with-bug-model-id"
    temperature: 0.1
    max_tokens: 12000
    context_max_tokens: 32000

  # Declaration proposals and explicit repairs.
  function:
    api_base_url: "http://localhost:1234/v1"
    api_key: ""
    model: "replace-with-function-model-id"
    temperature: 0.2
    max_tokens: 4096
    context_max_tokens: 4000
    # reasoning_effort: "high" # Optional: none, minimal, low, medium, high, xhigh, max.

project_path: "."

# Passive configuration. Discovery and each investigation require explicit grants.
integrations:
  a2a_server:
    enabled: false
    bind: "127.0.0.1:9091"
    timeout_seconds: 60
    max_concurrent: 2
    principals: []
    # - id: reviewer
    #   bearer_token_env: MINI_ORCA_AGENT_TOKEN
    #   project_id: "replace-with-current-project-id"
    #   capabilities: [analysis, proposal]
  mcp: []
  # - id: docs
  #   transport: streamable_http
  #   endpoint: https://docs.example/mcp
  #   bearer_token_env: DOCS_MCP_TOKEN
  #   timeout_seconds: 30
  #   tools: [{name: search, effect: read_external}]
  # Stdio alternative: transport: stdio, command: /absolute/installed/docs-mcp,
  # args: [--stdio], environment: {DOCS_TOKEN: PRIVATE_DOCS_TOKEN}.
  # Arguments must not contain secrets; environment values name credential variables.
  openapi: []
  # - id: tickets
  #   spec_path: integrations/tickets.json # Indexed project-local OpenAPI 3.0 JSON.
  #   endpoint: https://tickets.example/api
  #   bearer_token_env: TICKETS_TOKEN
  #   timeout_seconds: 30
  #   operations: [{name: getTicket, effect: read_external}, {name: updateTicket, effect: mutate_external}]
  google_search: false # Requires a supported native Google Function profile and explicit per-request consent.
  a2a: []
  # - id: reviewer
  #   card_url: https://review.example/.well-known/agent-card.json
  #   endpoint: https://review.example/rpc # Exact same origin as the card.
  #   bearer_token_env: REVIEW_AGENT_TOKEN
  #   skills: [code_review] # One to four explicitly allowed advertised skills.
  #   timeout_seconds: 30 # A2A 1.0 JSON-RPC; plain-text advisory results only.

agent_runtime:
  # Explicit project-relative directories containing indexed SKILL.md files.
  # Example: [project-skills/review-code]. Resources load only during admitted investigations.
  skills: []
  roles:
    creation: bug
    testing: function
    review: analyze
  max_model_calls: 1024
  max_tool_calls: 4096
  max_input_tokens: 134217728
  max_output_tokens: 67108864
  max_elapsed_seconds: 86400
  max_concurrent_calls: 4
  max_repairs: 2 # Zero disables automatic repairs even when requested.
  context:
    compaction: false # Optional paid summarization within the same admitted budget.
    token_threshold: 8000
    retain_events: 4
    summary_max_tokens: 1024
    local_cache: false # Reuse source-bound composition in private checkout metadata.
    cache_ttl_seconds: 600
    provider_cache: false # Explicit remote retention; compatible Google profiles only.
    provider_ttl_seconds: 0 # Set 60-3600 explicitly before enabling provider_cache.

retry:
  max_retries: 3
  backoff_base: 1000 # milliseconds
  backoff_max: 30000 # milliseconds

timeouts:
  import_seconds: 300
  analysis_seconds: 300
  generation_seconds: 300
  workflow_model_seconds: 900 # Each Creation, Testing and Review model call, including retries.
  focused_check_seconds: 60

logging:
  level: "info"
  format: "json"
  filename: ""
  sensitive_keys:
    - "password"
    - "secret"
    - "api_key"
    - "token"
    - "authorization"
