<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Mini-Orca · Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='m16 2 13 8v12l-13 8L3 22V10Z' fill='%236f7ff7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/assets/app.css">
<script type="module" src="/ui/assets/js/main.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app" class="app" data-side="open">
  <header class="titlebar" role="banner">
    <div class="titlebar-left">
      <button id="side-toggle" class="icon-btn" type="button" aria-label="Toggle side panel" aria-controls="side" aria-expanded="true" title="Toggle side panel (Ctrl+B)"></button>
      <span class="brand" aria-label="Mini-Orca"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">mini-orca</span></span>
      <nav class="crumbs" aria-label="Location">
        <button id="crumb-project" class="crumb" type="button" data-action="open-page" data-page="settings" title="Project settings">Workspace</button>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <button id="crumb-branch" class="crumb crumb-branch" type="button" data-action="open-page" data-page="git" title="Branches and worktrees">main</button>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span id="crumb-page" class="crumb crumb-current" aria-current="page">Home</span>
      </nav>
    </div>
    <button id="palette-trigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
      <span class="search-icon" aria-hidden="true"></span><span class="search-label">Search files, tasks and commands</span><kbd class="kbd">⌘K</kbd>
    </button>
    <div class="titlebar-right">
      <button id="proposal-pill" class="proposal-pill" type="button" data-action="open-review" hidden></button>
      <span id="live-dot" class="live-dot" role="status" aria-label="Connecting"></span>
      <button id="help-trigger" class="icon-btn" type="button" aria-label="Keyboard shortcuts" aria-keyshortcuts="?" title="Keyboard shortcuts (?)"></button>
    </div>
  </header>

  <nav id="activity" class="activity" aria-label="Main navigation"></nav>

  <aside id="side" class="side" aria-label="Side panel">
    <div id="side-content" class="side-content"></div>
    <div id="side-resizer" class="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0"></div>
  </aside>
  <button id="side-scrim" class="side-scrim" type="button" aria-label="Close side panel" tabindex="-1"></button>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="statusbar" aria-label="Workspace status">
    <div class="status-group">
      <button id="status-branch" class="status-item" type="button" data-action="open-page" data-page="git"></button>
      <button id="status-trust" class="status-item" type="button" data-action="open-page" data-page="settings"></button>
      <span id="status-activity" class="status-item status-activity" aria-live="polite"></span>
    </div>
    <div class="status-group">
      <button id="status-review" class="status-item" type="button" data-action="open-review" hidden></button>
      <span id="status-version" class="status-item status-faint"></span>
      <button class="status-item" type="button" data-action="shortcuts"><kbd class="kbd kbd-sm">?</kbd> Shortcuts</button>
    </div>
  </footer>
</div>

<div id="toasts" class="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

<dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
  <form method="dialog" class="dialog-form">
    <h2 id="dialog-title" class="dialog-title"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <label id="dialog-field" class="field" hidden><span id="dialog-label" class="field-label"></span><input id="dialog-input" class="input" autocomplete="off" spellcheck="false"></label>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn" type="button" value="cancel">Cancel</button>
      <button id="dialog-confirm" class="btn btn-primary" type="submit" value="confirm">Confirm</button>
    </div>
  </form>
</dialog>

<dialog id="palette" class="palette" aria-label="Command palette">
  <div class="palette-input-row">
    <span class="search-icon" aria-hidden="true"></span>
    <input id="palette-input" class="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" placeholder="Type a command, file or task…" autocomplete="off" spellcheck="false">
    <kbd class="kbd">Esc</kbd>
  </div>
  <div id="palette-list" class="palette-list" role="listbox" aria-label="Results"></div>
  <div class="palette-foot"><span><kbd class="kbd kbd-sm">↑</kbd><kbd class="kbd kbd-sm">↓</kbd> navigate</span><span><kbd class="kbd kbd-sm">↵</kbd> open</span><span><kbd class="kbd kbd-sm">&gt;</kbd> commands only</span><span><kbd class="kbd kbd-sm">#</kbd> tasks only</span></div>
</dialog>

<dialog id="shortcuts" class="dialog dialog-wide" aria-labelledby="shortcuts-title">
  <div class="dialog-form">
    <h2 id="shortcuts-title" class="dialog-title">Keyboard shortcuts</h2>
    <div id="shortcuts-body" class="shortcuts-grid"></div>
    <div class="dialog-actions"><button class="btn" type="button" data-close>Close</button></div>
  </div>
</dialog>
</body>
</html>
