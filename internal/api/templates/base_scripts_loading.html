{{ define "base_scripts_loading" }}
<!-- Loading Indicators -->
<script>
    const globalLoading = {
        overlay: document.getElementById('global-loading'),
        activeRequests: 0,
        minDisplayTime: 300,
        startTime: null,

        show(message) {
            this.activeRequests++;
            if (this.overlay) {
                this.startTime = Date.now();
                if (message) {
                    const textEl = this.overlay.querySelector('.global-loading-text');
                    if (textEl) textEl.textContent = message;
                }
                this.overlay.classList.add('is-active');
            }
        },

        hide() {
            this.activeRequests = Math.max(0, this.activeRequests - 1);
            if (this.activeRequests <= 0 && this.overlay) {
                if (this.startTime && (Date.now() - this.startTime) < this.minDisplayTime) {
                    setTimeout(() => this.hideImmediately(), this.minDisplayTime - (Date.now() - this.startTime));
                } else {
                    this.hideImmediately();
                }
            }
        },

        hideImmediately() {
            if (this.overlay) { this.overlay.classList.remove('is-active'); }
            this.activeRequests = 0;
        }
    };

    document.addEventListener('htmx:beforeRequest', (event) => {
        const elt = event.detail.elt;
        if (elt) {
            const trigger = elt.getAttribute('hx-trigger') || '';
            if (trigger.includes('every') || elt.classList.contains('no-global-loading')) return;
        }
        const config = event.detail.requestConfig;
        const method = config ? config.verb?.toUpperCase() : '';
        if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) { globalLoading.show('Processing...'); }
        else if (method === 'GET') { globalLoading.show('Loading...'); }
    });

    document.addEventListener('htmx:afterRequest', () => { globalLoading.hide(); });

    document.addEventListener('htmx:configRequest', (event) => {
        const button = event.detail.elt;
        if (button.classList.contains('btn')) {
            button.classList.add('is-loading');
            if (!button.dataset.originalContent) { button.dataset.originalContent = button.innerHTML; }
        }
    });

    document.addEventListener('htmx:afterRequest', (event) => {
        const button = event.detail.elt;
        if (button && button.classList.contains('btn')) {
            button.classList.remove('is-loading');
            if (button.dataset.originalContent) {
                button.innerHTML = button.dataset.originalContent;
                delete button.dataset.originalContent;
            }
        }
    });

    function setLoading(button, isLoading) {
        if (!button) return;
        if (isLoading) {
            button.classList.add('is-loading');
            button.disabled = true;
            if (!button.dataset.originalDisabled) { button.dataset.originalDisabled = button.disabled; }
        } else {
            button.classList.remove('is-loading');
            button.disabled = button.dataset.originalDisabled === 'true';
            delete button.dataset.originalDisabled;
        }
    }

    function showPhaseLoading(phaseId, message) {
        const container = document.getElementById(phaseId);
        if (!container) return;
        const existing = container.querySelector('.phase-loading-overlay');
        if (existing) existing.remove();
        const overlay = document.createElement('div');
        overlay.className = 'phase-loading-overlay';
        overlay.innerHTML = `<div class="loading-spinner md accent"></div><span class="phase-loading-text">${message || 'Processing...'}</span><span class="phase-loading-subtext">Please wait</span>`;
        container.style.position = 'relative';
        container.appendChild(overlay);
    }

    function hidePhaseLoading(phaseId) {
        const container = document.getElementById(phaseId);
        if (!container) return;
        const overlay = container.querySelector('.phase-loading-overlay');
        if (overlay) { overlay.remove(); }
    }

    function showSkeleton(containerId, type = 'card') {
        const container = document.getElementById(containerId);
        if (!container) return;
        let skeletonHTML = '';
        switch (type) {
            case 'card':
                skeletonHTML = `<div class="skeleton-card"><div class="skeleton-header"><div class="skeleton skeleton-circle skeleton-avatar"></div><div class="skeleton skeleton-title"></div></div><div class="skeleton skeleton-description"></div><div class="skeleton skeleton-description w-75"></div><div class="skeleton skeleton-footer"><div class="skeleton skeleton-button"></div><div class="skeleton skeleton-button"></div></div></div>`;
                break;
            case 'table':
                skeletonHTML = `<div class="skeleton-table">${Array(5).fill('<div class="skeleton-row"><div class="skeleton-cell"></div><div class="skeleton-cell wide"></div><div class="skeleton-cell narrow"></div></div>').join('')}</div>`;
                break;
            case 'grid':
                skeletonHTML = `<div class="skeleton-grid skeleton-grid-cols-3">${Array(6).fill(`<div class="skeleton-grid-item"><div class="skeleton-header"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div></div><div class="skeleton skeleton-description"></div><div class="skeleton skeleton-footer"><div class="skeleton skeleton-button"></div></div></div>`).join('')}</div>`;
                break;
            case 'editor':
                skeletonHTML = `<div class="skeleton-editor"><div class="skeleton-editor-header"><div class="skeleton skeleton-file-tab"></div></div><div class="skeleton-editor-body"><div class="skeleton-editor-line-numbers">${Array(20).fill('<div class="skeleton-line"></div>').join('')}</div><div class="skeleton-editor-content">${Array(20).fill('<div class="skeleton-line"></div>').join('')}</div></div></div>`;
                break;
            case 'log':
                skeletonHTML = `<div class="skeleton-log">${Array(8).fill(`<div class="skeleton-log-entry"><div class="skeleton skeleton-icon"></div><div class="skeleton-content"><div class="skeleton skeleton-badge"></div><div class="skeleton skeleton-message"></div></div><div class="skeleton skeleton-time"></div></div>`).join('')}</div>`;
                break;
        }
        container.innerHTML = skeletonHTML;
    }

    function hideSkeleton(containerId) {
        const container = document.getElementById(containerId);
        if (container) { container.classList.remove('skeleton-active'); }
    }

    setTimeout(() => { globalLoading.hideImmediately(); }, 30000);
</script>
{{ end }}
