{{ define "project-modal" }}
<!-- Project Modal Overlay -->
<div id="project-modal" class="hidden fixed inset-0 z-50" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60" onclick="closeProjectModal()"></div>
    <!-- Modal Panel -->
    <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="relative bg-dark-800 border border-dark-600 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-dark-600">
                <h2 id="project-modal-title" class="text-lg font-semibold text-text-primary">Open Existing Project</h2>
                <button class="p-1.5 text-text-secondary hover:text-text-primary hover:bg-dark-700 rounded-md transition-colors"
                    onclick="closeProjectModal()" aria-label="Close modal">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
            <!-- Body (form injected here) -->
            {{ template "project-form" . }}
            <!-- Footer -->
            <div class="flex items-center justify-end gap-3 px-6 py-4 bg-dark-900/50 border-t border-dark-600">
                <button type="button" class="px-4 py-2 text-sm text-text-secondary hover:text-text-primary transition-colors"
                    onclick="closeProjectModal()">Cancel</button>
                <button id="btn-open-project" type="button"
                    class="px-5 py-2 text-sm bg-accent hover:bg-accent-hover text-dark-900 font-medium rounded-lg transition-colors flex items-center gap-2"
                    onclick="openProject()">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h10a1 1 0 011 1v1.09L11.38 6.13a2.5 2.5 0 011.24 4.297l.846 3.383A1.5 1.5 0 0111.028 15H6.972a1.5 1.5 0 01-1.438-1.19l-.846-3.383a2.5 2.5 0 011.24-4.297L4 5.09V4zm2 2v.75a.5.5 0 00.846.354l4-3A.5.5 0 0011 6V6H5z" clip-rule="evenodd"/>
                    </svg>Open Existing Project</button>
            </div>
        </div>
    </div>
</div>

<script>
    function openProjectModal() {
        const modal = document.getElementById('project-modal');
        modal.classList.remove('hidden');
        setTimeout(() => { document.getElementById('project-path').focus(); }, 100);
        hideProjectError();
    }

    function closeProjectModal() {
        const modal = document.getElementById('project-modal');
        modal.classList.add('hidden');
        document.getElementById('project-path').value = '';
        document.getElementById('project-name').value = '';
        document.getElementById('project-type').value = '';
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const modal = document.getElementById('project-modal');
            if (!modal.classList.contains('hidden')) { closeProjectModal(); }
        }
    });

    // Make functions globally accessible
    window.openProjectModal = openProjectModal;
    window.closeProjectModal = closeProjectModal;
</script>
{{ end }}
