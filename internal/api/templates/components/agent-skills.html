{{ define "agent-skills" }}
<div id="agent-skills" class="w-full">
    <div class="p-4 border-b border-dark-600">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-text-primary">Agent Skill Associations</h3>
            <span class="text-xs text-text-secondary">{{ len .Agents }} agents</span>
        </div>
    </div>
    <div id="agents-list" class="overflow-y-auto max-h-[calc(100vh-200px)]">
        {{ range .Agents }}
            {{ template "agent-skill-badge" . }}
        {{ end }}
    </div>
</div>
{{ end }}

<script>
    function toggleAgentPanel(agentName) {
        const content = document.getElementById('agent-content-' + agentName);
        const chevron = content.closest('.agent-panel').querySelector('.agent-chevron');
        if (content.classList.contains('hidden')) {
            content.classList.remove('hidden');
            chevron.style.transform = 'rotate(180deg)';
        } else {
            content.classList.add('hidden');
            chevron.style.transform = 'rotate(0deg)';
        }
    }

    document.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox' && e.target.name === 'skills') {
            const label = e.target.closest('.skill-checkbox');
            const statusBadge = label.querySelector('.skill-status');
            if (e.target.checked) {
                statusBadge.className = 'skill-status px-1.5 py-0.5 text-[9px] font-medium rounded shrink-0 bg-green-500/10 text-green-400';
                statusBadge.textContent = 'Assigned';
                label.classList.add('bg-green-500/5');
            } else {
                statusBadge.className = 'skill-status px-1.5 py-0.5 text-[9px] font-medium rounded shrink-0 bg-dark-600 text-text-secondary/50';
                statusBadge.textContent = 'Available';
                label.classList.remove('bg-green-500/5');
            }
            updateSkillCount();
        }
    });

    function updateSkillCount() {
        const checkboxes = document.querySelectorAll('input[name="skills"]:checked');
        checkboxes.length;
    }
</script>

<style>
    .icon-coder { background-color: rgba(34, 197, 94, 0.15); }
    .icon-tester { background-color: rgba(234, 179, 8, 0.15); }
    .icon-reviewer { background-color: rgba(168, 85, 247, 0.15); }
    input[type="checkbox"] { accent-color: var(--accent); }
    .agent-panel:hover { background-color: rgba(33, 38, 45, 0.3); }
    #agents-list { scrollbar-width: thin; scrollbar-color: var(--bg-tertiary) var(--bg-secondary); }
    .agent-content { transition: all 0.2s ease; }
</style>
