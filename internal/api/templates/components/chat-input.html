{{ define "chat-input" }}
<div id="chat-input-container" class="border-t border-dark-600 p-3 shrink-0">
    <!-- File Context Indicator -->
    {{ if .FocusedFile }}
    <div class="chat-file-context flex items-center gap-2 mb-2 px-1">
        <svg class="w-3 h-3 text-blue-400 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-xs text-text-secondary truncate">Context: <span class="text-text-primary font-medium">{{ .FocusedFile }}</span></span>
        <button
            class="ml-auto text-text-secondary hover:text-text-primary transition-colors shrink-0"
            onclick="clearFileContext()"
            aria-label="Clear file context"
        >
            <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    {{ end }}

    <div class="flex items-end gap-2">
        <!-- Textarea -->
        <textarea
            id="chat-input"
            rows="1"
            placeholder="Ask Mini-Orca to help with your code..."
            class="flex-1 px-3 py-2 bg-dark-700 border border-dark-600 rounded-lg text-sm text-text-primary placeholder-text-secondary focus:outline-none focus:border-blue-500 resize-none max-h-32"
            hx-post="/api/chat/message"
            hx-trigger="keyup[key === 'Enter'] and not key === 'ShiftEnter' from:#chat-input, keyup[key === 'Enter'] from:#chat-input"
            hx-vals='js:{message: document.getElementById("chat-input").value}'
            hx-target="#chat-messages"
            hx-swap="beforeend"
            hx-disabled-elt="this"
            onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('chat-input').dispatchEvent(new KeyboardEvent('keyup', {key: 'Enter'})); }"
        ></textarea>

        <!-- Send Button -->
        <button
            id="chat-send-btn"
            class="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
            aria-label="Send message"
            onclick="document.getElementById('chat-input').dispatchEvent(new KeyboardEvent('keyup', {key: 'Enter'}))"
        >
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7" />
            </svg>
        </button>
    </div>

    <!-- Hint Text -->
    <div class="mt-1.5 px-1 flex items-center justify-between">
        <span class="text-[10px] text-text-secondary">Press Enter to send, Shift+Enter for new line</span>
        {{ if .FocusedFile }}
        <span class="text-[10px] text-blue-400">File context active</span>
        {{ end }}
    </div>
</div>
{{ end }}
