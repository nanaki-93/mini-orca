{{ define "agent-skill-badge" }}
<div class="agent-panel border-b border-dark-600" data-agent="{{ .Name }}">
    <!-- Agent Header -->
    <div
        class="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-dark-700/50 transition-colors"
        onclick="toggleAgentPanel('{{ .Name }}')"
    >
        <div class="flex items-center gap-3">
            <div class="agent-icon w-8 h-8 rounded-md flex items-center justify-center {{ agentIconClass .Name }}">
                {{ agentIcon .Name }}
            </div>
            <div>
                <h4 class="text-sm font-medium text-text-primary">{{ humanName .Name }}</h4>
                <p class="text-[10px] text-text-secondary">{{ len .Skills }} skills assigned</p>
            </div>
        </div>
        <svg class="agent-chevron w-4 h-4 text-text-secondary transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
    </div>

    <!-- Agent Skills Content -->
    <div id="agent-content-{{ .Name }}" class="agent-content hidden">
        <form
            hx-post="/api/agents/{{ .Name }}/skills"
            hx-encoding="application/json"
            hx-target="#agent-status-{{ .Name }}"
            hx-swap="innerHTML"
            hx-indicator="#agent-loading-{{ .Name }}"
        >
            <div class="px-4 py-3">
                <p class="text-xs text-text-secondary mb-3">Assign skills to this agent:</p>
                <div class="space-y-2">
                    {{ range .AvailableSkills }}
                        <label class="skill-checkbox flex items-center gap-2 p-2 rounded-md hover:bg-dark-700/50 transition-colors cursor-pointer">
                            <input
                                type="checkbox"
                                name="skills"
                                value="{{ .Name }}"
                                {{ if isSkillAssigned .Name .AssignedSkills }}checked{{ end }}
                                class="w-3.5 h-3.5 rounded border-dark-600 bg-dark-700 text-accent focus:ring-accent focus:ring-offset-0 cursor-pointer"
                            />
                            <div class="flex-1 min-w-0">
                                <span class="text-xs text-text-primary">{{ .Name }}</span>
                                <p class="text-[10px] text-text-secondary truncate">{{ .Description }}</p>
                            </div>
                            <span class="skill-status px-1.5 py-0.5 text-[9px] font-medium rounded shrink-0 {{ if isSkillAssigned .Name .AssignedSkills }}bg-green-500/10 text-green-400{{ else }}bg-dark-600 text-text-secondary/50{{ end }}">
                                {{ if isSkillAssigned .Name .AssignedSkills }}Assigned{{ else }}Available{{ end }}
                            </span>
                        </label>
                    {{ end }}
                </div>
                <div id="agent-status-{{ .Name }}" class="mt-3 text-xs"></div>
            </div>
            <div id="agent-loading-{{ .Name }}" class="hidden htmx-indicator px-4 py-2 text-text-secondary">
                <div class="flex items-center gap-2">
                    <svg class="animate-spin h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-[10px]">Saving...</span>
                </div>
            </div>
            <div class="px-4 py-3 border-t border-dark-600">
                <button
                    type="submit"
                    class="w-full px-4 py-1.5 text-xs bg-accent hover:bg-accent-hover text-dark-900 font-medium rounded-md transition-colors"
                >
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
