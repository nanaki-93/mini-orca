{{ define "settings-panel" }}
<!-- Settings Panel -->
<div id="settings-panel" class="hidden fixed inset-0 z-50">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" onclick="toggleSettingsPanel()"></div>

    <!-- Panel -->
    <div class="absolute right-0 top-0 h-full w-96 bg-dark-800 border-l border-dark-600 shadow-2xl overflow-y-auto">
        <div class="p-4">
            <!-- Panel Header -->
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-semibold text-text-primary">Settings</h2>
                <button
                    class="p-1.5 text-text-secondary hover:text-text-primary hover:bg-dark-700 rounded-md transition-colors"
                    onclick="toggleSettingsPanel()"
                >
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>

            <!-- Save Button -->
            <button
                class="w-full px-4 py-2 text-sm bg-accent hover:bg-accent-hover text-dark-900 font-medium rounded-md transition-colors"
                hx-post="/api/settings/save"
                hx-target="#settings-save-status"
                hx-swap="innerHTML"
            >
                Save Settings
            </button>
            <div id="settings-save-status" class="mt-2 text-xs"></div>
        </div>
    </div>
</div>

<script>
    // Settings panel toggle
    function toggleSettingsPanel() {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('hidden');
    }

    // Close settings on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const panel = document.getElementById('settings-panel');
            if (!panel.classList.contains('hidden')) {
                toggleSettingsPanel();
            }
        }
    });

    // Temperature slider update
    document.addEventListener('DOMContentLoaded', () => {
        const slider = document.querySelector('input[type="range"]');
        if (slider) {
            slider.addEventListener('input', (e) => {
                const label = e.target.previousElementSibling.querySelector('span:last-child');
                if (label) {
                    label.textContent = e.target.value;
                }
            });
        }
    });
</script>

<style>
    /* Range slider styling */
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: var(--accent);
        cursor: pointer;
        border: 2px solid var(--bg-secondary);
    }

    input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: var(--accent);
        cursor: pointer;
        border: 2px solid var(--bg-secondary);
    }
</style>
{{ end }}
