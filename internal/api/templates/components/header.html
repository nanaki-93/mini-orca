{{ define "header-bar" }}
<div id="header-bar" class="w-full h-full flex items-center justify-between px-4 bg-dark-800 border-b border-dark-600">
    <!-- Left Section: Project Info -->
    <div class="flex items-center gap-3">
        <!-- Logo/Brand -->
        <div class="flex items-center gap-2 shrink-0">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="shrink-0">
                <h1 class="text-sm font-semibold text-text-primary leading-tight">{{ .ProjectName }}</h1>
                <p class="text-[10px] text-text-secondary truncate max-w-[200px]">{{ .ProjectPath }}</p>
            </div>
        </div>

        <!-- Open Project Button -->
        <button
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-dark-700 hover:bg-dark-600 text-text-primary border border-dark-600 rounded-md transition-colors"
            onclick="openProjectModal()"
        >
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h10a1 1 0 011 1v1.09L11.38 6.13a2.5 2.5 0 011.24 4.297l.846 3.383A1.5 1.5 0 0111.028 15H6.972a1.5 1.5 0 01-1.438-1.19l-.846-3.383a2.5 2.5 0 011.24-4.297L4 5.09V4zm2 2v.75a.5.5 0 00.846.354l4-3A.5.5 0 0011 6V6H5z" clip-rule="evenodd"/>
            </svg>
            <span class="hidden sm:inline">Open Project</span>
        </button>

        <!-- Session ID -->
        <div class="hidden sm:flex items-center gap-1.5 px-2 py-1 bg-dark-700 rounded-md">
            <svg class="w-3 h-3 text-text-secondary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
            </svg>
            <span class="text-xs text-text-secondary font-mono">{{ .SessionID }}</span>
        </div>
    </div>

    <!-- Center Section: Phase Indicator -->
    <div class="flex items-center gap-2">
        <!-- Phase Badge -->
        <div class="flex items-center gap-2 px-3 py-1.5 bg-dark-700 rounded-md border {{ if eq .CurrentPhaseStatus (quote "completed") }}border-green-500{{ else if eq .CurrentPhaseStatus (quote "failed") }}border-red-500{{ else if eq .CurrentPhaseStatus (quote "in-progress") }}border-blue-500{{ else if eq .CurrentPhaseStatus (quote "waiting") }}border-yellow-500{{ else }}border-dark-600{{ end }}">
            <div class="phase-dot w-2 h-2 rounded-full {{ if eq .CurrentPhaseStatus (quote "completed") }}bg-green-500{{ else if eq .CurrentPhaseStatus (quote "failed") }}bg-red-500{{ else if eq .CurrentPhaseStatus (quote "in-progress") }}bg-blue-500 animate-pulse{{ else if eq .CurrentPhaseStatus (quote "waiting") }}bg-yellow-500{{ else }}bg-dark-600{{ end }}"></div>
            <span class="text-xs font-medium {{ if eq .CurrentPhaseStatus (quote "completed") }}text-green-500{{ else if eq .CurrentPhaseStatus (quote "failed") }}text-red-500{{ else if eq .CurrentPhaseStatus (quote "in-progress") }}text-blue-500{{ else if eq .CurrentPhaseStatus (quote "waiting") }}text-yellow-500{{ else }}text-dark-600{{ end }}">{{ title .CurrentPhaseName }}</span>
            {{ if .PhaseProgress }}
            <span class="text-xs text-text-secondary">{{ .PhaseProgress }}%</span>
            {{ end }}
        </div>

        <!-- Phase Progress Bar -->
        <div class="hidden md:block w-32 h-1.5 bg-dark-600 rounded-full overflow-hidden">
            <div class="phase-progress-bar h-full {{ if eq .CurrentPhaseStatus (quote "completed") }}bg-green-500{{ else if eq .CurrentPhaseStatus (quote "failed") }}bg-red-500{{ else if eq .CurrentPhaseStatus (quote "in-progress") }}bg-blue-500{{ else if eq .CurrentPhaseStatus (quote "waiting") }}bg-yellow-500{{ else }}bg-dark-600{{ end }} transition-all duration-500" style="width: {{ .PhaseProgress }}%"></div>
        </div>
    </div>

    <!-- Right Section: Controls -->
    <div class="flex items-center gap-3">
        <!-- Session Controls -->
        <div class="flex items-center gap-1.5">
            <!-- Pause/Resume Button -->
            {{ if eq .SessionStatus "running" }}
            <button
                id="btn-pause"
                class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-dark-700 hover:bg-yellow-600/20 text-text-primary hover:text-yellow-400 rounded-md transition-colors"
                hx-post="/api/session/pause"
                hx-target="#header-bar"
                hx-swap="outerHTML"
                hx-disabled-elt="this"
            >
                <svg class="w-3.5 h-3.5 btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span class="hidden sm:inline btn-text">Pause</span>
            </button>
            {{ else if eq .SessionStatus "paused" }}
            <button
                id="btn-resume"
                class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-dark-700 hover:bg-green-600/20 text-text-primary hover:text-green-400 rounded-md transition-colors"
                hx-post="/api/session/resume"
                hx-target="#header-bar"
                hx-swap="outerHTML"
                hx-disabled-elt="this"
            >
                <svg class="w-3.5 h-3.5 btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
                <span class="hidden sm:inline btn-text">Resume</span>
            </button>
            {{ else }}
            <button
                id="btn-start"
                class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-dark-700 hover:bg-blue-600/20 text-text-primary hover:text-blue-400 rounded-md transition-colors"
                hx-post="/api/session/start"
                hx-target="#header-bar"
                hx-swap="outerHTML"
                hx-disabled-elt="this"
            >
                <svg class="w-3.5 h-3.5 btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
                <span class="hidden sm:inline btn-text">Start</span>
            </button>
            {{ end }}

            <!-- Stop Button -->
            <button
                id="btn-stop"
                class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-dark-700 hover:bg-red-600/20 text-text-primary hover:text-red-400 rounded-md transition-colors"
                hx-post="/api/session/stop"
                hx-vals='{"confirm": "true"}'
                hx-target="#header-bar"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to stop the session?"
                hx-disabled-elt="this"
            >
                <svg class="w-3.5 h-3.5 btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"/>
                </svg>
                <span class="hidden sm:inline btn-text">Stop</span>
            </button>
        </div>

        <!-- Settings Button -->
        <button
            id="btn-settings"
            class="flex items-center gap-1.5 px-2 py-1.5 text-xs bg-dark-700 hover:bg-dark-600 text-text-primary rounded-md transition-colors"
            onclick="toggleSettingsPanel()"
        >
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.532 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
            </svg>
        </button>

        <!-- New Session Button -->
        <button
            id="btn-new-session"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-accent hover:bg-accent-hover text-dark-900 font-medium rounded-md transition-colors"
            hx-post="/api/session/new"
            hx-target="body"
            hx-swap="outerHTML"
        >
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z"/>
            </svg>
            <span class="hidden sm:inline">New Session</span>
        </button>
    </div>
</div>

<style>
    /* Phase indicator colors */
    .phase-pending .phase-dot { background-color: #6b7280; }
    .phase-pending .phase-text { color: #6b7280; }
    .phase-pending { border-color: #6b7280; }

    .phase-waiting .phase-dot { background-color: #eab308; animation: pulse 2s infinite; }
    .phase-waiting .phase-text { color: #eab308; }
    .phase-waiting { border-color: #eab308; }

    .phase-in-progress .phase-dot { background-color: #3b82f6; animation: pulse 1.5s infinite; }
    .phase-in-progress .phase-text { color: #3b82f6; }
    .phase-in-progress { border-color: #3b82f6; }

    .phase-completed .phase-dot { background-color: #22c55e; }
    .phase-completed .phase-text { color: #22c55e; }
    .phase-completed { border-color: #22c55e; }

    .phase-failed .phase-dot { background-color: #ef4444; }
    .phase-failed .phase-text { color: #ef4444; }
    .phase-failed { border-color: #ef4444; }

    /* Progress bar colors */
    .progress-pending { background-color: #6b7280; }
    .progress-waiting { background-color: #eab308; }
    .progress-in-progress { background-color: #3b82f6; }
    .progress-completed { background-color: #22c55e; }
    .progress-failed { background-color: #ef4444; }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
</style>
{{ end }}
