{{ define "mobile-sidebar" }}
<div id="mobile-sidebar" class="w-full">
    <!-- Sidebar Overlay -->
    <div
        id="sidebar-overlay"
        class="hidden fixed inset-0 bg-black/60 z-40 transition-opacity duration-200"
        onclick="toggleMobileSidebar()"
    ></div>

    <!-- Sidebar Panel -->
    <div
        id="sidebar-panel"
        class="fixed top-0 left-0 h-full w-[85vw] max-w-[18rem] bg-dark-800 border-r border-dark-600 z-50 transform -translate-x-full transition-transform duration-200 ease-in-out overflow-y-auto shadow-2xl"
    >
        <!-- Sidebar Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-dark-600">
            <h2 class="text-sm font-semibold text-text-primary">Navigation</h2>
            <button
                class="p-1.5 text-text-secondary hover:text-text-primary hover:bg-dark-700 rounded-md transition-colors"
                onclick="toggleMobileSidebar()"
                aria-label="Close sidebar"
            >
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </button>
        </div>

        <!-- Sidebar Content -->
        <div class="p-4 space-y-4">
            <!-- File Tree Section -->
            <div>
                <h3 class="text-xs font-semibold text-text-secondary uppercase tracking-wider mb-2">Files</h3>
                <div id="mobile-file-tree">
                    {{ template "file-tree" . }}
                </div>
            </div>

            <!-- Phases Section -->
            <div>
                <h3 class="text-xs font-semibold text-text-secondary uppercase tracking-wider mb-2">Phases</h3>
                <div id="mobile-phase-tracker">
                    {{ template "phase-tracker" . }}
                </div>
            </div>

            <!-- Quick Actions -->
            <div>
                <h3 class="text-xs font-semibold text-text-secondary uppercase tracking-wider mb-2">Actions</h3>
                <div class="space-y-1">
                    <button
                        class="w-full flex items-center gap-2 px-3 py-2 text-xs text-text-primary hover:bg-dark-700 rounded-md transition-colors"
                        hx-post="/api/session/new"
                        hx-target="body"
                        hx-swap="outerHTML"
                    >
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z"/>
                        </svg>
                        Create New Session
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle mobile sidebar visibility (if not already defined in base.html)
    if (typeof toggleMobileSidebar !== 'function') {
        function toggleMobileSidebar() {
            const panel = document.getElementById('sidebar-panel');
            const overlay = document.getElementById('sidebar-overlay');
            const isClosed = panel.classList.contains('-translate-x-full');

            if (isClosed) {
                // Open sidebar
                panel.classList.remove('-translate-x-full');
                panel.classList.add('translate-x-0');
                overlay.classList.remove('hidden');
                overlay.classList.add('opacity-100');
                document.body.classList.add('overflow-hidden');
            } else {
                // Close sidebar
                panel.classList.remove('translate-x-0');
                panel.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 200);
                document.body.classList.remove('overflow-hidden');
            }
        }
    }

    // Close sidebar on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const panel = document.getElementById('sidebar-panel');
            if (panel && !panel.classList.contains('-translate-x-full')) {
                toggleMobileSidebar();
            }
        }
    });
</script>

<style>
    /* Prevent body scroll when sidebar is open */
    body.sidebar-open,
    body.overflow-hidden {
        overflow: hidden;
    }

    /* Smooth transitions for sidebar */
    #sidebar-panel {
        will-change: transform;
        -webkit-overflow-scrolling: touch;
    }

    #sidebar-overlay {
        will-change: opacity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    /* Sidebar scrollbar styling */
    #sidebar-panel::-webkit-scrollbar {
        width: 6px;
    }

    #sidebar-panel::-webkit-scrollbar-track {
        background: transparent;
    }

    #sidebar-panel::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
    }

    #sidebar-panel::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
    }

    /* Touch optimizations for mobile sidebar */
    @media (hover: none) and (pointer: coarse) {
        #sidebar-panel .tree-item,
        #sidebar-panel .btn {
            min-height: 2.75rem;
        }

        #sidebar-panel .tree-item:active {
            background-color: var(--bg-tertiary);
        }
    }
</style>
{{ end }}
