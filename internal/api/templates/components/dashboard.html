{{ define "dashboard" }}
<!-- Batched Dashboard Update: Phase Tracker + Activity Log in single request -->
<div id="dashboard-batch" class="no-global-loading" hx-swap-oob="true">
    <!-- Phase Tracker (updated via batched endpoint) -->
    <div id="phase-tracker-container" class="h-1/2 border-b border-dark-600 overflow-y-auto">
        {{ template "phase-tracker" .PhaseTracker }}
    </div>

    <!-- Activity Log (updated via batched endpoint) -->
    <div id="activity-log-container" class="h-1/2 overflow-y-auto">
        {{ template "activity-log" .ActivityLog }}
    </div>
</div>
{{ end }}
