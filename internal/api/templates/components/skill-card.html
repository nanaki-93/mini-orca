{{ define "skill-card" }}
<div class="skill-card p-3 bg-dark-700/50 border border-dark-600 rounded-md hover:bg-dark-700 transition-colors cursor-pointer" data-skill="{{ .Name }}">
    <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
            <h5 class="text-xs font-medium text-text-primary mb-1">{{ .Name }}</h5>
            <p class="text-[10px] text-text-secondary leading-relaxed">{{ .Description }}</p>
        </div>
        <span class="skill-badge px-1.5 py-0.5 text-[9px] font-medium rounded shrink-0 {{ categoryBadgeClass .Category }}">
            {{ .Category }}
        </span>
    </div>
</div>
{{ end }}

<script>
    function clearSkillsSearch() {
        const input = document.getElementById('skills-search');
        const clearBtn = document.getElementById('skills-clear');
        input.value = '';
        clearBtn.classList.add('hidden');
        htmx.ajax('GET', '/api/skills', { target: '#skills-results', swap: 'innerHTML' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('skills-search');
        const clearBtn = document.getElementById('skills-clear');
        if (input) {
            input.addEventListener('input', () => {
                clearBtn.classList.toggle('hidden', input.value.length === 0);
            });
        }
    });

    function filterByCategory(category) {
        document.querySelectorAll('.skill-category').forEach(cat => {
            cat.style.display = (category === 'all' || cat.dataset.category === category) ? 'block' : 'none';
        });
    }
</script>

<style>
    .badge-design { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; }
    .badge-coding { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .badge-testing { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .badge-review { background-color: rgba(234, 179, 8, 0.15); color: #eab308; }
    .badge-tools { background-color: rgba(6, 182, 212, 0.15); color: #06b6d4; }
    .skill-card:hover { border-color: rgba(99, 102, 241, 0.3); }
    #skills-results { scrollbar-width: thin; scrollbar-color: var(--bg-tertiary) var(--bg-secondary); }
</style>
