{{ define "base_styles" }}
<!-- Custom CSS Variables for Dark Theme -->
<style>
    /* Screen Reader Only - Visible to assistive tech, hidden visually */
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
    }

    /* Skip Navigation Link */
    .skip-link {
        position: absolute;
        top: -100%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        padding: 0.75rem 1.5rem;
        background-color: var(--accent);
        color: var(--text-inverse, #0d1117);
        font-weight: 600;
        border-radius: 0.375rem;
        text-decoration: none;
        transition: top 0.2s ease;
        font-size: 0.875rem;
    }

    .skip-link:focus {
        top: 0.5rem;
        outline: 3px solid var(--accent-hover, #79c0ff);
        outline-offset: 2px;
    }

    :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --bg-tertiary: #21262d;
        --border-color: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
        background: var(--bg-tertiary);
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--border-color);
    }
</style>
{{ end }}
