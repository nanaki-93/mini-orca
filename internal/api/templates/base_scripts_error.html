{{ define "base_scripts_error" }}
<!-- Error Handling, Utilities & Global Functions -->
<script>
    document.addEventListener('htmx:responseError', (event) => {
        const response = event.detail.xhr;
        const requestConfig = event.detail.requestConfig;
        let errorMessage = 'An error occurred while processing your request.';
        let errorTitle = 'Request Failed';
        try {
            const errorData = JSON.parse(response.responseText);
            errorMessage = errorData.error || errorMessage;
        } catch (e) { if (response.statusText) { errorMessage = response.statusText; } }
        switch (response.status) {
            case 400: errorTitle = 'Bad Request'; break;
            case 401: Toast.error(errorMessage, 'Unauthorized'); return;
            case 403: errorTitle = 'Forbidden'; break;
            case 404: errorTitle = 'Not Found'; errorMessage = 'The requested resource was not found.'; break;
            case 409: errorTitle = 'Conflict'; break;
            case 422: errorTitle = 'Validation Error'; break;
            case 429: errorTitle = 'Too Many Requests'; errorMessage = 'Please wait a moment and try again.'; break;
            case 500: errorTitle = 'Server Error'; errorMessage = 'An internal server error occurred. Please try again later.'; break;
            case 502: errorTitle = 'Bad Gateway'; errorMessage = 'The server received an invalid response.'; break;
            case 503: errorTitle = 'Service Unavailable'; errorMessage = 'The server is temporarily unavailable. Please try again later.'; break;
            default:
                if (response.status >= 500) { errorTitle = 'Server Error'; }
                else if (response.status >= 400) { errorTitle = 'Client Error'; }
        }
        Toast.error(errorMessage, errorTitle);
        const target = event.detail.target;
        if (target && target.classList.contains('retryable')) { addRetryButton(target, event.detail.requestConfig); }
    });

    document.addEventListener('htmx:connectionError', (event) => {
        Toast.error('Connection to server lost. Please check your network and try again.', 'Connection Lost', 10000);
        const target = event.detail.target;
        if (target && target.classList.contains('retryable')) { addRetryButton(target, event.detail.requestConfig); }
    });

    document.addEventListener('htmx:timeout', (event) => {
        Toast.warning('The request took too long to complete. Please try again.', 'Request Timeout', 8000);
        const target = event.detail.target;
        if (target && target.classList.contains('retryable')) { addRetryButton(target, event.detail.requestConfig); }
    });

    function addRetryButton(target, requestConfig) {
        if (target.querySelector('.retry-button')) return;
        const retryBtn = document.createElement('button');
        retryBtn.className = 'retry-button mt-3 px-4 py-2 text-sm bg-dark-700 hover:bg-dark-600 text-text-primary rounded-md transition-colors flex items-center gap-2';
        retryBtn.innerHTML = `<svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>Retry Request`;
        retryBtn.addEventListener('click', () => {
            retryBtn.disabled = true;
            retryBtn.innerHTML = `<svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Retrying...`;
            if (requestConfig && requestConfig.verb && window.htmx) {
                htmx.ajax(requestConfig.verb.toUpperCase(), requestConfig.pathInfo || requestConfig.unidentifiedUrl, {
                    verb: requestConfig.verb.toUpperCase(), headers: requestConfig.headers || {},
                    target: target.id || null, swap: requestConfig.swap || 'innerHTML', values: requestConfig.parameters || {}
                }).finally(() => { retryBtn.remove(); });
            }
        });
        target.appendChild(retryBtn);
    }

    const GracefulDegradation = {
        showError(containerId, message, retryCallback = null) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = `<div class="error-fallback p-6 text-center"><svg class="w-12 h-12 text-error mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg><h3 class="text-lg font-medium text-text-primary mb-2">Something went wrong</h3><p class="text-sm text-text-secondary mb-4">${message}</p>${retryCallback ? `<button class="px-4 py-2 text-sm bg-dark-700 hover:bg-dark-600 text-text-primary rounded-md transition-colors flex items-center gap-2 mx-auto" onclick="${retryCallback}()"><svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>Try Again</button>` : ''}</div>`;
        },
        showOfflineBanner() {
            if (document.getElementById('offline-banner')) return;
            const banner = document.createElement('div');
            banner.id = 'offline-banner';
            banner.className = 'fixed top-0 left-0 right-0 z-50 bg-yellow-500/10 border-b border-yellow-500/20 px-4 py-2 flex items-center justify-center gap-2';
            banner.innerHTML = `<svg class="w-4 h-4 text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg><span class="text-sm text-yellow-500">You are offline. Some features may be unavailable.</span>`;
            document.body.appendChild(banner);
        },
        hideOfflineBanner() { const banner = document.getElementById('offline-banner'); if (banner) { banner.remove(); } }
    };

    window.addEventListener('online', () => { GracefulDegradation.hideOfflineBanner(); Toast.success('Connection restored', 'Back Online'); });
    window.addEventListener('offline', () => { GracefulDegradation.showOfflineBanner(); Toast.warning('Connection lost. You are now offline.', 'Offline Mode'); });
    if (!navigator.onLine) { GracefulDegradation.showOfflineBanner(); }

    window.addEventListener('error', (event) => { console.error('Global error:', event.error); Toast.error(event.error?.message || 'An unexpected error occurred.', 'JavaScript Error'); });
    window.addEventListener('unhandledrejection', (event) => { console.error('Unhandled promise rejection:', event.reason); Toast.error(event.reason?.message || 'An unexpected error occurred.', 'Promise Rejection'); });

    const PhaseHistoryCache = {
        lastSnapshot: null, lastETag: null, lastFetchTime: 0, cacheDuration: 3000, updateCount: 0,
        snapshotKey(data) {
            if (!data) return null;
            const phases = data.querySelectorAll('.phase-node');
            if (!phases?.length) return null;
            return Array.from(phases).map(p => { const s = p.className.match(/phase-(pending|waiting|in-progress|completed|failed)/); return s ? s[1] : 'unknown'; }).join('-');
        },
        isValid() { return this.lastSnapshot !== null && (Date.now() - this.lastFetchTime) < this.cacheDuration; },
        isDifferent(newSnapshot, newETag) {
            if (!newSnapshot || !newETag) return true;
            if (newSnapshot === this.lastSnapshot && newETag === this.lastETag) {
                this.updateCount++; if (this.updateCount > 10) { this.invalidate(); }
                return false;
            }
            this.updateCount = 0; return true;
        },
        cache(snapshot, etag) { this.lastSnapshot = snapshot; this.lastETag = etag; this.lastFetchTime = Date.now(); },
        get() { return this.isValid() ? this.lastSnapshot : null; },
        invalidate() { this.lastSnapshot = null; this.lastETag = null; this.lastFetchTime = 0; this.updateCount = 0; }
    };

    document.addEventListener('htmx:beforeSwap', (event) => {
        const target = event.detail.target, xhr = event.detail.xhr, requestPath = xhr?.requestURL || '';
        if (requestPath.includes('/api/render/dashboard') && target) {
            const snapshotKey = PhaseHistoryCache.snapshotKey(target);
            const etag = xhr?.getResponseHeader('ETag') || snapshotKey;
            if (snapshotKey && PhaseHistoryCache.isDifferent(snapshotKey, etag)) { PhaseHistoryCache.cache(snapshotKey, etag); }
            else if (snapshotKey) { PhaseHistoryCache.lastFetchTime = Date.now(); }
        }
    });

    document.addEventListener('htmx:beforeRequest', (event) => {
        const elt = event.detail.elt, trigger = elt?.getAttribute('hx-trigger') || '';
        if (trigger.includes('every') && elt?.getAttribute('hx-get')?.includes('/api/render/dashboard')) {
            if (PhaseHistoryCache.isValid()) { event.preventDefault(); elt.setAttribute('hx-disabled', 'true'); setTimeout(() => { elt.removeAttribute('hx-disabled'); }, 100); }
        }
    });

    window.Toast = Toast; window.GracefulDegradation = GracefulDegradation; window.addRetryButton = addRetryButton;
    window.setLoading = setLoading; window.showPhaseLoading = showPhaseLoading; window.hidePhaseLoading = hidePhaseLoading;
    window.showSkeleton = showSkeleton; window.hideSkeleton = hideSkeleton;
    window.PhaseHistoryCache = PhaseHistoryCache; window.ScreenReader = ScreenReader; window.FocusManager = FocusManager;
</script>
{{ end }}
