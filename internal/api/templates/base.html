<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Mini-Orca</title>

    <!-- Tailwind CSS (CDN for dev) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0d1117',
                            800: '#161b22',
                            700: '#21262d',
                            600: '#30363d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>

    <!-- Custom CSS Variables for Dark Theme -->
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-color);
        }
    </style>

    {{ block "styles" . }}{{ end }}
</head>
<body class="h-full flex flex-col">

    <!-- Header -->
    <header id="app-header" class="h-14 bg-dark-800 border-b border-dark-600 flex items-center px-4 shrink-0">
        {{ block "header" . }}{{ end }}
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside id="app-sidebar" class="w-64 bg-dark-800 border-r border-dark-600 flex flex-col shrink-0 overflow-y-auto">
            {{ block "sidebar" . }}{{ end }}
        </aside>

        <!-- Main Content -->
        <main id="app-main" class="flex-1 overflow-auto bg-dark-900">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    <!-- Footer -->
    <footer id="app-footer" class="h-8 bg-dark-800 border-t border-dark-600 flex items-center px-4 shrink-0">
        {{ block "footer" . }}{{ end }}
    </footer>

    {{ block "scripts" . }}{{ end }}
</body>
</html>
