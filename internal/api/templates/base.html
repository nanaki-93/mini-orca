{{ define "base" }}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini-Orca AI Development Assistant">
    <title>{{ .Title }} - Mini-Orca</title>

    <!-- Tailwind CSS (CDN for dev) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/css/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0d1117',
                            800: '#161b22',
                            700: '#21262d',
                            600: '#30363d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/json-enc.js"></script>
    <script>
        // HTMX Global Configuration for Performance
        htmx.config.globalSwapStyle = 'none';
        htmx.config.requestTimeout = 10000;
        htmx.config.disableElementWithAttribute = 'hx-disable';
        htmx.config.selfRequestsOnly = true;
        htmx.config.scrollBehavior = 'instant';
    </script>
</head>
<body class="h-full flex flex-col">

    <!-- Header -->
    <header id="app-header" class="h-14 bg-dark-800 border-b border-dark-600 flex items-center px-4 shrink-0">
        {{ block "header" . }}{{ end }}
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar (file tree) -->
        <aside id="app-sidebar" class="sm:w-64 w-72 bg-dark-800 border-r border-dark-600 flex flex-col shrink-0 overflow-y-auto" role="complementary">
            {{ block "sidebar" . }}{{ end }}
        </aside>

        <!-- Main Content -->
        <main id="app-main" class="flex-1 overflow-auto bg-dark-900 min-h-[calc(100vh-7rem)] sm:min-h-[calc(100vh-5.5rem)]" role="main" tabindex="-1">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    <!-- Footer -->
    <footer id="app-footer" class="h-8 bg-dark-800 border-t border-dark-600 flex items-center px-4 shrink-0" role="contentinfo">
        {{ block "footer" . }}{{ end }}
    </footer>

    <!-- Global Loading Overlay -->
    <div id="global-loading" class="global-loading-overlay">
        <div class="global-loading-spinner relative">
            <div class="spinner-ring"></div>
        </div>
        <span class="global-loading-text">Loading...</span>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="../static/js/base.js"></script>
    <script src="../static/js/loading.js"></script>
    <script src="../static/js/toast.js"></script>
    <script src="../static/js/error.js"></script>
</body>
</html>
{{ end }}
