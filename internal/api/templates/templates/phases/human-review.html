<div class="space-y-4" x-data="{ feedback: '' }">
    <div class="bg-gray-800 rounded-lg p-6">
        <h2 class="text-lg font-semibold text-green-400 mb-4">✅ Final Approval</h2>
        <p class="text-gray-300 mb-4">Review all changes and approve to complete the session.</p>
        
        <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-2">Feedback (optional)</label>
            <textarea x-model="feedback" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm" rows="3"></textarea>
        </div>
        
        <div class="flex space-x-4">
            <button @click="approveSession()" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded text-sm">
                ✅ Approve & Complete
            </button>
            <button @click="rejectSession()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded text-sm">
                🔄 Reject & Revise
            </button>
        </div>
    </div>
</div>
