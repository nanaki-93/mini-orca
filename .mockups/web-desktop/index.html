<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Mini-Orca · Desktop web UI</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="prototype-bar" aria-label="Prototype controls">
      <div class="prototype-label"><span class="prototype-dot"></span><strong>Desktop web UI</strong><span class="prototype-note">Interactive mockup · sample data</span></div>
      <div class="prototype-tools">
        <a class="prototype-button" href="#states">All 28 screens</a>
        <button class="prototype-button" id="finish-run" data-action="complete-run" hidden>Finish run</button>
        <label class="sr-only" for="scene">Screen</label><select id="scene"></select>
        <label class="sr-only" for="scenario">Preview state</label>
        <select id="scenario"><option value="ready">Default state</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="failed">Failed</option><option value="partial">Partial</option><option value="canceled">Canceled</option><option value="stale">Outdated</option><option value="offline">Daemon offline</option></select>
        <button class="prototype-button" id="theme-toggle" aria-label="Switch to light appearance"></button>
        <button class="prototype-button" id="size-toggle" aria-label="Toggle larger text" aria-pressed="false">Aa</button>
        <button class="prototype-button" id="reset-demo" aria-label="Reset mockup">Reset</button>
      </div>
    </div>
    <div class="app-window" id="app">
      <aside class="sidebar" aria-label="Application">
        <a class="brand" href="#summary"><span class="brand-symbol" aria-hidden="true">◒</span><span>mini-orca<span class="brand-period">.</span></span></a>
        <button class="project-switcher" data-action="open-project"><span class="project-avatar">H</span><span class="project-label"><strong id="project-name">harbor</strong><small>Go workspace</small></span><span data-icon="chevrons" class="muted"></span></button>
        <nav class="main-nav" id="navigation" aria-label="Workspaces"></nav>
        <div class="sidebar-bottom"><nav id="utility-navigation" aria-label="Tools"></nav><div class="local-label"><span class="status-dot"></span>Local workspace<span class="shortcut">⌘ K</span></div></div>
      </aside>
      <div class="app-body">
        <header class="topbar"><div class="breadcrumbs" id="breadcrumbs"></div><div class="topbar-actions"><button class="search-trigger" data-action="search"><span data-icon="search"></span><span>Search anything</span><kbd>⌘ K</kbd></button><span class="connection" id="connection"><span class="status-dot"></span>Daemon connected</span><button class="icon-button" data-action="open-project" aria-label="Project menu" title="Project menu"><span data-icon="ellipsis"></span></button></div></header>
        <main id="main" tabindex="-1"></main>
        <div id="terminal-dock"></div>
        <footer class="statusbar"><a href="#project"><span data-icon="branch"></span>main</a><span class="footer-file" id="footer-file">harbor / Go workspace</span><div class="statusbar-right"><a href="#models"><span data-icon="sparkles"></span><span>Models</span></a><button data-action="toggle-terminal"><span data-icon="terminal"></span>Terminal<kbd>⌘ J</kbd></button></div></footer>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
